{
  "components": {
    "schemas": {
      "ErrorResponse": {
        "additionalProperties": true,
        "properties": {
          "code": {
            "type": "string"
          },
          "details": {
            "additionalProperties": true,
            "type": "object"
          },
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ],
        "type": "object"
      },
      "EvidenceResponse": {
        "additionalProperties": true,
        "properties": {
          "data": {
            "additionalProperties": true,
            "type": "object"
          },
          "evidence": {
            "items": {
              "additionalProperties": true,
              "type": "object"
            },
            "type": "array"
          },
          "ok": {
            "type": "boolean"
          },
          "unmet_evidence_reasons": {
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "verdict": {
            "$ref": "#/components/schemas/Verdict"
          }
        },
        "required": [
          "ok"
        ],
        "type": "object"
      },
      "GenericRequest": {
        "additionalProperties": true,
        "description": "Operation-specific JSON input. Unknown or missing required evidence inputs fail closed.",
        "type": "object"
      },
      "Verdict": {
        "description": "WITHHOLD is an intended non-error outcome when required evidence cannot be produced.",
        "enum": [
          "allow",
          "block",
          "deny",
          "verified",
          "bounded",
          "missing",
          "withhold"
        ],
        "type": "string"
      }
    },
    "securitySchemes": {
      "developerAPIKey": {
        "in": "header",
        "name": "X-API-Key",
        "type": "apiKey"
      },
      "ownerSession": {
        "in": "cookie",
        "name": "koschei_owner_session",
        "type": "apiKey"
      },
      "sessionBearer": {
        "bearerFormat": "session",
        "scheme": "bearer",
        "type": "http"
      }
    }
  },
  "info": {
    "description": "Evidence-first API contract generated from the registered server boot chain. Static files, HTML pages, robots.txt and ads.txt are intentionally excluded; every registered /api/ route is included. WITHHOLD is a valid verdict when required evidence is unavailable and carries unmet_evidence_reasons. Evidence counts are never quality scores.",
    "title": "Koschei Web3 Security API",
    "version": "2026-08-02"
  },
  "openapi": "3.1.0",
