<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Yeni Şifre — Koschei ARVIS</title><style>:root{--accent:#00ff88;--accent2:#00ccff;--danger:#ff4466;--text:#f0f0ff;--text2:#8888aa;--bg:#030309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:min(420px,calc(100% - 32px));padding:34px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px}.logo{text-align:center;color:var(--accent);font-size:22px;font-weight:800}.title{text-align:center;font-size:22px;font-weight:800;margin:18px 0 8px}.sub{text-align:center;color:var(--text2);font-size:13px;line-height:1.5;margin-bottom:22px}label{font-size:13px;font-weight:700;display:block;margin:10px 0 8px}input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text);font:inherit}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00130c;cursor:pointer}.msg{display:none;margin-bottom:14px;padding:10px 12px;border-radius:10px;font-size:13px}.msg.show{display:block}.ok{border:1px solid var(--accent);color:var(--accent);background:rgba(0,255,136,.08)}.err{border:1px solid var(--danger);color:var(--danger);background:rgba(255,68,102,.08)}.back{text-align:center;margin-top:16px;font-size:13px}.back a{color:var(--accent);text-decoration:none}</style></head><body><div class="card"><div class="logo">KOSCHEI ARVIS</div><div class="title">Yeni Şifre Belirle</div><div class="sub">E-postadaki güvenli bağlantıdan geldiysen yeni şifreni oluştur.</div><div id="msg" class="msg"></div><form id="form"><label for="password">Yeni şifre</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Yeni şifre tekrar</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit">Şifreyi Güncelle</button></form><div class="back"><a href="/login.html">← Giriş ekranına dön</a></div></div><script>const form=document.getElementById('form'),password=document.getElementById('password'),confirmInput=document.getElementById('confirm'),save=document.getElementById('save'),msg=document.getElementById('msg');function show(text,type){msg.textContent=text;msg.className='msg show '+type}async function authBase(){const r=await fetch('/api/config',{credentials:'same-origin'});const d=await r.json();const b=String(d.neonAuthUrl||'').replace(/\/+$/,'');if(!b)throw new Error('Kimlik doğrulama servisi kullanılamıyor.');return b}const params=new URLSearchParams(location.search),token=params.get('token')||'',providerError=params.get('error')||'';if(providerError||!token){show(providerError==='INVALID_TOKEN'?'Sıfırlama bağlantısının süresi dolmuş veya bağlantı geçersiz. Yeni bağlantı iste.':'Geçerli bir sıfırlama bağlantısı gerekli.','err');form.style.display='none'}form.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirmInput.value){show('Şifreler aynı değil.','err');return}save.disabled=true;try{const base=await authBase();const r=await fetch(base+'/reset-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:password.value,token})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||'Şifre güncellenemedi.')}show('Şifre güncellendi. Şimdi yeni şifrenle giriş yapabilirsin.','ok');form.style.display='none'}catch(err){show(err?.message||'Şifre güncellenemedi.','err')}finally{save.disabled=false}});</script></body></html>
