<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TradePI AI Agents — Sales Queue</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#0b0d12;color:#eef2ff}
    body{margin:0;padding:32px;max-width:1280px;margin-inline:auto}
    h1{margin:0 0 6px} p{color:#9aa4b2}.bar,.grid,.actions{display:flex;gap:12px;flex-wrap:wrap}.grid{margin-top:24px}
    input,button{border:1px solid #2b3442;background:#121722;color:#eef2ff;border-radius:10px;padding:11px 13px}
    input{min-width:220px}button{cursor:pointer;font-weight:700}.card{border:1px solid #202836;background:#10151e;border-radius:14px;padding:16px;flex:1;min-width:300px}
    .item{padding:12px 0;border-bottom:1px solid #202836}.item:last-child{border:0}.score{font-size:24px;font-weight:800}.muted{color:#8d98a7;font-size:13px}.err{color:#ff9b9b}.ok{color:#8ce99a}.actions{margin-top:10px}.actions input{min-width:180px;padding:8px}.actions button{padding:8px 10px}
  </style>
</head>
<body>
  <h1>TradePI AI Sales Queue</h1>
  <p>Hot leads, human handoffs and appointment requests. AI requests actions; only the owner console can resolve or confirm them.</p>
  <div class="bar">
    <input id="token" type="password" autocomplete="off" placeholder="Owner/admin secret">
    <input id="tenant" value="demo-automotive" placeholder="Tenant ID">
    <button id="load">Load queue</button>
  </div>
  <p id="status" class="muted">The secret is used only for API calls from this page and is never embedded in the site.</p>
  <div class="grid">
    <section class="card"><h2>Hot leads</h2><div id="leads"></div></section>
    <section class="card"><h2>Human handoffs</h2><div id="handoffs"></div></section>
    <section class="card"><h2>Appointments</h2><div id="appointments"></div></section>
  </div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function empty(text){return `<div class="muted">${esc(text)}</div>`}
function lead(x){return `<div class="item"><div class="score">${esc(x.score)}</div><b>${esc(x.display_name||x.external_id)}</b><div>${esc(x.stage)} · ${esc(x.channel)}</div><div class="muted">model ${x.model_known?'✓':'–'} · budget ${x.budget_known?'✓':'–'} · location ${x.location_known?'✓':'–'} · trade-in ${x.trade_in_known?'✓':'–'}</div></div>`}
function handoff(x){return `<div class="item"><b>${esc(x.display_name||x.external_id)}</b><div>${esc(x.reason)}</div><div class="muted">${esc(x.channel)} · ${esc(x.status)} · ${esc(new Date(x.requested_at).toLocaleString())}</div><div class="actions"><button onclick="resolveHandoff(${Number(x.id)})">Mark resolved</button></div></div>`}
function appt(x){return `<div class="item"><b>${esc(x.display_name||x.external_id)}</b><div>${esc(x.request_text)}</div><div class="muted">${esc(x.channel)} · request only, not confirmed</div><div class="actions"><input id="when-${Number(x.id)}" type="datetime-local"><button onclick="confirmAppointment(${Number(x.id)})">Confirm</button><button onclick="cancelAppointment(${Number(x.id)})">Cancel</button></div></div>`}
function credentials(){return {token:$('token').value.trim(),tenant:$('tenant').value.trim()||'demo-automotive'}}
async function api(path,options={}){
  const {token}=credentials();
  if(!token) throw new Error('Owner/admin secret required.');
  const headers={Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})};
  const r=await fetch(path,{...options,headers,cache:'no-store'});
  if(!r.ok) throw new Error(r.status===503?'Admin API is not configured yet.':'Admin action failed ('+r.status+').');
  return r.json();
}
async function load(){
  const {tenant}=credentials();
  $('status').textContent='Loading…';$('status').className='muted';
  try{
    const q=await api('/api/agents/admin/queue?tenant_id='+encodeURIComponent(tenant));
    $('leads').innerHTML=q.leads?.length?q.leads.map(lead).join(''):empty('No leads yet.');
    $('handoffs').innerHTML=q.handoffs?.length?q.handoffs.map(handoff).join(''):empty('No pending handoffs.');
    $('appointments').innerHTML=q.appointments?.length?q.appointments.map(appt).join(''):empty('No pending appointment requests.');
    $('status').textContent='Queue loaded. Tenant: '+q.tenant_id;$('status').className='ok';
  }catch(e){$('status').textContent=e.message;$('status').className='err'}
}
async function resolveHandoff(id){
  const {tenant}=credentials();
  try{await api('/api/agents/admin/handoffs/resolve',{method:'POST',body:JSON.stringify({tenant_id:tenant,id})});await load()}catch(e){$('status').textContent=e.message;$('status').className='err'}
}
async function confirmAppointment(id){
  const {tenant}=credentials(), raw=$('when-'+id)?.value;
  if(!raw){$('status').textContent='Select a real date/time before confirming.';$('status').className='err';return}
  try{await api('/api/agents/admin/appointments/update',{method:'POST',body:JSON.stringify({tenant_id:tenant,id,status:'confirmed',scheduled_for:new Date(raw).toISOString()})});await load()}catch(e){$('status').textContent=e.message;$('status').className='err'}
}
async function cancelAppointment(id){
  const {tenant}=credentials();
  try{await api('/api/agents/admin/appointments/update',{method:'POST',body:JSON.stringify({tenant_id:tenant,id,status:'cancelled'})});await load()}catch(e){$('status').textContent=e.message;$('status').className='err'}
}
$('load').addEventListener('click',load);
</script>
</body>
</html>
