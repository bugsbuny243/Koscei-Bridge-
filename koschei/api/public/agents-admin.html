<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TradePI AI Agents — Sales Queue</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#0b0d12;color:#eef2ff}
    body{margin:0;padding:32px;max-width:1280px;margin-inline:auto}
    h1{margin:0 0 6px} p{color:#9aa4b2}.bar,.grid{display:flex;gap:12px;flex-wrap:wrap}.grid{margin-top:24px}
    input,button{border:1px solid #2b3442;background:#121722;color:#eef2ff;border-radius:10px;padding:11px 13px}
    input{min-width:240px}button{cursor:pointer;font-weight:700}.card{border:1px solid #202836;background:#10151e;border-radius:14px;padding:16px;flex:1;min-width:300px}
    .item{padding:12px 0;border-bottom:1px solid #202836}.item:last-child{border:0}.score{font-size:24px;font-weight:800}.muted{color:#8d98a7;font-size:13px}.err{color:#ff9b9b}.ok{color:#8ce99a}code{font-size:12px}
  </style>
</head>
<body>
  <h1>TradePI AI Sales Queue</h1>
  <p>Hot leads, human handoffs and appointment requests. Admin API is fail-closed.</p>
  <div class="bar">
    <input id="token" type="password" autocomplete="off" placeholder="Admin bearer token">
    <input id="tenant" value="demo-automotive" placeholder="Tenant ID">
    <button id="load">Load queue</button>
  </div>
  <p id="status" class="muted">Token is kept only in this page session and is never embedded in the site.</p>
  <div class="grid">
    <section class="card"><h2>Hot leads</h2><div id="leads"></div></section>
    <section class="card"><h2>Human handoffs</h2><div id="handoffs"></div></section>
    <section class="card"><h2>Appointments</h2><div id="appointments"></div></section>
  </div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function empty(text){return `<div class="muted">${esc(text)}</div>`}
function lead(x){return `<div class="item"><div class="score">${esc(x.score)}</div><b>${esc(x.display_name||x.external_id)}</b><div>${esc(x.stage)} · ${esc(x.channel)}</div><div class="muted">model ${x.model_known?'✓':'–'} · budget ${x.budget_known?'✓':'–'} · location ${x.location_known?'✓':'–'} · trade-in ${x.trade_in_known?'✓':'–'}</div></div>`}
function handoff(x){return `<div class="item"><b>${esc(x.display_name||x.external_id)}</b><div>${esc(x.reason)}</div><div class="muted">${esc(x.channel)} · ${esc(x.status)} · ${esc(new Date(x.requested_at).toLocaleString())}</div></div>`}
function appt(x){return `<div class="item"><b>${esc(x.display_name||x.external_id)}</b><div>${esc(x.request_text)}</div><div class="muted">${esc(x.channel)} · ${esc(x.status)} · request only, not confirmed</div></div>`}
async function load(){
  const token=$('token').value.trim(), tenant=$('tenant').value.trim();
  if(!token){$('status').textContent='Admin token required.';$('status').className='err';return}
  $('status').textContent='Loading…';$('status').className='muted';
  try{
    const r=await fetch('/api/agents/admin/queue?tenant_id='+encodeURIComponent(tenant),{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!r.ok) throw new Error(r.status===503?'Admin API is not configured yet.':'Access denied or queue unavailable ('+r.status+').');
    const q=await r.json();
    $('leads').innerHTML=q.leads?.length?q.leads.map(lead).join(''):empty('No leads yet.');
    $('handoffs').innerHTML=q.handoffs?.length?q.handoffs.map(handoff).join(''):empty('No pending handoffs.');
    $('appointments').innerHTML=q.appointments?.length?q.appointments.map(appt).join(''):empty('No pending appointment requests.');
    $('status').textContent='Queue loaded. Tenant: '+q.tenant_id;$('status').className='ok';
  }catch(e){$('status').textContent=e.message;$('status').className='err'}
}
$('load').addEventListener('click',load);
</script>
</body>
</html>
