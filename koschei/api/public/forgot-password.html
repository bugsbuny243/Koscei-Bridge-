<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Şifremi Unuttum — Koschei ARVIS</title><style>:root{--accent:#00ff88;--accent2:#00ccff;--danger:#ff4466;--text:#f0f0ff;--text2:#8888aa;--bg:#030309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:min(420px,calc(100% - 32px));padding:34px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px}.logo{text-align:center;color:var(--accent);font-size:22px;font-weight:800}.title{text-align:center;font-size:22px;font-weight:800;margin:18px 0 8px}.sub{text-align:center;color:var(--text2);font-size:13px;line-height:1.5;margin-bottom:22px}label{font-size:13px;font-weight:700;display:block;margin-bottom:8px}input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text);font:inherit}button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00130c;cursor:pointer}.msg{display:none;margin-bottom:14px;padding:10px 12px;border-radius:10px;font-size:13px}.msg.show{display:block}.ok{border:1px solid var(--accent);color:var(--accent);background:rgba(0,255,136,.08)}.err{border:1px solid var(--danger);color:var(--danger);background:rgba(255,68,102,.08)}.back{text-align:center;margin-top:16px;font-size:13px}.back a{color:var(--accent);text-decoration:none}</style></head><body><div class="card"><div class="logo">KOSCHEI ARVIS</div><div class="title">Şifremi Unuttum</div><div class="sub">E-posta adresini gir. Neon Auth sana güvenli bir şifre sıfırlama bağlantısı gönderecek.</div><div id="msg" class="msg"></div><form id="form"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email" required><button id="send" type="submit">Sıfırlama Bağlantısı Gönder</button></form><div class="back"><a href="/login.html">← Giriş ekranına dön</a></div></div><script>const form=document.getElementById('form'),email=document.getElementById('email'),send=document.getElementById('send'),msg=document.getElementById('msg');function show(text,type){msg.textContent=text;msg.className='msg show '+type}form.addEventListener('submit',async e=>{e.preventDefault();send.disabled=true;try{const r=await fetch('/api/auth/login?action=request_password_reset',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),redirectTo:location.origin+'/reset-password.html'})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||'Sıfırlama isteği gönderilemedi.')}show('Eğer bu e-posta ile bir hesap varsa sıfırlama bağlantısı gönderildi. Gelen kutunu kontrol et.','ok');form.reset()}catch(err){show(err?.message||'Sıfırlama isteği gönderilemedi.','err')}finally{send.disabled=false}});</script></body></html>
