name: Codex Funding Corpus Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/funding-corpus-registry-lifecycle
          fetch-depth: 0
      - name: Fix PostgreSQL 17 lifecycle parameter typing once
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('koschei/api/internal/services/actor_token_lifecycle.go')
          text = p.read_text()
          old = """\t\t\t$1,$2,$3,$4,NULLIF($5,0),$6,$7,$7,
\t\t\tCASE WHEN $10='active' THEN $7 ELSE NULL END,
\t\t\tCASE WHEN $10='active' THEN $7 ELSE NULL END,
\t\t\tCASE WHEN $10='inactive_or_dead' THEN $7 ELSE NULL END,
\t\t\tCASE WHEN $10='inactive_or_dead' THEN $7 ELSE NULL END,
\t\t\t$8,$9,$10,1,0,now(),now()
"""
          new = """\t\t\t$1,$2,$3,$4,NULLIF($5,0),$6,$7::timestamptz,$7::timestamptz,
\t\t\tCASE WHEN $10::text='active' THEN $7::timestamptz ELSE NULL END,
\t\t\tCASE WHEN $10::text='active' THEN $7::timestamptz ELSE NULL END,
\t\t\tCASE WHEN $10::text='inactive_or_dead' THEN $7::timestamptz ELSE NULL END,
\t\t\tCASE WHEN $10::text='inactive_or_dead' THEN $7::timestamptz ELSE NULL END,
\t\t\t$8,$9,$10::text,1,0,now(),now()
"""
          if old in text:
              p.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('actor lifecycle SQL block did not match old or fixed form')
          PY
          if ! git diff --quiet -- koschei/api/internal/services/actor_token_lifecycle.go; then
            cd koschei/api
            gofmt -w internal/services/actor_token_lifecycle.go
            cd ../..
            git config user.name "koschei-codex"
            git config user.email "actions@users.noreply.github.com"
            git add koschei/api/internal/services/actor_token_lifecycle.go
            git commit -m "fix(security): pin lifecycle upsert parameter types"
            git push origin HEAD:agent/funding-corpus-registry-lifecycle
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: koschei/api/go.sum
      - run: go mod download
      - name: Apply migrations to PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=koschei_ci --set=ON_ERROR_STOP=1 --file="$migration" >/dev/null
          done
      - name: Funding acceptance
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_ci?sslmode=disable
        run: |
          set -o pipefail
          echo '$ go test ./internal/services -run Funding'
          go test ./internal/services -run Funding
          echo '$ go test -v ./internal/services -run "TestFundingClusterCorpusPostgres17|TestActorLifecycleRecurrencePostgres17" -count=1'
          go test -v ./internal/services -run 'TestFundingClusterCorpusPostgres17|TestActorLifecycleRecurrencePostgres17' -count=1
