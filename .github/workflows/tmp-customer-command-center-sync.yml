name: Temporary Customer Command Center Sync

on:
  workflow_dispatch:
  push:
    branches:
      - feat/customer-premium-command-center-v1
    paths:
      - .github/workflows/tmp-customer-command-center-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/customer-premium-command-center-v1
          fetch-depth: 0
      - name: Patch dashboard and verification contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          dashboard=Path('koschei/api/public/dashboard.html')
          text=dashboard.read_text()
          css_anchor='<link rel="stylesheet" href="/css/koschei-enterprise-v3.css?v=1">'
          css_insert=css_anchor+'\n<link rel="stylesheet" href="/css/customer-command-center-v1.css?v=1">'
          if '/css/customer-command-center-v1.css?v=1' not in text:
              if css_anchor not in text: raise SystemExit('dashboard css anchor missing')
              text=text.replace(css_anchor,css_insert,1)
          js_anchor='<script src="/js/customer-workspace-v2.js?v=2"></script>'
          js_insert=js_anchor+'\n<script src="/js/customer-command-center-v1.js?v=1"></script>'
          if '/js/customer-command-center-v1.js?v=1' not in text:
              if js_anchor not in text: raise SystemExit('dashboard js anchor missing')
              text=text.replace(js_anchor,js_insert,1)
          dashboard.write_text(text)

          verify=Path('koschei/api/scripts/verify-customer-workspace-v2.js')
          v=verify.read_text()
          marker="requireText(html,'/css/koschei-enterprise-v3.css?v=1','enterprise dashboard style');"
          extra=marker+"\nrequireText(html,'/css/customer-command-center-v1.css?v=1','premium customer command center style');\nrequireText(html,'/js/customer-command-center-v1.js?v=1','premium customer command center behavior');"
          if "premium customer command center style" not in v:
              if marker not in v: raise SystemExit('verify marker missing')
              v=v.replace(marker,extra,1)
          css_marker="requireText(css,'.workspace-report-card','investigation card styles');"
          css_extra=css_marker+"\nconst shellCss=fs.readFileSync(path.join(root,'public','css','customer-command-center-v1.css'),'utf8');\nconst shellJs=fs.readFileSync(path.join(root,'public','js','customer-command-center-v1.js'),'utf8');\nrequireText(shellCss,'.customer-app-shell','premium app shell');\nrequireText(shellCss,'.customer-sidebar','premium sidebar');\nrequireText(shellJs,\"['Deep Investigation','/scan?mode=deep','primary']\",'canonical investigation nav');\nrequireText(shellJs,\"['Account & Plan','/account']\",'account entitlement nav');\nif(/fetch\\s*\\(/.test(shellJs))throw new Error('command center shell must not create parallel unauthenticated data calls');\nif(shellJs.includes('Math.random('))throw new Error('command center shell must not fabricate product state');"
          if "premium app shell" not in v:
              if css_marker not in v: raise SystemExit('verify css marker missing')
              v=v.replace(css_marker,css_extra,1)
          verify.write_text(v)
          PY
      - name: Verify workspace contract
        working-directory: koschei/api
        run: node scripts/verify-customer-workspace-v2.js
      - name: Verify investigation UI contract
        working-directory: koschei/api
        run: node scripts/verify-customer-investigation-ui.js
      - name: Commit product wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/public/dashboard.html koschei/api/scripts/verify-customer-workspace-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(customer): wire premium command center shell"
          git push origin HEAD:feat/customer-premium-command-center-v1
