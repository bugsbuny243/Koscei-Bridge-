name: Release Gates Task 1 Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/release-gates-2026-08-02' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-gates-2026-08-02
          fetch-depth: 0
      - name: Wire exporter into existing retention cadence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('koschei/api/internal/services/security_radar_retention_worker.go')
          s = p.read_text()
          before = '''\tif !w.archiveReady(ctx) {
          \t\tlog.Printf("radar retention: archive tables unavailable; nothing deleted (apply migration 084)")
          \t\treturn
          \t}
          \tbacklog, err := w.unexportedBacklog(ctx)
          '''
          after = '''\tif !w.archiveReady(ctx) {
          \t\tlog.Printf("radar retention: archive tables unavailable; nothing deleted (apply migration 084)")
          \t\treturn
          \t}
          \t// Export the existing backlog before enforcing the ceiling. This allows a
          \t// recovered sink to drain the staging ledger without weakening the guard.
          \tif err := w.exportPendingArchive(ctx, "before_retention"); err != nil {
          \t\tlog.Printf("radar retention: halted; %v", err)
          \t\treturn
          \t}
          \tbacklog, err := w.unexportedBacklog(ctx)
          '''
          if before not in s:
              raise SystemExit('pre-retention insertion anchor not found')
          s = s.replace(before, after, 1)
          before = '''\tif stats.HaltReason == "" {
          \t\tstats.Pruned = w.pruneExportedArchive(ctx)
          \t}
          '''
          after = '''\tif stats.HaltReason == "" {
          \t\tif err := w.exportPendingArchive(ctx, "after_retention"); err != nil {
          \t\t\tstats.HaltReason = err.Error()
          \t\t}
          \t}
          \tif stats.HaltReason == "" {
          \t\tstats.Pruned = w.pruneExportedArchive(ctx)
          \t}
          '''
          if before not in s:
              raise SystemExit('post-retention insertion anchor not found')
          p.write_text(s.replace(before, after, 1))
          PY
          gofmt -w koschei/api/internal/services/security_radar_retention_worker.go koschei/api/internal/services/security_radar_retention_export.go koschei/api/internal/services/retentionexport
      - name: Commit task 1 wiring
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Task 1 wiring already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/internal/services/security_radar_retention_worker.go koschei/api/internal/services/security_radar_retention_export.go koschei/api/internal/services/retentionexport
          git commit -m "retention: wire verified archive export into worker cadence"
          git push origin HEAD:agent/release-gates-2026-08-02
