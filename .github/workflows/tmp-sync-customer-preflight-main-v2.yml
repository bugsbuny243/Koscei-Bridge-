name: Temp Sync Customer Preflight Main V2
on:
  push:
    branches: [feat/customer-transaction-preflight-ui-v1]
    paths: [.github/workflows/tmp-sync-customer-preflight-main-v2.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-transaction-preflight-ui-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Merge current main and verify OpenAPI before push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          cd koschei/api
          go test ./internal/openapi -count=1
          cd ../..
          git diff --check
          git push origin HEAD:feat/customer-transaction-preflight-ui-v1
