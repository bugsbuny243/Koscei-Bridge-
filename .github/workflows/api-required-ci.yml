name: API Required CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "koschei/api/**"
      - "oss/verifier/**"
      - "Dockerfile"
      - "Dockerfile.defense-worker"
      - "Dockerfile.defense-sentinel"
      - ".github/workflows/api-required-ci.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/**"
      - "oss/verifier/**"
      - "Dockerfile"
      - "Dockerfile.defense-worker"
      - "Dockerfile.defense-sentinel"
      - ".github/workflows/api-required-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL migrations, tests, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Validate migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/migration-validation.txt"
          output_file="${RUNNER_TEMP}/migration-output.txt"
          : > "${result_file}"
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "RUN ${migration}" >> "${result_file}"
            if ! psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_ci \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}" \
              > "${output_file}" 2>&1; then
              echo "FAIL ${migration}" >> "${result_file}"
              tail -n 120 "${output_file}" >> "${result_file}"
              cat "${result_file}"
              exit 1
            fi
            echo "PASS ${migration}" >> "${result_file}"
          done
          cat "${result_file}"
      - name: Validate retention archive-delete on PostgreSQL 17
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_ci?sslmode=disable
        run: |
          set -o pipefail
          go test -v ./internal/services -run '^TestRetentionArchiveDeletePostgres17$' -count=1 2>&1 | tee "${RUNNER_TEMP}/retention-archive-postgres17.txt"
      - name: Upload retention archive PostgreSQL log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-archive-postgres17
          path: ${{ runner.temp }}/retention-archive-postgres17.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Validate retention archive export on PostgreSQL 17
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_ci?sslmode=disable
        run: |
          set -o pipefail
          go test -v ./internal/services -run '^TestRetentionArchiveExportPostgres17$' -count=1 2>&1 | tee "${RUNNER_TEMP}/retention-export-postgres17.txt"
      - name: Upload retention archive export PostgreSQL log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-export-postgres17
          path: ${{ runner.temp }}/retention-export-postgres17.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Validate immutable dossier storage
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=koschei_ci --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO dossier_source_snapshots
          (mint,network,verdict_signature,ruleset_version,produced_at,source_hash,canonical_source,source_payload)
          VALUES (
            'ci-mint','solana-mainnet','ci-verdict-signature','ci-ruleset',now(),
            'sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a',
            convert_to('{}','UTF8'),'{}'::jsonb
          );

          DO $$
          DECLARE blocked boolean := false;
          BEGIN
            BEGIN
              UPDATE dossier_source_snapshots SET mint='mutated' WHERE verdict_signature='ci-verdict-signature';
            EXCEPTION WHEN OTHERS THEN
              IF position('immutable dossier records' in SQLERRM)=0 THEN RAISE; END IF;
              blocked := true;
            END;
            IF NOT blocked THEN RAISE EXCEPTION 'source snapshot update was not blocked'; END IF;
          END $$;

          INSERT INTO dossier_exports
          (case_ref,mint,verdict_signature,source_snapshot_id,bundle_hash,canonical_bundle,bundle_json,requested_by)
          SELECT
            'KD1-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','ci-mint','ci-verdict-signature',id,
            'sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a',
            convert_to('{}','UTF8'),'{}'::jsonb,'ci'
          FROM dossier_source_snapshots WHERE verdict_signature='ci-verdict-signature';

          DO $$
          DECLARE update_blocked boolean := false; delete_blocked boolean := false;
          BEGIN
            BEGIN
              UPDATE dossier_exports SET mint='mutated' WHERE case_ref='KD1-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
            EXCEPTION WHEN OTHERS THEN
              IF position('immutable dossier records' in SQLERRM)=0 THEN RAISE; END IF;
              update_blocked := true;
            END;
            BEGIN
              DELETE FROM dossier_exports WHERE case_ref='KD1-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
            EXCEPTION WHEN OTHERS THEN
              IF position('immutable dossier records' in SQLERRM)=0 THEN RAISE; END IF;
              delete_blocked := true;
            END;
            IF NOT update_blocked OR NOT delete_blocked THEN RAISE EXCEPTION 'dossier export mutation was not blocked'; END IF;
          END $$;
          SQL
      - name: Upload migration validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-validation-required
          path: ${{ runner.temp }}/migration-validation.txt
          if-no-files-found: error
          retention-days: 7
      - name: Check public JavaScript
        run: |
          set -euo pipefail
          for file in public/js/*.js; do
            node --check "$file"
          done
          node --check ../../oss/verifier/typescript/verify-dossier.mjs
          node --check scripts/verify-dossier-contract.mjs
          node --check scripts/run-production-investigation-acceptance.mjs
          node scripts/verify-public-scan-request-guard.js
          node scripts/verify-full-scan-truth-contract.js
          node scripts/verify-verdict-card.js
          node scripts/verify-verdict-card-evidence-refs.js
          node scripts/verify-lp-control-evidence-card.js
          node scripts/verify-live-evidence-card.js
          node scripts/verify-customer-investigation-ui.js
          node scripts/verify-report-trust-consistency.js
          node scripts/verify-dossier-contract.mjs
      - name: Check public language and investigation contracts
        run: |
          # The legacy landing page remains Turkish until its dedicated source-copy migration.
          grep -q '<html lang="tr">' public/index.html
          grep -q '<html lang="en">' public/scan.html
          grep -q '<html lang="en">' public/safe-check.html
          grep -q '<html lang="en">' public/security-radar.html
          grep -q 'lp-control-evidence-card.js' public/scan.html
          grep -q 'unified-live-evidence-card.js' public/scan.html
          grep -q 'public-scan-request-guard.js' public/scan.html
          grep -q 'arvis-premium-contract.js' public/scan.html
          grep -q 'customer-arvis-premium-suite.js' public/scan.html
          ! grep -Eqi 'Paste it before|Token ikinci planda|KOSCH stays as|What ARVIS does|Who it is for|Power users|Automatic flow' public/index.html
          ! grep -Eqi 'Login yok|Wallet connect yok|Read-only analiz|İmzalı verdict geçmişi|Taramayı Başlat|Token Tara' public/scan.html
          ! grep -Eqi 'Holder ve likidite|Kontrol ediliyor|Tam Radar' public/safe-check.html
      - name: Test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "${RUNNER_TEMP}/go-test-required.txt"
      - name: Upload Go test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-required
          path: ${{ runner.temp }}/go-test-required.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build ./...

  security:
    name: Secret, vulnerability and static security gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Install Go security scanners
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/security-bin"
          GOBIN="${RUNNER_TEMP}/security-bin" go install golang.org/x/vuln/cmd/govulncheck@latest
          GOBIN="${RUNNER_TEMP}/security-bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
      - name: Reachable vulnerability scan
        run: |
          set -o pipefail
          "${RUNNER_TEMP}/security-bin/govulncheck" ./... 2>&1 | tee "${RUNNER_TEMP}/govulncheck.txt"
      - name: High-confidence static security scan
        if: always()
        run: |
          set -o pipefail
          # G703/G704 are tracked as a bounded legacy taint-analysis backlog.
          # Every other high-severity/high-confidence rule remains blocking.
          "${RUNNER_TEMP}/security-bin/gosec" -severity high -confidence high -exclude-generated -exclude=G703,G704 ./... 2>&1 | tee "${RUNNER_TEMP}/gosec.txt"
      - name: Upload security scanner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scanner-logs
          path: |
            ${{ runner.temp }}/govulncheck.txt
            ${{ runner.temp }}/gosec.txt
          if-no-files-found: warn
          retention-days: 7
