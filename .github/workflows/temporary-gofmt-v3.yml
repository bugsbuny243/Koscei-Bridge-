name: Temporary Permit V3 Gofmt

on:
  push:
    branches:
      - agent/signed-state-recheck-policy-v3

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
      - name: Format only Go files changed from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.go')
          if ((${#files[@]})); then
            gofmt -w "${files[@]}"
          fi
          rm -f .github/workflows/temporary-gofmt-v3.yml
          git add -- "${files[@]}" .github/workflows/temporary-gofmt-v3.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'koschei-ci'
          git config user.email 'koschei-ci@users.noreply.github.com'
          git commit -m 'Format signed State Recheck policy v3'
          git push origin HEAD:agent/signed-state-recheck-policy-v3
