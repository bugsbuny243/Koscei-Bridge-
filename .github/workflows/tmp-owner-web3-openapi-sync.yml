name: Temporary Owner Web3 OpenAPI Sync

on:
  workflow_dispatch:
  push:
    branches:
      - feat/owner-web3-studio-v1
    paths:
      - koschei/api/internal/http/server.go
      - koschei/api/internal/http/route_inventory.go
      - .github/workflows/tmp-owner-web3-openapi-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/owner-web3-studio-v1
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Generate exact OpenAPI contract
        working-directory: koschei/api
        run: go run ./cmd/openapi-gen
      - name: Commit generated contract
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- koschei/api/openapi.yaml; then
            echo "OpenAPI already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml
          git commit -m "chore(openapi): sync owner Web3 routes"
          git push origin HEAD:feat/owner-web3-studio-v1
