name: Node Shield Kernel CI

on:
  pull_request:
    paths:
      - 'koschei/api/internal/nodeshield/**'
      - 'koschei/api/go.mod'
      - 'koschei/api/go.sum'
      - 'scripts/nodeshield-bpf-*.sh'
      - '.github/workflows/node-shield-kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-validation:
    name: Node Shield Go validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: koschei/api/go.sum
      - name: Verify module graph
        run: go mod download
      - name: Unit tests
        run: go test ./internal/nodeshield
      - name: Vet Node Shield
        run: go vet ./internal/nodeshield
      - name: Compile privileged integration harness
        run: go test -tags nodeshield_integration -run '^$' ./internal/nodeshield

  privileged-kernel-enforcement:
    name: Privileged BPF LSM enforcement proof
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, nodeshield-bpf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: koschei/api/go.sum
      - name: Run canonical live kernel proof
        shell: bash
        run: |
          chmod +x scripts/nodeshield-bpf-readiness.sh scripts/nodeshield-bpf-proof.sh koschei/api/internal/nodeshield/bpf/build.sh
          sudo -E scripts/nodeshield-bpf-proof.sh
      - name: Upload tamper-evident kernel proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeshield-kernel-proof-${{ github.sha }}
          path: artifacts/nodeshield-kernel-proof/
          if-no-files-found: error
          retention-days: 30
