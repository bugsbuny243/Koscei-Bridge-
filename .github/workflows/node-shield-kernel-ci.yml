name: Node Shield Kernel CI

on:
  pull_request:
    paths:
      - 'koschei/api/internal/nodeshield/**'
      - 'koschei/api/go.mod'
      - 'koschei/api/go.sum'
      - '.github/workflows/node-shield-kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-validation:
    name: Node Shield Go validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: koschei/api/go.sum
      - name: Verify module graph
        run: go mod download
      - name: Unit tests
        run: go test ./internal/nodeshield
      - name: Vet Node Shield
        run: go vet ./internal/nodeshield
      - name: Compile privileged integration harness
        run: go test -tags nodeshield_integration -run '^$' ./internal/nodeshield

  privileged-kernel-enforcement:
    name: Privileged BPF LSM enforcement proof
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, nodeshield-bpf]
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: koschei/api/go.sum
      - name: Verify privileged runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -eq 0 || { echo 'runner must execute as root'; exit 1; }
          test -f /sys/kernel/btf/vmlinux || { echo 'kernel BTF is required'; exit 1; }
          test -f /sys/fs/cgroup/cgroup.controllers || { echo 'cgroup v2 is required'; exit 1; }
          command -v clang >/dev/null || { echo 'clang is required'; exit 1; }
          command -v bpftool >/dev/null || { echo 'bpftool is required'; exit 1; }
          test -r /sys/kernel/security/lsm || { echo 'securityfs/LSM list is required'; exit 1; }
          grep -qw bpf /sys/kernel/security/lsm || { echo 'BPF LSM is not enabled on this kernel'; exit 1; }
          test -r /usr/include/bpf/bpf_helpers.h || { echo 'libbpf headers are required'; exit 1; }
      - name: Generate CO-RE kernel types
        shell: bash
        run: bpftool btf dump file /sys/kernel/btf/vmlinux format c > internal/nodeshield/bpf/vmlinux.h
      - name: Build and hash BPF objects
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86 ;;
            aarch64|arm64) arch=arm64 ;;
            armv7l|armv8l) arch=arm ;;
            riscv64) arch=riscv ;;
            *) echo "unsupported BPF target architecture: $(uname -m)"; exit 1 ;;
          esac
          chmod +x internal/nodeshield/bpf/build.sh
          TARGET_ARCH="$arch" internal/nodeshield/bpf/build.sh
      - name: Run live kernel enforcement proof
        env:
          NODESHIELD_BPF_MANIFEST: ${{ github.workspace }}/koschei/api/internal/nodeshield/bpf/out/manifest.json
        run: go test -count=1 -v -tags nodeshield_integration -run '^TestLinuxCOREBackendKernelEnforcement$' ./internal/nodeshield
      - name: Remove generated BPF build material
        if: always()
        shell: bash
        run: rm -rf internal/nodeshield/bpf/out internal/nodeshield/bpf/vmlinux.h
