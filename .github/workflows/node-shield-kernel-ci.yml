name: Node Shield Kernel CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'koschei/api/internal/nodeshield/**'
      - 'koschei/api/go.mod'
      - 'koschei/api/go.sum'
      - 'scripts/nodeshield-bpf-*.sh'
      - '.github/workflows/node-shield-kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-validation:
    name: Node Shield Go validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: koschei/api/go.sum
      - name: Verify module graph
        run: go mod download
      - name: Unit tests
        run: go test ./internal/nodeshield
      - name: Vet Node Shield
        run: go vet ./internal/nodeshield
      - name: Compile privileged integration harness
        run: go test -tags nodeshield_integration -run '^$' ./internal/nodeshield

  bpf-object-build:
    name: Node Shield BPF object build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm bpftool libbpf-dev
      - name: Generate runner CO-RE type header
        run: |
          test -r /sys/kernel/btf/vmlinux
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > koschei/api/internal/nodeshield/bpf/vmlinux.h
      - name: Compile and hash BPF objects
        run: |
          chmod +x koschei/api/internal/nodeshield/bpf/build.sh
          TARGET_ARCH=x86 koschei/api/internal/nodeshield/bpf/build.sh
          sha256sum -c koschei/api/internal/nodeshield/bpf/out/SHA256SUMS

  privileged-kernel-enforcement:
    name: Privileged BPF LSM enforcement proof
    # A persistent label must never authorize a later synchronize event. For a
    # PR, root execution is permitted only by the fresh event that ADDS the
    # approval label to the current head. Any new commit requires remove+re-add.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'nodeshield-kernel-proof' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, nodeshield-bpf]
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: koschei/api/go.sum
      - name: Refuse unexpected checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run canonical live kernel proof
        shell: bash
        run: |
          chmod +x scripts/nodeshield-bpf-readiness.sh scripts/nodeshield-bpf-proof.sh koschei/api/internal/nodeshield/bpf/build.sh
          sudo -E scripts/nodeshield-bpf-proof.sh
      - name: Verify proof report exists and is head-commit-bound
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR=artifacts/nodeshield-kernel-proof
          REPORT=${EVIDENCE_DIR}/kernel-proof.json
          test -s "$REPORT"
          test -s "${REPORT}.sha256"
          (cd "$EVIDENCE_DIR" && sha256sum -c kernel-proof.json.sha256)
          grep -Fq '"result": "PASS"' "$REPORT"
          grep -Fq '"test": "TestLinuxCOREBackendKernelEnforcement"' "$REPORT"
          grep -Fq "\"commit_sha\": \"$EXPECTED_SHA\"" "$REPORT"
      - name: Upload tamper-evident kernel proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeshield-kernel-proof-${{ env.EXPECTED_SHA }}
          path: artifacts/nodeshield-kernel-proof/
          if-no-files-found: error
          retention-days: 30
