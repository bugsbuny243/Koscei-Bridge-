name: Temporary PR798 gofmt

on:
  push:
    branches:
      - feat/temporal-funding-trajectory-graph-v1
    paths:
      - "koschei/api/internal/services/persistent_funding_trajectory_graph.go"
      - "koschei/api/internal/services/persistent_funding_trajectory_graph_postgres_test.go"
      - "koschei/api/internal/handlers/unified_wallet_investigation_report.go"
      - ".github/workflows/tmp-pr798-gofmt.yml"

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/temporal-funding-trajectory-graph-v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache: false
      - name: Format only PR798 Go files
        run: |
          set -euo pipefail
          gofmt -w \
            koschei/api/internal/services/persistent_funding_trajectory_graph.go \
            koschei/api/internal/services/persistent_funding_trajectory_graph_postgres_test.go \
            koschei/api/internal/handlers/unified_wallet_investigation_report.go
          if git diff --quiet -- \
            koschei/api/internal/services/persistent_funding_trajectory_graph.go \
            koschei/api/internal/services/persistent_funding_trajectory_graph_postgres_test.go \
            koschei/api/internal/handlers/unified_wallet_investigation_report.go; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            koschei/api/internal/services/persistent_funding_trajectory_graph.go \
            koschei/api/internal/services/persistent_funding_trajectory_graph_postgres_test.go \
            koschei/api/internal/handlers/unified_wallet_investigation_report.go
          git commit -m "style(actor-memory): gofmt temporal funding trajectory"
          git push origin HEAD:feat/temporal-funding-trajectory-graph-v1
