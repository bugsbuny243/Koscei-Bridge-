name: Sync Actor Constellation OpenAPI

on:
  push:
    branches: [feat/actor-constellation-v1]
    paths:
      - ".github/workflows/sync-actor-constellation-openapi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/actor-constellation-v1
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Generate canonical OpenAPI snapshot
        working-directory: koschei/api
        run: go run ./cmd/openapi-gen
      - name: Commit generated snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- koschei/api/openapi.yaml; then
            echo "OpenAPI snapshot already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml
          git commit -m "chore(openapi): sync actor constellation route"
          git push origin HEAD:feat/actor-constellation-v1
