name: Temporary Actor Live Marker Fix

on:
  push:
    branches:
      - fix/actor-reference-live-marker
    paths:
      - .github/workflows/tmp-fix-actor-live-marker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/actor-reference-live-marker
      - name: Replace only the two stale live-page readiness assertions
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/actor-reference-case.yml
          old_count="$(grep -oF "grep -Fq 'ARVIS Public SOC'" "$file" | wc -l | tr -d ' ')"
          if [ "$old_count" != "2" ]; then
            echo "Expected exactly 2 stale live-page assertions; found $old_count" >&2
            exit 1
          fi
          sed -i "s/grep -Fq 'ARVIS Public SOC'/grep -Fq 'ARVIS Public Live Radar'/g" "$file"
          if grep -Fq "grep -Fq 'ARVIS Public SOC'" "$file"; then
            echo "Stale ARVIS Public SOC readiness assertion remains" >&2
            exit 1
          fi
          new_count="$(grep -oF "grep -Fq 'ARVIS Public Live Radar'" "$file" | wc -l | tr -d ' ')"
          if [ "$new_count" != "2" ]; then
            echo "Expected exactly 2 updated live-page assertions; found $new_count" >&2
            exit 1
          fi
          git diff --check
          git diff -- .github/workflows/actor-reference-case.yml
      - name: Commit marker contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "koschei-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/actor-reference-case.yml
          git commit -m "ci(actor): align live readiness marker"
          git push origin HEAD:fix/actor-reference-live-marker
