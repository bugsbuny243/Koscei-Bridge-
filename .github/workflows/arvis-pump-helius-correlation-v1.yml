name: ARVIS Pump Helius Correlation V1 Acceptance

on:
  pull_request:
    paths:
      - 'koschei/api/internal/services/pump_helius_trade_correlation.go'
      - 'koschei/api/internal/services/pump_helius_trade_correlation_test.go'
      - 'koschei/api/internal/handlers/launch_forensics_integration.go'
      - 'docs/arvis-pump-helius-correlation-v1.md'
      - '.github/workflows/arvis-pump-helius-correlation-v1.yml'

permissions:
  contents: read

jobs:
  pump-helius-correlation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Require touched Go files to be formatted
        working-directory: koschei/api
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l internal/services/pump_helius_trade_correlation.go internal/services/pump_helius_trade_correlation_test.go internal/handlers/launch_forensics_integration.go)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Verify bounded cross-source matcher
        working-directory: koschei/api
        run: go test ./internal/services -run 'TestCorrelatePumpPortalTradeTransaction|TestPumpTradeCorrelationUnavailable' -count=1
      - name: Verify no verdict authority was added
        run: |
          set -euo pipefail
          ! grep -Eq 'RiskContribution[[:space:]]*[+\-]?=|StructuralFloor[[:space:]]*[+\-]?=|FinalVerdict|risk_index' koschei/api/internal/services/pump_helius_trade_correlation.go
          grep -q 'source\["pump_helius_trade_correlation"\]' koschei/api/internal/handlers/launch_forensics_integration.go
          grep -q 'HELIUS_SOLANA_RPC_URL' koschei/api/internal/handlers/launch_forensics_integration.go
