name: Public Single CSS Reference Fix

on:
  push:
    branches:
      - refactor/public-single-css-v1

permissions:
  contents: write

jobs:
  fix-references:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/public-single-css-v1
          fetch-depth: 0

      - name: Rewrite retired CSS filename literals
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          api = Path('koschei/api')
          bundle_path = api / 'public/css/koschei.css'
          bundle = bundle_path.read_text(encoding='utf-8')
          retired = set(re.findall(r'/\* ===== source: ([A-Za-z0-9_.-]+\.css) ===== \*/', bundle))
          retired.discard('koschei.css')
          exts = {'.go','.js','.mjs','.cjs','.ts','.tsx','.sh','.md','.html','.yml','.yaml'}
          changed = []
          for path in api.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              if path == bundle_path or path.name == 'consolidate-public-css.py':
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              new = text
              for name in retired:
                  new = new.replace(name, 'koschei.css')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print(f'retired names: {len(retired)}')
          print(f'files updated: {len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No retired CSS filename literals remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api
          git commit -m "test(ui): point CSS verifiers at canonical bundle"
          git push origin HEAD:refactor/public-single-css-v1
