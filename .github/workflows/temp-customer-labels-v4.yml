name: Temp Customer Labels V4
on:
  push:
    branches: [fix/customer-capability-labels-v4]
    paths: [.github/workflows/temp-customer-labels-v4.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-capability-labels-v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch customer shell assets and verifier
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('koschei/api')
          pages=['public/dashboard.html','public/scan.html','public/reports.html','public/watchlist.html','public/account.html']
          for rel in pages:
              p=root/rel
              s=p.read_text()
              s=s.replace('/css/customer-command-center-v1.css?v=1','/css/customer-command-center-v1.css?v=3')
              s=s.replace('/js/customer-command-center-v1.js?v=1','/js/customer-command-center-v1.js?v=3')
              s=s.replace('/js/customer-command-center-v1.js?v=2','/js/customer-command-center-v1.js?v=3')
              p.write_text(s)
          p=root/'scripts/verify-customer-workspace-v2.js'
          s=p.read_text()
          s=s.replace("requireText(html,'/css/customer-command-center-v1.css?v=1','premium customer command center style');","requireText(html,'/css/customer-command-center-v1.css?v=3','premium customer command center style');")
          s=s.replace("requireText(html,'/js/customer-command-center-v1.js?v=1','premium customer command center behavior');","requireText(html,'/js/customer-command-center-v1.js?v=3','premium customer command center behavior');")
          s=s.replace("requireText(shellJs,\"{label:'Deep Investigation',href:'/scan?mode=deep',mode:'primary',access:'STARTER+'}\",'canonical investigation capability');","requireText(shellJs,\"{label:'Overview',href:'/dashboard',access:'PUBLIC'}\",'public overview capability');\nrequireText(shellJs,\"{label:'Deep Investigation',href:'/scan?mode=deep',mode:'primary',access:'PUBLIC'}\",'public investigation capability');")
          s=s.replace("requireText(shellJs,\"{label:'API Reference',href:'/docs/api',access:'ENTERPRISE API'}\",'enterprise developer capability');","requireText(shellJs,\"{label:'API Reference',href:'/docs/api',access:'PUBLIC · MIXED'}\",'mixed public API reference capability');")
          s=s.replace("requireText(shellJs,'Access labels describe minimum route policy; server authorization remains authoritative.','server authorization boundary');","requireText(shellJs,'Access labels describe the current route surface; server authorization remains authoritative.','server authorization boundary');")
          s=s.replace("for(const page of ['scan.html','reports.html','watchlist.html','account.html']){const pageHtml=fs.readFileSync(path.join(root,'public',page),'utf8');requireText(pageHtml,'/css/customer-command-center-v1.css?v=1',page+' shared shell style');requireText(pageHtml,'/js/customer-command-center-v1.js?v=2',page+' shared shell behavior');}","for(const page of ['scan.html','reports.html','watchlist.html','account.html']){const pageHtml=fs.readFileSync(path.join(root,'public',page),'utf8');requireText(pageHtml,'/css/customer-command-center-v1.css?v=3',page+' shared shell style');requireText(pageHtml,'/js/customer-command-center-v1.js?v=3',page+' shared shell behavior');}")
          p.write_text(s)
          PY
      - name: Verify exact customer contract
        working-directory: koschei/api
        run: |
          node ./scripts/verify-customer-workspace-v2.js
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^koschei/api/public/(dashboard|scan|reports|watchlist|account)\.html$|^koschei/api/scripts/verify-customer-workspace-v2\.js$' || true)"
          test -z "$unexpected"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/public/dashboard.html koschei/api/public/scan.html koschei/api/public/reports.html koschei/api/public/watchlist.html koschei/api/public/account.html koschei/api/scripts/verify-customer-workspace-v2.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(customer): sync capability labels and shell assets'
          git push origin HEAD:fix/customer-capability-labels-v4
