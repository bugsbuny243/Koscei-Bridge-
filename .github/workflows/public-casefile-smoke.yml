name: Public Casefile Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/public-casefile-smoke.yml"
      - "koschei/api/internal/handlers/public_case_page.go"
      - "koschei/api/internal/handlers/public_case_summary.go"
      - "koschei/api/internal/handlers/public_case_operational.go"
      - "koschei/api/internal/handlers/public_case_operational_test.go"
      - "koschei/api/internal/http/dossier_routes.go"
      - "koschei/api/public/css/public-case-summary.css"
      - "koschei/api/public/css/public-case-operational.css"
      - "koschei/api/public/js/public-soc.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-casefile-smoke.yml"
      - "koschei/api/internal/handlers/public_case_page.go"
      - "koschei/api/internal/handlers/public_case_summary.go"
      - "koschei/api/internal/handlers/public_case_operational.go"
      - "koschei/api/internal/handlers/public_case_operational_test.go"
      - "koschei/api/internal/http/dossier_routes.go"
      - "koschei/api/public/css/public-case-summary.css"
      - "koschei/api/public/css/public-case-operational.css"
      - "koschei/api/public/js/public-soc.js"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: public-casefile-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ARVIS operational case contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate public client and operational ownership
        run: |
          set -euo pipefail
          node --check koschei/api/public/js/public-soc.js
          grep -Fq '/case/' koschei/api/public/js/public-soc.js
          grep -Fq 'currentCases' koschei/api/public/js/public-soc.js
          grep -Fq 'ARVIS ŞİMDİ NE YAPACAK?' koschei/api/internal/handlers/public_case_operational.go
          grep -Fq 'Sorumlu worker' koschei/api/internal/handlers/public_case_operational.go
          grep -Fq 'Kullanıcıdan gereken' koschei/api/internal/handlers/public_case_operational.go
          grep -Fq 'müşterinin manuel görevi değildir' koschei/api/internal/handlers/public_case_operational.go
          grep -Fq 'PublicCaseOperationalPage' koschei/api/internal/http/dossier_routes.go
          grep -Fq '.job-list' koschei/api/public/css/public-case-operational.css
          if grep -Fq 'NE YAPMALI?' koschei/api/internal/handlers/public_case_operational.go; then
            echo 'Operational case still assigns investigation homework to the customer.' >&2
            exit 1
          fi
          if grep -Eq '<script|<pre>' koschei/api/internal/handlers/public_case_operational.go; then
            echo 'Operational case contains raw/executable presentation tags.' >&2
            exit 1
          fi

  production-smoke:
    name: Verify ARVIS operational case in production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://tradepigloball.co
      CASE_REF: KD1-g7epiavjdqtk5dsz3s2ynewjkobd2rxz
    steps:
      - name: Wait for and verify public operational case
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 90); do
            page_code="$(curl --silent --show-error --max-time 20 \
              --dump-header casefile.headers \
              --output casefile.html \
              --write-out '%{http_code}' \
              "${BASE_URL}/case/${CASE_REF}" || true)"
            base_css_code="$(curl --silent --show-error --max-time 20 \
              --output public-case-summary.css \
              --write-out '%{http_code}' \
              "${BASE_URL}/css/public-case-summary.css?v=1" || true)"
            ops_css_code="$(curl --silent --show-error --max-time 20 \
              --output public-case-operational.css \
              --write-out '%{http_code}' \
              "${BASE_URL}/css/public-case-operational.css?v=1" || true)"
            js_code="$(curl --silent --show-error --max-time 20 \
              --output public-soc.js \
              --write-out '%{http_code}' \
              "${BASE_URL}/js/public-soc.js?v=1" || true)"

            if [ "${page_code}" = "200" ] \
               && [ "${base_css_code}" = "200" ] \
               && [ "${ops_css_code}" = "200" ] \
               && [ "${js_code}" = "200" ] \
               && grep -Fq "${CASE_REF}" casefile.html \
               && grep -Fq 'ARVIS ŞİMDİ NE YAPACAK?' casefile.html \
               && grep -Fq 'Açık otomatik işler' casefile.html \
               && grep -Fq 'Sorumlu worker' casefile.html \
               && grep -Fq 'Otomatik işlem' casefile.html \
               && grep -Fq 'Neden açık?' casefile.html \
               && grep -Fq 'Kullanıcıdan gereken' casefile.html \
               && grep -Fq 'Koschei worker' casefile.html \
               && grep -Fq 'Ham teknik dossier' casefile.html \
               && grep -Fq '.job-list' public-case-operational.css \
               && grep -Fq 'currentCases' public-soc.js \
               && ! grep -Fq 'NE YAPMALI?' casefile.html \
               && ! grep -Eq '<pre>|window\.|<script' casefile.html; then
              ready=true
              break
            fi

            echo "Operational case not ready (attempt ${attempt}/90; page=${page_code}; base_css=${base_css_code}; ops_css=${ops_css_code}; js=${js_code})."
            sleep 10
          done

          if [ "${ready}" != true ]; then
            echo 'ARVIS operational public case failed production verification.' >&2
            cat casefile.headers >&2 || true
            head -c 5000 casefile.html >&2 || true
            exit 1
          fi

          grep -Eiq '^content-security-policy: ' casefile.headers
          grep -Eiq '^cache-control: ' casefile.headers
          echo "Verified ${BASE_URL}/case/${CASE_REF}"

      - name: Upload production case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-casefile-production-smoke
          path: |
            casefile.html
            casefile.headers
            public-case-summary.css
            public-case-operational.css
            public-soc.js
          if-no-files-found: warn
          retention-days: 30

      - name: Publish machine-readable casefile status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='ARVIS operational public case verification failed'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${JOB_STATUS}" = success ]; then
            state=success
            description="Verified ARVIS worker ownership for ${CASE_REF}"
            target_url="${BASE_URL}/case/${CASE_REF}"
          fi
          export STATE="${state}" DESCRIPTION="${description}" TARGET_URL="${target_url}"
          payload="$(node <<'NODE'
          process.stdout.write(JSON.stringify({
            state: process.env.STATE,
            context: 'koschei/public-casefile',
            description: process.env.DESCRIPTION.slice(0, 140),
            target_url: process.env.TARGET_URL
          }));
          NODE
          )"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}" > /dev/null
