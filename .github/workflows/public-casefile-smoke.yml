name: Public Casefile Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/public-casefile-smoke.yml"
      - "koschei/api/internal/handlers/public_case_page.go"
      - "koschei/api/internal/handlers/public_case_summary.go"
      - "koschei/api/internal/handlers/public_security_cases.go"
      - "koschei/api/internal/http/dossier_routes.go"
      - "koschei/api/public/css/public-case-summary.css"
      - "koschei/api/public/js/public-soc.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-casefile-smoke.yml"
      - "koschei/api/internal/handlers/public_case_page.go"
      - "koschei/api/internal/handlers/public_case_summary.go"
      - "koschei/api/internal/handlers/public_security_cases.go"
      - "koschei/api/internal/http/dossier_routes.go"
      - "koschei/api/public/css/public-case-summary.css"
      - "koschei/api/public/js/public-soc.js"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: public-casefile-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate public security result contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate decision, evidence and action surface
        run: |
          set -euo pipefail
          node --check koschei/api/public/js/public-soc.js
          grep -Fq 'PublicCaseSummaryPage' koschei/api/internal/http/dossier_routes.go
          grep -Fq 'ARVIS KARARI' koschei/api/internal/handlers/public_case_summary.go
          grep -Fq 'NE BULDUK?' koschei/api/internal/handlers/public_case_summary.go
          grep -Fq 'NEDEN ÖNEMLİ?' koschei/api/internal/handlers/public_case_summary.go
          grep -Fq 'NE YAPMALISIN?' koschei/api/internal/handlers/public_case_summary.go
          grep -Fq 'Değişmez kanıt dosyasını aç' koschei/api/internal/handlers/public_case_summary.go
          grep -Fq 'Güvenlik sonucunu aç' koschei/api/public/js/public-soc.js
          grep -Fq '.grade>b.word' koschei/api/public/css/public-case-summary.css
          ! grep -Fq 'PublicCaseOperationalPage' koschei/api/internal/http/dossier_routes.go
          ! grep -Fq 'Sorumlu worker' koschei/api/internal/handlers/public_case_summary.go
          ! grep -Fq 'ARVIS ŞİMDİ NE YAPACAK?' koschei/api/internal/handlers/public_case_summary.go
          ! grep -Eq '<pre>|<script' koschei/api/internal/handlers/public_case_summary.go

  production-smoke:
    name: Verify public security result in production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://tradepigloball.co
      CASE_REF: KD1-g7epiavjdqtk5dsz3s2ynewjkobd2rxz
    steps:
      - name: Wait for and verify public result
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 90); do
            page_code="$(curl --silent --show-error --max-time 20 --dump-header casefile.headers --output casefile.html --write-out '%{http_code}' "${BASE_URL}/case/${CASE_REF}" || true)"
            css_code="$(curl --silent --show-error --max-time 20 --output public-case-summary.css --write-out '%{http_code}' "${BASE_URL}/css/public-case-summary.css?v=3" || true)"
            js_code="$(curl --silent --show-error --max-time 20 --output public-soc.js --write-out '%{http_code}' "${BASE_URL}/js/public-soc.js?v=3" || true)"
            if [ "${page_code}" = "200" ] \
               && [ "${css_code}" = "200" ] \
               && [ "${js_code}" = "200" ] \
               && grep -Fq "${CASE_REF}" casefile.html \
               && grep -Fq 'ARVIS KARARI' casefile.html \
               && grep -Fq 'NE BULDUK?' casefile.html \
               && grep -Fq 'NEDEN ÖNEMLİ?' casefile.html \
               && grep -Fq 'NE YAPMALISIN?' casefile.html \
               && grep -Fq 'Değişmez kanıt dosyasını aç' casefile.html \
               && grep -Fq '.grade>b.word' public-case-summary.css \
               && grep -Fq 'Güvenlik sonucunu aç' public-soc.js \
               && ! grep -Fq 'Sorumlu worker' casefile.html \
               && ! grep -Fq 'ARVIS ŞİMDİ NE YAPACAK?' casefile.html \
               && ! grep -Eq '<pre>|window\.|<script' casefile.html; then
              ready=true
              break
            fi
            echo "Public security result not ready (attempt ${attempt}/90; page=${page_code}; css=${css_code}; js=${js_code})."
            sleep 10
          done
          if [ "${ready}" != true ]; then
            echo 'Public security result failed production verification.' >&2
            cat casefile.headers >&2 || true
            head -c 5000 casefile.html >&2 || true
            exit 1
          fi
          grep -Eiq '^content-security-policy: ' casefile.headers
          grep -Eiq '^cache-control: ' casefile.headers

      - name: Upload production case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-casefile-production-smoke
          path: |
            casefile.html
            casefile.headers
            public-case-summary.css
            public-soc.js
          if-no-files-found: warn
          retention-days: 30

      - name: Publish machine-readable casefile status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Public ARVIS security result verification failed'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${JOB_STATUS}" = success ]; then
            state=success
            description="Verified public ARVIS security result ${CASE_REF}"
            target_url="${BASE_URL}/case/${CASE_REF}"
          fi
          export STATE="${state}" DESCRIPTION="${description}" TARGET_URL="${target_url}"
          payload="$(node <<'NODE'
          process.stdout.write(JSON.stringify({
            state: process.env.STATE,
            context: 'koschei/public-casefile',
            description: process.env.DESCRIPTION.slice(0, 140),
            target_url: process.env.TARGET_URL
          }));
          NODE
          )"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}" > /dev/null
