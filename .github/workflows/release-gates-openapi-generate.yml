name: Release Gates OpenAPI Generate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.head_ref == 'agent/release-gates-2026-08-02' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-gates-2026-08-02
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Generate OpenAPI 3.1 from registered routes
        run: |
          gofmt -w internal/openapi cmd/openapi-gen
          go run ./cmd/openapi-gen
      - name: Commit generated contract
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "OpenAPI contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml koschei/api/internal/openapi koschei/api/cmd/openapi-gen
          git commit -m "openapi: document registered Web3 Security API routes"
          git push origin HEAD:agent/release-gates-2026-08-02
