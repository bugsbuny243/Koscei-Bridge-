name: Deploy Koschei Web3 production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy the exact main checkout to the existing Railway production service.
concurrency:
  group: koschei-web3-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refuse deploy without Railway token
        shell: sh
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN GitHub Actions secret is missing"; exit 1; }

      - name: Deploy exact repository state to existing production service
        shell: sh
        run: |
          railway up \
            --project c6a5e53d-9bcb-4b2d-a0c0-8de013538b35 \
            --environment 48ab5bb7-8135-4c60-bb47-57603a1678bd \
            --service 74c9f3f8-19bf-40fe-89da-62002a72f025 \
            --ci \
            --message "GitHub main $GITHUB_SHA"
