name: Gofmt PR 929 V2

on:
  push:
    branches:
      - feat/safe-execution-assurance-api

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/safe-execution-assurance-api
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Format touched Go files
        working-directory: koschei/api
        run: |
          gofmt -w \
            internal/executionproof/safe_attestation.go \
            internal/executionproof/safe_attestation_test.go \
            internal/handlers/execution_assurance_safe_api.go \
            internal/handlers/execution_assurance_safe_api_test.go \
            internal/handlers/execution_assurance_safe_config_test.go \
            internal/http/server.go \
            internal/http/route_inventory.go

      - name: Commit formatting when changed
        run: |
          if git diff --quiet -- '*.go'; then
            echo "Go files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/internal/executionproof/safe_attestation.go \
                  koschei/api/internal/executionproof/safe_attestation_test.go \
                  koschei/api/internal/handlers/execution_assurance_safe_api.go \
                  koschei/api/internal/handlers/execution_assurance_safe_api_test.go \
                  koschei/api/internal/handlers/execution_assurance_safe_config_test.go \
                  koschei/api/internal/http/server.go \
                  koschei/api/internal/http/route_inventory.go
          git commit -m "style(go): format trusted Safe assurance changes"
          git push origin HEAD:feat/safe-execution-assurance-api
