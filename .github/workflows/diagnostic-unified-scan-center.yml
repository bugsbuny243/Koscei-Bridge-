name: Diagnostic unified Scan Center

on:
  pull_request:
    branches: [main]
    paths:
      - "koschei/api/public/scan.html"
      - "koschei/api/public/dashboard.html"
      - "koschei/api/public/js/public-solana-scan.js"
      - "koschei/api/public/js/unified-scan-navigation.js"
      - "koschei/api/internal/http/static_aliases.go"
      - ".github/workflows/diagnostic-unified-scan-center.yml"

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm --prefix "${RUNNER_TEMP}/scan-proof" init -y
          npm --prefix "${RUNNER_TEMP}/scan-proof" install playwright@1.55.0
          "${RUNNER_TEMP}/scan-proof/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise all modes and dashboard
        env:
          NODE_PATH: ${{ runner.temp }}/scan-proof/node_modules
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/unified-scan-proof"
          python3 -m http.server 4173 --directory koschei/api/public >"${RUNNER_TEMP}/scan-http.log" 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:4173/scan.html >/dev/null && break
            sleep 1
          done
          cat > "${RUNNER_TEMP}/verify-unified-scan.cjs" <<'NODE'
          const path=require('path');
          const {chromium}=require('playwright');
          const output=path.join(process.env.RUNNER_TEMP,'unified-scan-proof');
          const root=process.cwd();
          const mint='9cRCn9rGT8V2imeM2BaKs13yhMEais3ruM3rPvTGpump';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1050},deviceScaleFactor:1});
            const calls=[];
            await page.route('**/api/arvis/preflight',async route=>{
              calls.push('preflight');
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({score:63,decision:'warn',risk_level:'medium',human_message:'Fast evidence boundary completed.',coverage_warning:'Holder and liquidity evidence were not evaluated in this result.',not_checked:['holder_distribution','liquidity'],reasons:['Unverified target context']})});
            });
            await page.route('**/api/public/transaction-simulate',async route=>{
              calls.push('transaction');
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({action:'block',risk_index:91,risk_level:'critical',summary:'Dangerous instruction pattern observed.',transaction_fingerprint:'tx-proof-123',simulation:{units_consumed:48211},program_ids:['11111111111111111111111111111111'],findings:[{severity:'critical',title:'Authority transfer',evidence:'simulated instruction'}],warning:'Read-only shadow mode. Transaction was not broadcast.'})});
            });
            await page.route('**/api/token/scan',async route=>{
              calls.push('token');
              await route.fulfill({status:200,contentType:'application/json',body:'{}'});
            });
            await page.goto('http://127.0.0.1:4173/scan.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(200);
            await page.addScriptTag({path:path.join(root,'koschei/api/public/js/unified-scan-navigation.js')});
            await page.evaluate(()=>document.querySelectorAll('[data-reveal]').forEach(node=>node.classList.add('is-visible')));

            const audit=async label=>{
              const state=await page.evaluate(()=>({
                lang:document.documentElement.lang,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                scanLinks:[...document.querySelectorAll('nav a[href]')].filter(a=>new URL(a.href).pathname==='/scan').length,
                legacyNav:[...document.querySelectorAll('nav a[href]')].filter(a=>['/safe-check','/transaction-shield','/security-radar'].includes(new URL(a.href).pathname)).length
              }));
              if(state.lang!=='en')throw new Error(`${label}: lang=${state.lang}`);
              if(state.overflow)throw new Error(`${label}: horizontal overflow`);
              if(state.scanLinks!==1)throw new Error(`${label}: expected one nav Scan Center link, got ${state.scanLinks}`);
              if(state.legacyNav!==0)throw new Error(`${label}: legacy scanner links remain in navigation`);
            };

            await audit('initial');
            for(const mode of ['quick','token','transaction','deep']){
              await page.locator(`[data-scan-mode="${mode}"]`).click();
              const pressed=await page.locator(`[data-scan-mode="${mode}"]`).getAttribute('aria-pressed');
              if(pressed!=='true')throw new Error(`${mode}: mode not active`);
              const txHidden=await page.locator('#transactionFields').evaluate(node=>node.hidden);
              const targetHidden=await page.locator('#targetFields').evaluate(node=>node.hidden);
              if(mode==='transaction'&&(!targetHidden||txHidden))throw new Error('transaction: wrong fields visible');
              if(mode!=='transaction'&&(targetHidden||!txHidden))throw new Error(`${mode}: wrong fields visible`);
              await audit(mode);
              await page.screenshot({path:path.join(output,`scan-${mode}-desktop.png`),fullPage:true});
            }

            await page.locator('[data-scan-mode="quick"]').click();
            await page.fill('#target','example-target');
            await page.selectOption('#kind','site');
            await page.click('#submit');
            await page.waitForSelector('text=QUICK PREFLIGHT');
            if(!calls.includes('preflight'))throw new Error('quick mode did not call preflight endpoint');

            await page.locator('[data-scan-mode="transaction"]').click();
            await page.fill('#transaction','AQAAAAAAAAAAAAAAAAAAAA==');
            await page.click('#submit');
            await page.waitForSelector('text=DO NOT SIGN');
            await page.waitForSelector('text=tx-proof-123');
            if(!calls.includes('transaction'))throw new Error('transaction mode did not call simulation endpoint');
            await page.screenshot({path:path.join(output,'scan-transaction-result.png'),fullPage:true});

            await page.locator('[data-scan-mode="token"]').click();
            await page.fill('#target',mint);
            await page.click('#submit');
            await page.waitForSelector('text=DEGRADED DEPENDENCY');
            if(!calls.includes('token'))throw new Error('token mode did not call token endpoint');

            await page.close();

            const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await mobile.goto('http://127.0.0.1:4173/scan.html?mode=transaction',{waitUntil:'domcontentloaded'});
            await mobile.waitForTimeout(150);
            await mobile.evaluate(()=>document.querySelectorAll('[data-reveal]').forEach(node=>node.classList.add('is-visible')));
            const mobileOverflow=await mobile.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            if(mobileOverflow)throw new Error('scan mobile: horizontal overflow');
            await mobile.screenshot({path:path.join(output,'scan-transaction-mobile.png'),fullPage:true});
            await mobile.close();

            const dashboard=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            await dashboard.goto('http://127.0.0.1:4173/dashboard.html',{waitUntil:'domcontentloaded'});
            await dashboard.waitForTimeout(150);
            await dashboard.addScriptTag({path:path.join(root,'koschei/api/public/js/unified-scan-navigation.js')});
            await dashboard.evaluate(()=>document.querySelectorAll('[data-reveal]').forEach(node=>node.classList.add('is-visible')));
            const workspace=await dashboard.evaluate(()=>({
              mint:!!document.querySelector('#mint'),
              scanner:!!document.querySelector('#scan'),
              copy:document.body.innerText.includes('Workspace, not another scanner'),
              scanLinks:[...document.querySelectorAll('nav a[href]')].filter(a=>new URL(a.href).pathname==='/scan').length,
              overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2
            }));
            if(workspace.mint||workspace.scanner)throw new Error('dashboard still contains scanner controls');
            if(!workspace.copy)throw new Error('dashboard workspace contract missing');
            if(workspace.scanLinks!==1)throw new Error(`dashboard expected one scan link, got ${workspace.scanLinks}`);
            if(workspace.overflow)throw new Error('dashboard: horizontal overflow');
            await dashboard.screenshot({path:path.join(output,'dashboard-desktop.png'),fullPage:true});
            await dashboard.close();
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node "${RUNNER_TEMP}/verify-unified-scan.cjs"
          test "$(find "${RUNNER_TEMP}/unified-scan-proof" -name '*.png' | wc -l)" -eq 7
          sha256sum "${RUNNER_TEMP}/unified-scan-proof"/*.png
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: unified-scan-center-proof
          path: ${{ runner.temp }}/unified-scan-proof/*.png
          if-no-files-found: error
          retention-days: 7
