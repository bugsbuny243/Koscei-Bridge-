name: Public Discovery Revocation V1 Acceptance

on:
  pull_request:
    paths:
      - 'koschei/api/internal/handlers/public_dossier_cases_v2.go'
      - 'koschei/api/internal/handlers/public_discovery_revocation_test.go'
      - 'koschei/api/internal/handlers/public_radar_live.go'
      - 'koschei/api/internal/http/dossier_routes.go'
      - 'koschei/api/public/js/public-soc.js'
      - 'koschei/api/scripts/verify-public-discovery-revocation-v1.js'
      - 'koschei/api/scripts/verify-public-case-registry-integrity-v1.js'
      - '.github/workflows/public-discovery-revocation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-discovery-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_discovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_discovery_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    env:
      PGPASSWORD: postgres
      KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_discovery_ci?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify touched Go formatting
        run: |
          set -euo pipefail
          files=(
            internal/handlers/public_dossier_cases_v2.go
            internal/handlers/public_discovery_revocation_test.go
          )
          diff -u <(cat "${files[@]}") <(gofmt "${files[@]}")

      - name: Compile handlers
        run: go test ./internal/handlers -run '^$'

      - name: Apply migrations on PostgreSQL 17
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "RUN ${migration}"
            psql "${KOSCHEI_TEST_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file="${migration}"
          done

      - name: Verify publish-to-hide registry revocation
        run: go test ./internal/handlers -run '^TestPublicDossierCasesV2RevokesDiscoveryAfterHidePostgres17$' -count=1

      - name: Verify discovery revocation contract
        run: node scripts/verify-public-discovery-revocation-v1.js

      - name: Verify public registry integrity regression
        run: node scripts/verify-public-case-registry-integrity-v1.js
