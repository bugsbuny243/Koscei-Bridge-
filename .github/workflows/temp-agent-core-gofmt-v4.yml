name: Temp Agent Core Gofmt V4
on:
  push:
    branches: [fix/tradepi-agent-core-gofmt-v4]
    paths: [.github/workflows/temp-agent-core-gofmt-v4.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tradepi-agent-core-gofmt-v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Format exact failing file
        run: |
          gofmt -w koschei/api/internal/agents/core.go
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'koschei/api/internal/agents/core.go'
          git diff --check
      - name: Verify Agent packages
        working-directory: koschei/api
        run: |
          go test ./internal/agents ./internal/http -count=1
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/internal/agents/core.go
          git commit -m 'fix(agents): gofmt persisted action history'
          git push origin HEAD:fix/tradepi-agent-core-gofmt-v4
