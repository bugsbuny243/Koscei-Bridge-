name: Codex Task0 Exact Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task0:
    name: Exact Task 0 commands
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/funding-corpus-registry-lifecycle
          fetch-depth: 0
      - name: Apply staged integration patch once
        working-directory: .
        run: |
          if [ -f .codex/apply_funding_patches.py ]; then
            python - <<'PY'
          from pathlib import Path
          p = Path('.codex/apply_funding_patches.py')
          text = p.read_text()
          marker = '# Keep recurrence in ARVIS metadata and funding-arm lineage.'
          start = text.index('replace(\n    "internal/services/arvis_arms.go",\n    "\\te := append', text.index(marker))
          end = text.index('\n\n# Give the scan an existing request-scoped DB store', start)
          p.write_text(text[:start] + text[end:])
          PY
            python .codex/apply_funding_patches.py
            cd koschei/api
            find . -name '*.go' -type f -print0 | xargs -0 gofmt -w
            cd ../..
            rm -f .codex/apply_funding_patches.py .github/workflows/codex-apply-funding-patches.yml
            rmdir .codex 2>/dev/null || true
            git config user.name "koschei-codex"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "feat(security): wire funding recurrence and lifecycle corpus"
            git push origin HEAD:agent/funding-corpus-registry-lifecycle
          fi
      - name: Set up Go 1.25.12
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: koschei/api/go.sum
      - name: Record toolchain
        run: go version
      - name: Download modules
        run: go mod download
      - name: Task 0 exact verification
        run: |
          set -o pipefail
          echo '$ gofmt -l .'
          gofmt -l .
          echo '$ go build ./...'
          go build ./...
          echo '$ go test ./...'
          go test ./...
          echo '$ go test -race ./internal/handlers ./internal/services'
          go test -race ./internal/handlers ./internal/services
