name: Codex Exit Corpus Stage

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'agent/operator-exit-corpus-warmup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-exit-corpus-warmup
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: koschei/api/go.sum
      - name: Apply deterministic integration patch
        run: python3 .codex/exit_corpus_patch.py
      - name: Format changed Go files
        run: gofmt -w koschei/api/internal/services/actor_defense_store.go koschei/api/internal/services/actor_exit_events.go koschei/api/internal/services/actor_exit_events_test.go koschei/api/internal/services/unified_radar_c008.go koschei/api/internal/services/unified_radar_c008_test.go koschei/api/internal/handlers/unified_investigation_report.go koschei/api/internal/handlers/unified_investigation_evidence_refs.go koschei/api/internal/handlers/canonical_verdict_sync.go koschei/api/internal/handlers/owner_funding_corpus_warmup.go koschei/api/internal/handlers/owner_funding_corpus_warmup_test.go koschei/api/internal/handlers/dossier_track_exit_events_test.go koschei/api/internal/http/server.go
      - name: Commit staged product changes once
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name koschei-codex
          git config user.email actions@users.noreply.github.com
          git add koschei/api
          git commit -m "feat(security): wire exit corpus and funding warm-up"
          git push origin HEAD:agent/operator-exit-corpus-warmup
