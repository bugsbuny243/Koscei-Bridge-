name: Wave 34 OpenAPI Sync

on:
  push:
    branches:
      - feat/saas-billing-kosch-decoupling-v1
    paths:
      - ".github/workflows/sync-openapi-wave34.yml"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/internal/http/**"
      - "koschei/api/openapi.yaml"

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'bugsbuny243/Koschei-Web3-Hub' && github.actor == 'bugsbuny243'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/saas-billing-kosch-decoupling-v1
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Generate committed OpenAPI contract
        working-directory: koschei/api
        run: go run ./cmd/openapi-gen -output openapi.yaml
      - name: Commit generated contract when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- koschei/api/openapi.yaml; then
            echo "OpenAPI contract already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml
          git commit -m "docs(openapi): sync SaaS billing contract"
          git push origin HEAD:feat/saas-billing-kosch-decoupling-v1
