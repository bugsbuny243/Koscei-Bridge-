name: Publication Transition Integrity V1 Acceptance

on:
  pull_request:
    paths:
      - 'koschei/api/internal/handlers/dossier_integrity.go'
      - 'koschei/api/internal/handlers/dossier_integrity_test.go'
      - 'koschei/api/internal/handlers/public_dossier_cases.go'
      - 'koschei/api/internal/handlers/autopublish_worker.go'
      - 'koschei/api/internal/handlers/autopublish_policy.go'
      - 'koschei/api/scripts/verify-publication-transition-integrity-v1.js'
      - '.github/workflows/publication-transition-integrity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-transition-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Check touched Go formatting
        shell: bash
        run: |
          diff="$(gofmt -d internal/handlers/dossier_integrity.go internal/handlers/dossier_integrity_test.go internal/handlers/public_dossier_cases.go internal/handlers/autopublish_worker.go)"
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            exit 1
          fi
      - name: Compile handler package without running tests
        run: go test ./internal/handlers -run '^$' -count=1
      - name: Verify shared dossier integrity behavior
        run: go test ./internal/handlers -run '^TestVerifyStoredDossierBundle' -count=1
      - name: Verify deterministic autopublish policy tests
        run: go test ./internal/handlers -run 'Autopublish|autopublish' -count=1
      - name: Verify publication transition contract
        run: node scripts/verify-publication-transition-integrity-v1.js
