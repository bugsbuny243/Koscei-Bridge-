name: OpenAPI Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "koschei/api/openapi.yaml"
      - "koschei/api/cmd/openapi-gen/**"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/internal/http/**"
      - ".github/workflows/openapi-contract.yml"
  push:
    branches: [main, feat/saas-billing-kosch-decoupling-v1]
    paths:
      - "koschei/api/openapi.yaml"
      - "koschei/api/cmd/openapi-gen/**"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/internal/http/**"
      - ".github/workflows/openapi-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate OpenAPI 3.1 syntax and semantics
        run: |
          python -m pip install --disable-pip-version-check openapi-spec-validator==0.7.2
          openapi-spec-validator openapi.yaml
      - name: Generate expected OpenAPI contract
        run: go run ./cmd/openapi-gen -output "${RUNNER_TEMP}/openapi.generated.yaml"
      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openapi-generated-contract
          path: ${{ runner.temp }}/openapi.generated.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Verify registered route drift
        run: |
          go run ./cmd/openapi-gen -check
          go test ./internal/openapi -count=1

  sync-wave34-generated-contract:
    if: github.event_name == 'push' && github.ref_name == 'feat/saas-billing-kosch-decoupling-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saas-billing-kosch-decoupling-v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Regenerate committed OpenAPI contract
        run: go run ./cmd/openapi-gen
      - name: Commit generated contract when changed
        run: |
          if git diff --quiet -- openapi.yaml; then
            echo 'OpenAPI contract already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.yaml
          git commit -m 'chore(openapi): regenerate route contract'
          git push origin HEAD:feat/saas-billing-kosch-decoupling-v1
