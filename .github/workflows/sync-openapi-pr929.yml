name: Sync OpenAPI PR 929

on:
  push:
    branches:
      - feat/safe-execution-assurance-api

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/safe-execution-assurance-api
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Generate canonical OpenAPI contract
        working-directory: koschei/api
        run: go run ./cmd/openapi-gen

      - name: Commit generated contract when changed
        run: |
          if git diff --quiet -- koschei/api/openapi.yaml; then
            echo "OpenAPI contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml
          git commit -m "docs(api): sync generated OpenAPI contract"
          git push origin HEAD:feat/safe-execution-assurance-api
