name: Temp Customer Capability Label Fix
on:
  push:
    branches: [fix/customer-capability-labels-v2]
    paths: [.github/workflows/temp-customer-label-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-capability-labels-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch labels and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('koschei/api')
          js=root/'public/js/customer-command-center-v1.js'
          s=js.read_text()
          replacements={
            "{label:'Overview',href:'/dashboard',access:'ACCOUNT'}":"{label:'Overview',href:'/dashboard',access:'PUBLIC'}",
            "{label:'Deep Investigation',href:'/scan?mode=deep',mode:'primary',access:'STARTER+'}":"{label:'Deep Investigation',href:'/scan?mode=deep',mode:'primary',access:'PUBLIC'}",
            "{label:'API Reference',href:'/docs/api',access:'ENTERPRISE API'}":"{label:'API Reference',href:'/docs/api',access:'PUBLIC · MIXED'}",
            "Access labels describe minimum route policy; server authorization remains authoritative.":"Access labels describe the current route surface; server authorization remains authoritative."
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'missing JS marker: {old}')
            s=s.replace(old,new)
          js.write_text(s)
          pages=['dashboard.html','scan.html','reports.html','watchlist.html','account.html']
          for name in pages:
            p=root/'public'/name
            t=p.read_text()
            t,n1=re.subn(r'/css/customer-command-center-v1\.css\?v=\d+', '/css/customer-command-center-v1.css?v=3', t)
            t,n2=re.subn(r'/js/customer-command-center-v1\.js\?v=\d+', '/js/customer-command-center-v1.js?v=3', t)
            if n1!=1 or n2!=1: raise SystemExit(f'{name}: expected one css/js shell ref, got {n1}/{n2}')
            p.write_text(t)
          v=root/'scripts/verify-customer-workspace-v2.js'
          t=v.read_text()
          reps={
            "requireText(html,'/css/customer-command-center-v1.css?v=1','premium customer command center style');":"requireText(html,'/css/customer-command-center-v1.css?v=3','premium customer command center style');",
            "requireText(html,'/js/customer-command-center-v1.js?v=1','premium customer command center behavior');":"requireText(html,'/js/customer-command-center-v1.js?v=3','premium customer command center behavior');",
            "requireText(shellJs,\"{label:'Deep Investigation',href:'/scan?mode=deep',mode:'primary',access:'STARTER+'}\",'canonical investigation capability');":"requireText(shellJs,\"{label:'Overview',href:'/dashboard',access:'PUBLIC'}\",'public overview capability');\nrequireText(shellJs,\"{label:'Deep Investigation',href:'/scan?mode=deep',mode:'primary',access:'PUBLIC'}\",'public investigation capability');",
            "requireText(shellJs,\"{label:'API Reference',href:'/docs/api',access:'ENTERPRISE API'}\",'enterprise developer capability');":"requireText(shellJs,\"{label:'API Reference',href:'/docs/api',access:'PUBLIC · MIXED'}\",'mixed public API reference capability');",
            "requireText(shellJs,'Access labels describe minimum route policy; server authorization remains authoritative.','server authorization boundary');":"requireText(shellJs,'Access labels describe the current route surface; server authorization remains authoritative.','server authorization boundary');",
            "requireText(pageHtml,'/css/customer-command-center-v1.css?v=1',page+' shared shell style');requireText(pageHtml,'/js/customer-command-center-v1.js?v=2',page+' shared shell behavior');":"requireText(pageHtml,'/css/customer-command-center-v1.css?v=3',page+' shared shell style');requireText(pageHtml,'/js/customer-command-center-v1.js?v=3',page+' shared shell behavior');"
          }
          for old,new in reps.items():
            if old not in t: raise SystemExit(f'missing verifier marker: {old}')
            t=t.replace(old,new)
          v.write_text(t)
          PY
      - name: Verify customer workspace
        working-directory: koschei/api
        run: node scripts/verify-customer-workspace-v2.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/public koschei/api/scripts/verify-customer-workspace-v2.js
          git diff --cached --check
          git commit -m 'fix(customer): correct capability route labels'
          git push origin HEAD:fix/customer-capability-labels-v2
