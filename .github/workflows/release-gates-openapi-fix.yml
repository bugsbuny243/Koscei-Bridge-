name: Release Gates OpenAPI Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/release-gates-2026-08-02' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-gates-2026-08-02
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Repair generator and generate document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/openapi/generator.go')
          s = p.read_text()
          old = '"evidence": map[string]any{"type": "array", "items": map[string]any{"type": "object", "additionalProperties": true},\n'
          new = '"evidence": map[string]any{"type": "array", "items": map[string]any{"type": "object", "additionalProperties": true}},\n'
          if old not in s:
              if new not in s:
                  raise SystemExit('generator repair anchor not found')
          else:
              p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w internal/openapi cmd/openapi-gen
          go run ./cmd/openapi-gen
          go test ./internal/openapi
          go run ./cmd/openapi-gen -check
      - name: Commit repaired generated contract
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "OpenAPI contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml koschei/api/internal/openapi koschei/api/cmd/openapi-gen
          git commit -m "openapi: generate registered Web3 Security API contract"
          git push origin HEAD:agent/release-gates-2026-08-02
