name: Temporary OpenAPI Branch Regeneration

on:
  push:
    branches:
      - feat/customer-state-recheck-v1

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Regenerate committed OpenAPI contract
        working-directory: koschei/api
        run: go run ./cmd/openapi-gen
      - name: Commit generated contract when changed
        shell: bash
        run: |
          set -euo pipefail
          git add koschei/api/openapi.yaml
          if git diff --cached --quiet; then
            echo "OpenAPI contract already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(openapi): regenerate state recheck contract"
          git push origin HEAD:feat/customer-state-recheck-v1
