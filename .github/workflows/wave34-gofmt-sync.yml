name: Wave34 Gofmt Sync

on:
  push:
    branches: [feat/saas-billing-kosch-decoupling-v1]
    paths:
      - "**/*.go"
      - ".github/workflows/wave34-gofmt-sync.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saas-billing-kosch-decoupling-v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache: false
      - name: Format Go tree
        run: gofmt -w koschei/api
      - name: Commit formatting when changed
        run: |
          if git diff --quiet -- '*.go'; then
            echo 'Go tree already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go'
          git commit -m 'chore(go): gofmt wave34 tree'
          git push origin HEAD:feat/saas-billing-kosch-decoupling-v1
