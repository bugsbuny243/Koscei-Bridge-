name: Pi ARVIS branch normalizer

on:
  push:
    branches:
      - feat/arvis-pi-first-class-v1

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'bugsbuny243/Koschei-Web3-Hub'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/arvis-pi-first-class-v1
          fetch-depth: 0
      - name: Gofmt Pi ARVIS files
        run: |
          gofmt -w \
            koschei/api/internal/services/pi_horizon.go \
            koschei/api/internal/services/pi_horizon_test.go \
            koschei/api/internal/services/pi_arvis.go \
            koschei/api/internal/services/pi_runtime_bridge.go \
            koschei/api/internal/services/arvis_multichain.go \
            koschei/api/internal/handlers/security_radar_pi.go \
            koschei/api/internal/handlers/security_radar_pi_test.go \
            koschei/api/internal/handlers/security_radar_alert_wrapper.go
      - name: Commit normalization only when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "koschei-ci"
          git config user.email "actions@users.noreply.github.com"
          git add koschei/api/internal/services/pi_horizon.go \
                  koschei/api/internal/services/pi_horizon_test.go \
                  koschei/api/internal/services/pi_arvis.go \
                  koschei/api/internal/services/pi_runtime_bridge.go \
                  koschei/api/internal/services/arvis_multichain.go \
                  koschei/api/internal/handlers/security_radar_pi.go \
                  koschei/api/internal/handlers/security_radar_pi_test.go \
                  koschei/api/internal/handlers/security_radar_alert_wrapper.go
          git commit -m "style(arvis): gofmt Pi customer path"
          git push origin HEAD:feat/arvis-pi-first-class-v1
