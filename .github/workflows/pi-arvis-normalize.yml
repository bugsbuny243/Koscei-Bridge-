name: Pi ARVIS branch normalizer

on:
  push:
    branches:
      - feat/arvis-pi-first-class-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'bugsbuny243/Koschei-Web3-Hub'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/arvis-pi-first-class-v1
          fetch-depth: 0
      - name: Repair bounded Horizon collector syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('koschei/api/internal/services/pi_horizon.go')
          s = p.read_text()
          old = '''\t\tfor _, payment := range paymentPage.Embedded.Records {\n\t\t\tif strings.EqualFold(payment.Type, "payment") && payment.AssetCode == target.AssetCode && payment.AssetIssuer == target.Issuer && (payment.From == target.Issuer || payment.SourceAccount == target.Issuer) {\n\t\t\t\tout.IssuerPayments = append(out.IssuerPayments, payment)\n\t\t\t}\n\t}\n\n\toperationsQuery :='''
          new = '''\t\tfor _, payment := range paymentPage.Embedded.Records {\n\t\t\tif strings.EqualFold(payment.Type, "payment") && payment.AssetCode == target.AssetCode && payment.AssetIssuer == target.Issuer && (payment.From == target.Issuer || payment.SourceAccount == target.Issuer) {\n\t\t\t\tout.IssuerPayments = append(out.IssuerPayments, payment)\n\t\t\t}\n\t\t}\n\t}\n\n\toperationsQuery :='''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Gofmt Pi ARVIS files
        shell: bash
        run: |
          gofmt -w \
            koschei/api/internal/services/pi_horizon.go \
            koschei/api/internal/services/pi_horizon_test.go \
            koschei/api/internal/services/pi_arvis.go \
            koschei/api/internal/services/pi_runtime_bridge.go \
            koschei/api/internal/services/arvis_multichain.go
      - name: Commit normalization only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "koschei-ci"
          git config user.email "actions@users.noreply.github.com"
          git add koschei/api/internal/services/pi_horizon.go \
                  koschei/api/internal/services/pi_horizon_test.go \
                  koschei/api/internal/services/pi_arvis.go \
                  koschei/api/internal/services/pi_runtime_bridge.go \
                  koschei/api/internal/services/arvis_multichain.go
          git commit -m "style(arvis): normalize Pi adapter"
          git push origin HEAD:feat/arvis-pi-first-class-v1
