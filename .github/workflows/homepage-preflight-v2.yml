name: Homepage Preflight V2 Acceptance

on:
  pull_request:
    paths:
      - 'koschei/api/public/index.html'
      - 'koschei/api/public/js/homepage-preflight-v2.js'
      - 'koschei/api/scripts/verify-homepage-preflight-v2.js'
      - '.github/workflows/homepage-preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check homepage JavaScript syntax
        run: node --check koschei/api/public/js/homepage-preflight-v2.js
      - name: Verify fail-closed homepage contract
        run: node koschei/api/scripts/verify-homepage-preflight-v2.js
