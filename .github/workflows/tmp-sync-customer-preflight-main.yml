name: Temp Sync Customer Preflight Main
on:
  push:
    branches: [feat/customer-transaction-preflight-ui-v1]
    paths: [.github/workflows/tmp-sync-customer-preflight-main.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-transaction-preflight-ui-v1
          fetch-depth: 0
      - name: Merge latest main without changing product patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git diff --check
          git push origin HEAD:feat/customer-transaction-preflight-ui-v1
