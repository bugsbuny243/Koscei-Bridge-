name: Public Single CSS Refactor

on:
  push:
    branches:
      - refactor/public-single-css-v1

permissions:
  contents: write

concurrency:
  group: public-single-css-refactor
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/public-single-css-v1
          fetch-depth: 0

      - name: Consolidate public styles
        run: python3 koschei/api/scripts/consolidate-public-css.py

      - name: Commit generated refactor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api
          git commit -m "refactor(ui): consolidate public CSS into one stylesheet"
          git push origin HEAD:refactor/public-single-css-v1
