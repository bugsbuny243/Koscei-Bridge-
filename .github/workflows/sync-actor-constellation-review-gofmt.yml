name: Sync Actor Constellation Review Gofmt

on:
  push:
    branches: [feat/actor-constellation-v1]
    paths:
      - ".github/workflows/sync-actor-constellation-review-gofmt.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/actor-constellation-v1
      - name: Format constellation files
        working-directory: koschei/api
        run: gofmt -w internal/services/actor_constellation*.go internal/handlers/owner_actor_constellation.go
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- koschei/api/internal/services/actor_constellation*.go koschei/api/internal/handlers/owner_actor_constellation.go; then
            echo "constellation files already gofmt-clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/internal/services/actor_constellation*.go koschei/api/internal/handlers/owner_actor_constellation.go
          git commit -m "style(actor): gofmt constellation review fixes"
          git push origin HEAD:feat/actor-constellation-v1
