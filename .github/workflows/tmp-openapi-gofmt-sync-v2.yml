name: Temp OpenAPI Gofmt Sync V2
on:
  push:
    branches: [fix/openapi-main-drift-20260827-v2]
    paths: [.github/workflows/tmp-openapi-gofmt-sync-v2.yml]
permissions:
  contents: write
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openapi-main-drift-20260827-v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Apply exact gofmt blockers
        run: |
          set -euo pipefail
          gofmt -w \
            koschei/api/internal/agents/channel_delivery.go \
            koschei/api/internal/agents/followup_worker.go \
            koschei/api/internal/http/agent_extended_routes.go
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            koschei/api/internal/agents/channel_delivery.go \
            koschei/api/internal/agents/followup_worker.go \
            koschei/api/internal/http/agent_extended_routes.go)"
          test "$changed" = "$expected"
          cd koschei/api
          go test ./internal/openapi -count=1
          cd ../..
          git diff --check
      - name: Commit exact formatting repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            koschei/api/internal/agents/channel_delivery.go \
            koschei/api/internal/agents/followup_worker.go \
            koschei/api/internal/http/agent_extended_routes.go
          git commit -m 'fix(ci): gofmt latest agent routes'
          git push origin HEAD:fix/openapi-main-drift-20260827-v2
