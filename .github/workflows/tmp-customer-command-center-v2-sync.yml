name: Temporary Customer Command Center V2 Sync

on:
  push:
    branches:
      - feat/customer-premium-command-center-v2
    paths:
      - .github/workflows/tmp-customer-command-center-v2-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/customer-premium-command-center-v2
          fetch-depth: 0
      - name: Patch shared shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js=Path('koschei/api/public/js/customer-command-center-v1.js')
          text=js.read_text()
          text=text.replace("const main=document.querySelector('main.wrap');", "const main=document.querySelector('main.wrap, main.page, main.ops-page');")
          text=text.replace("const header=main.querySelector('.top');if(!header)return;", "const header=main.querySelector('.top, .ops-nav');if(!header)return;")
          text=text.replace("trigger.type='button';trigger.className='btn customer-mobile-trigger';trigger.textContent='Menu';", "trigger.type='button';trigger.className=(header.classList.contains('ops-nav')?'ops-btn ':'btn ')+'customer-mobile-trigger';trigger.textContent='Menu';")
          js.write_text(text)

          css=Path('koschei/api/public/css/customer-command-center-v1.css')
          c=css.read_text()
          extra='.customer-main>.page,.customer-main>.ops-page{max-width:1500px;margin:auto;padding:22px clamp(18px,3vw,42px) 72px}.customer-main .ops-nav{position:sticky;top:0;z-index:20;margin:-22px calc(clamp(18px,3vw,42px)*-1) 20px;padding:15px clamp(18px,3vw,42px);background:rgba(7,10,14,.86);backdrop-filter:blur(16px);border-bottom:1px solid #1c252d}.customer-main .ops-nav .ops-brand{display:none}.customer-main>.page .top .brand{display:none}.customer-main>.page .top{position:sticky;top:0;z-index:20;margin:-22px calc(clamp(18px,3vw,42px)*-1) 20px;padding:15px clamp(18px,3vw,42px);background:rgba(7,10,14,.86);backdrop-filter:blur(16px);border-bottom:1px solid #1c252d}.customer-main .ops-panel,.customer-main .access-section,.customer-main .access-hero,.customer-main .access-state-card{border-radius:14px!important}.customer-main .ops-btn{border-radius:9px}.customer-main .ops-hero{margin-top:0}.customer-main .page .surface{border-radius:14px!important}'
          if extra not in c: c += extra
          c=c.replace('.customer-main>.wrap{padding:14px 12px 56px}', '.customer-main>.wrap,.customer-main>.page,.customer-main>.ops-page{padding:14px 12px 56px}')
          c=c.replace('.customer-main .top{margin:-14px -12px 14px;padding:11px 12px}', '.customer-main .top,.customer-main .ops-nav{margin:-14px -12px 14px;padding:11px 12px}')
          css.write_text(c)

          for name in ['scan.html','reports.html','watchlist.html','account.html']:
              p=Path('koschei/api/public')/name
              t=p.read_text()
              css_anchor='<link rel="stylesheet" href="/css/koschei-enterprise-v3.css?v=1">'
              if '/css/customer-command-center-v1.css?v=1' not in t:
                  if css_anchor not in t: raise SystemExit(f'{name}: css anchor missing')
                  t=t.replace(css_anchor, css_anchor+'\n<link rel="stylesheet" href="/css/customer-command-center-v1.css?v=1">',1)
              js_anchor='<script src="/js/koschei-global-shell.js?v=4"></script>'
              if '/js/customer-command-center-v1.js?v=2' not in t:
                  if js_anchor not in t: raise SystemExit(f'{name}: js anchor missing')
                  t=t.replace(js_anchor, '<script src="/js/customer-command-center-v1.js?v=2"></script>\n'+js_anchor,1)
              p.write_text(t)

          verify=Path('koschei/api/scripts/verify-customer-workspace-v2.js')
          v=verify.read_text()
          marker="requireText(shellJs,\"['Account & Plan','/account']\",'account entitlement nav');"
          additions=marker+"\nrequireText(shellJs,\"main.wrap, main.page, main.ops-page\",'shared customer surface mount');\nrequireText(shellJs,\".top, .ops-nav\",'shared customer header mount');\nfor(const page of ['scan.html','reports.html','watchlist.html','account.html']){const pageHtml=fs.readFileSync(path.join(root,'public',page),'utf8');requireText(pageHtml,'/css/customer-command-center-v1.css?v=1',page+' shared shell style');requireText(pageHtml,'/js/customer-command-center-v1.js?v=2',page+' shared shell behavior');}"
          if 'shared customer surface mount' not in v:
              if marker not in v: raise SystemExit('verify marker missing')
              v=v.replace(marker,additions,1)
          verify.write_text(v)
          PY
      - name: Verify customer workspace
        working-directory: koschei/api
        run: node scripts/verify-customer-workspace-v2.js
      - name: Verify investigation UI
        working-directory: koschei/api
        run: node scripts/verify-customer-investigation-ui.js
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/public/js/customer-command-center-v1.js koschei/api/public/css/customer-command-center-v1.css koschei/api/public/scan.html koschei/api/public/reports.html koschei/api/public/watchlist.html koschei/api/public/account.html koschei/api/scripts/verify-customer-workspace-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(customer): share premium shell across customer surfaces"
          git push origin HEAD:feat/customer-premium-command-center-v2
