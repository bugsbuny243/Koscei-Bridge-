name: Public Product Smoke

on:
  pull_request:
    paths:
      - "koschei/api/**"
      - ".github/workflows/public-product-smoke.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/**"
      - ".github/workflows/public-product-smoke.yml"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: public-product-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify public pages, ARVIS surfaces, SOC APIs and published case
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      BASE_URL: https://tradepigloball.co
    steps:
      - name: Probe public product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          probe() {
            local name="$1"
            local path="$2"
            curl --location --silent --show-error --max-time 25 \
              --dump-header "diagnostics/${name}.headers" \
              --output "diagnostics/${name}.body" \
              --write-out '%{http_code}' \
              "${BASE_URL}${path}" || true
          }

          expect_200() {
            local name="$1"
            local path="$2"
            local marker="$3"
            local code
            code="$(probe "${name}" "${path}")"
            echo "${name}_code=${code}" | tee -a diagnostics/result.txt
            if [ "${code}" != "200" ]; then
              echo "PUBLIC_PRODUCT_FAILURE: ${path} returned HTTP ${code}." >&2
              exit 21
            fi
            grep -Fq "${marker}" "diagnostics/${name}.body" || {
              echo "PUBLIC_PRODUCT_CONTRACT_FAILURE: ${path} is missing marker ${marker}." >&2
              exit 22
            }
          }

          expect_200 health /health '"status":"ok"'
          expect_200 cases_page /cases "Yayınlanmış Güvenlik Vakaları"
          expect_200 live_page /live "Canlı SOC"
          expect_200 login_page /login "Giriş Yap"
          expect_200 register_page /register "Hesap Oluştur"

          # Core ARVIS pages must be live, source-English, and wired to the
          # canonical premium + Complete Evidence v3 result contract.
          expect_200 arvis_scan /scan "Public Evidence Scan"
          expect_200 arvis_dashboard /dashboard "Security Workspace"
          expect_200 safe_check /safe-check "Safe Check"
          expect_200 security_radar /security-radar "ARVIS Security Radar"
          expect_200 owner_production /owner-production.html "Owner Evidence Operations"
          expect_200 complete_evidence_asset /js/arvis-complete-evidence-v3.js "completeEvidenceVersion='3.0.0'"
          expect_200 social_renderer_asset /js/arvis-social-render-v2-publish.js "socialRendererVersion='2.0.0'"

          for page in arvis_scan arvis_dashboard safe_check security_radar owner_production; do
            grep -Fq '<html lang="en">' "diagnostics/${page}.body" || {
              echo "ARVIS_LANGUAGE_FAILURE: ${page} is not source-English." >&2
              exit 33
            }
          done
          for marker in \
            'arvis-premium-contract.js' \
            'customer-arvis-premium-suite.js' \
            'arvis-complete-evidence-v3.js' \
            'arvis-social-render-v2-core.js'; do
            grep -Fq "${marker}" diagnostics/arvis_scan.body || {
              echo "ARVIS_SCAN_CONTRACT_FAILURE: /scan is missing ${marker}." >&2
              exit 34
            }
          done
          grep -Fq 'arvis-complete-evidence-v3.js' diagnostics/owner_production.body || {
            echo 'OWNER_ARVIS_CONTRACT_FAILURE: owner production is missing Complete Evidence v3.' >&2
            exit 35
          }

          cases_api_code="$(probe cases_api '/api/public/cases?limit=100')"
          feed_api_code="$(probe feed_api /api/public/soc/feed)"
          echo "cases_api_code=${cases_api_code}" | tee -a diagnostics/result.txt
          echo "feed_api_code=${feed_api_code}" | tee -a diagnostics/result.txt
          [ "${cases_api_code}" = "200" ] || { echo "PUBLIC_CASES_API_FAILURE: HTTP ${cases_api_code}." >&2; exit 23; }
          [ "${feed_api_code}" = "200" ] || { echo "PUBLIC_SOC_API_FAILURE: HTTP ${feed_api_code}." >&2; exit 24; }
          grep -Fq '"ok":true' diagnostics/cases_api.body || { echo 'PUBLIC_CASES_API_CONTRACT_FAILURE: ok=true missing.' >&2; exit 25; }
          grep -Fq '"ok":true' diagnostics/feed_api.body || { echo 'PUBLIC_SOC_API_CONTRACT_FAILURE: ok=true missing.' >&2; exit 26; }

          case_ref="$(node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('diagnostics/cases_api.body', 'utf8'));
          const item = Array.isArray(payload.cases) ? payload.cases.find(value => /^KD1-[a-z0-9]+$/i.test(String(value?.case_ref || ''))) : null;
          if (!item) process.exit(2);
          process.stdout.write(String(item.case_ref));
          NODE
          )" || {
            echo 'PUBLIC_CASE_REGISTRY_FAILURE: no published KD1 case is available.' >&2
            exit 27
          }
          printf '%s\n' "case_ref=${case_ref}" | tee -a diagnostics/result.txt

          case_code="$(probe case_page "/case/${case_ref}")"
          dossier_code="$(probe dossier_page "/dossier/${case_ref}")"
          echo "case_code=${case_code}" | tee -a diagnostics/result.txt
          echo "dossier_code=${dossier_code}" | tee -a diagnostics/result.txt
          [ "${case_code}" = "200" ] || { echo "PUBLIC_CASE_PAGE_FAILURE: HTTP ${case_code}." >&2; exit 28; }
          [ "${dossier_code}" = "200" ] || { echo "PUBLIC_DOSSIER_PAGE_FAILURE: HTTP ${dossier_code}." >&2; exit 29; }
          grep -Fq "${case_ref}" diagnostics/case_page.body || { echo 'PUBLIC_CASE_PAGE_CONTRACT_FAILURE: case ref missing.' >&2; exit 30; }
          grep -Fq "${case_ref}" diagnostics/dossier_page.body || { echo 'PUBLIC_DOSSIER_PAGE_CONTRACT_FAILURE: case ref missing.' >&2; exit 31; }
          grep -Fq 'Koschei ARVIS' diagnostics/case_page.body || { echo 'PUBLIC_CASE_PAGE_CONTRACT_FAILURE: ARVIS marker missing.' >&2; exit 32; }

          echo 'PUBLIC_PRODUCT_HEALTHY: ARVIS pages/assets, public APIs, and current immutable case passed.'

      - name: Upload public product diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-product-smoke-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Publish machine-readable status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Public product, ARVIS page/asset, SOC API or published-case smoke failed'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${JOB_STATUS}" = success ]; then
            state=success
            description='Production ARVIS pages/assets, SOC APIs and immutable case verified'
            target_url="${BASE_URL}/security-radar"
          fi
          export STATE="${state}" DESCRIPTION="${description}" TARGET_URL="${target_url}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"koschei/public-product",description:process.env.DESCRIPTION.slice(0,140),target_url:process.env.TARGET_URL}))')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}" >/dev/null
