name: Public Product Smoke

on:
  pull_request:
    paths:
      - "koschei/api/**"
      - ".github/workflows/public-product-smoke.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/**"
      - ".github/workflows/public-product-smoke.yml"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: public-product-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify public pages, canonical Scan Center, full scan, SOC APIs and published case
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://tradepigloball.co
      KOSCHEI_FULL_SCAN_MINT: HHPpU9u56Bwxov12nf7DXUCuv6h1q5j1xgGS3yukpump
      FULL_SCAN_TIMEOUT_MS: "300000"
      OUTPUT_DIR: diagnostics
    steps:
      - name: Checkout smoke probes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Probe public product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          probe() {
            local name="$1"
            local path="$2"
            curl --location --silent --show-error --max-time 25 \
              --dump-header "diagnostics/${name}.headers" \
              --output "diagnostics/${name}.body" \
              --write-out '%{http_code}' \
              "${BASE_URL}${path}" || true
          }

          expect_200() {
            local name="$1"
            local path="$2"
            local marker="$3"
            local code
            code="$(probe "${name}" "${path}")"
            echo "${name}_code=${code}" | tee -a diagnostics/result.txt
            if [ "${code}" != "200" ]; then
              echo "PUBLIC_PRODUCT_FAILURE: ${path} returned HTTP ${code}." >&2
              exit 21
            fi
            grep -Fq "${marker}" "diagnostics/${name}.body" || {
              echo "PUBLIC_PRODUCT_CONTRACT_FAILURE: ${path} is missing marker ${marker}." >&2
              exit 22
            }
          }

          wait_expect_200() {
            local name="$1"
            local path="$2"
            local marker="$3"
            local attempts="${4:-18}"
            local code=""
            for attempt in $(seq 1 "${attempts}"); do
              code="$(probe "${name}" "${path}")"
              if [ "${code}" = "200" ] && grep -Fq "${marker}" "diagnostics/${name}.body"; then
                echo "${name}_code=${code} deployed_attempt=${attempt}" | tee -a diagnostics/result.txt
                return 0
              fi
              echo "WAITING_FOR_DEPLOY: ${path} marker=${marker} attempt=${attempt}/${attempts} code=${code}" >&2
              sleep 10
            done
            echo "PRODUCTION_DEPLOY_CONTRACT_FAILURE: ${path} did not expose ${marker}." >&2
            exit 36
          }

          expect_200 health /health '"status":"ok"'
          expect_200 cases_page /cases "Yayınlanmış Güvenlik Vakaları"
          expect_200 live_page /live "Canlı Solana Güvenlik Radarı"
          expect_200 login_page /login "KOSCHEI ARVIS"
          expect_200 register_page /register "KOSCHEI ARVIS"
          expect_200 account_page /account "KOSCHEI ARVIS"
          expect_200 reports_page /reports "KOSCHEI ARVIS"

          # These markers work against the currently deployed main during PRs
          # and against the consolidated product after deployment.
          expect_200 arvis_scan /scan "arvis-premium-contract.js"
          expect_200 arvis_dashboard /dashboard "Security Workspace"
          expect_200 safe_check /safe-check "Koschei ARVIS"
          expect_200 transaction_shield /transaction-shield "Koschei ARVIS"
          expect_200 security_radar /security-radar "Koschei ARVIS"
          expect_200 owner_production /owner-production.html "Owner Evidence Operations"
          expect_200 complete_evidence_asset /js/arvis-complete-evidence-v3.js "completeEvidenceVersion='3.0.0'"
          expect_200 social_renderer_asset /js/arvis-social-render-v2-publish.js "socialRendererVersion='2.0.0'"

          for page in arvis_scan arvis_dashboard safe_check transaction_shield security_radar owner_production; do
            grep -Fq '<html lang="en">' "diagnostics/${page}.body" || {
              echo "ARVIS_LANGUAGE_FAILURE: ${page} is not response-English." >&2
              exit 33
            }
          done
          for marker in \
            'arvis-premium-contract.js' \
            'customer-arvis-premium-suite.js' \
            'arvis-complete-evidence-v3.js' \
            'arvis-social-render-v2-core.js'; do
            grep -Fq "${marker}" diagnostics/arvis_scan.body || {
              echo "ARVIS_SCAN_CONTRACT_FAILURE: /scan is missing ${marker}." >&2
              exit 34
            }
          done
          grep -Fq 'arvis-complete-evidence-v3.js' diagnostics/owner_production.body || {
            echo 'OWNER_ARVIS_CONTRACT_FAILURE: owner production is missing Complete Evidence v3.' >&2
            exit 35
          }

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            wait_expect_200 auth_english_asset /js/english-auth-presentation.js "__koscheiAuthEnglishOverlayInstalled"
            wait_expect_200 unified_scan_navigation_asset /js/unified-scan-navigation.js "__koscheiUnifiedScanNavigation"
            if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              wait_expect_200 full_scan_contract /full-scan-contract-v1.json "koschei-production-full-scan-contract-v1" 36
            fi
            wait_expect_200 landing_page / "Evidence-backed Web3 investigation system"
            wait_expect_200 login_page /login "english-auth-presentation.js"
            wait_expect_200 register_page /register "english-auth-presentation.js"
            wait_expect_200 account_page /account "KOSCH Holder Access"
            wait_expect_200 reports_page /reports "Report Vault"
            wait_expect_200 arvis_scan /scan "Unified Scan Center"
            wait_expect_200 arvis_dashboard /dashboard "Workspace, not another scanner"
            wait_expect_200 safe_check /safe-check "Unified Scan Center"
            wait_expect_200 transaction_shield /transaction-shield "Unified Scan Center"
            wait_expect_200 security_radar /security-radar "Unified Scan Center"

            grep -Fqi 'location: /scan?mode=quick' diagnostics/safe_check.headers || {
              echo 'SAFE_CHECK_REDIRECT_FAILURE: /safe-check does not redirect to quick mode.' >&2
              exit 40
            }
            grep -Fqi 'location: /scan?mode=transaction' diagnostics/transaction_shield.headers || {
              echo 'TRANSACTION_REDIRECT_FAILURE: /transaction-shield does not redirect to transaction mode.' >&2
              exit 41
            }
            grep -Fqi 'location: /scan?mode=deep' diagnostics/security_radar.headers || {
              echo 'RADAR_REDIRECT_FAILURE: /security-radar does not redirect to deep mode.' >&2
              exit 42
            }

            for page in landing_page login_page register_page account_page reports_page arvis_scan arvis_dashboard safe_check transaction_shield security_radar; do
              grep -Fq '<html lang="en">' "diagnostics/${page}.body" || {
                echo "CORE_LANGUAGE_FAILURE: ${page} does not declare English after deployment." >&2
                exit 37
              }
              grep -Fq 'unified-scan-navigation.js' "diagnostics/${page}.body" || {
                echo "SCAN_NAVIGATION_FAILURE: ${page} is missing canonical navigation enforcement." >&2
                exit 43
              }
            done
            for page in login_page register_page; do
              grep -Fq 'koschei-auth.js?v=33' "diagnostics/${page}.body" || {
                echo "AUTH_FREEZE_FAILURE: ${page} lost the frozen auth client contract." >&2
                exit 38
              }
              grep -Fq 'english-auth-presentation.js' "diagnostics/${page}.body" || {
                echo "AUTH_PRESENTATION_FAILURE: ${page} is missing the English presentation layer." >&2
                exit 39
              }
            done
          fi

          cases_api_code="$(probe cases_api '/api/public/cases?limit=100')"
          feed_api_code="$(probe feed_api /api/public/soc/feed)"
          echo "cases_api_code=${cases_api_code}" | tee -a diagnostics/result.txt
          echo "feed_api_code=${feed_api_code}" | tee -a diagnostics/result.txt
          [ "${cases_api_code}" = "200" ] || { echo "PUBLIC_CASES_API_FAILURE: HTTP ${cases_api_code}." >&2; exit 23; }
          [ "${feed_api_code}" = "200" ] || { echo "PUBLIC_SOC_API_FAILURE: HTTP ${feed_api_code}." >&2; exit 24; }
          grep -Fq '"ok":true' diagnostics/cases_api.body || { echo 'PUBLIC_CASES_API_CONTRACT_FAILURE: ok=true missing.' >&2; exit 25; }
          grep -Fq '"ok":true' diagnostics/feed_api.body || { echo 'PUBLIC_SOC_API_CONTRACT_FAILURE: ok=true missing.' >&2; exit 26; }

          case_ref="$(node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('diagnostics/cases_api.body', 'utf8'));
          const item = Array.isArray(payload.cases) ? payload.cases.find(value => /^KD1-[a-z0-9]+$/i.test(String(value?.case_ref || ''))) : null;
          if (!item) process.exit(2);
          process.stdout.write(String(item.case_ref));
          NODE
          )" || {
            echo 'PUBLIC_CASE_REGISTRY_FAILURE: no published KD1 case is available.' >&2
            exit 27
          }
          printf '%s\n' "case_ref=${case_ref}" | tee -a diagnostics/result.txt

          case_code="$(probe case_page "/case/${case_ref}")"
          dossier_code="$(probe dossier_page "/dossier/${case_ref}")"
          echo "case_code=${case_code}" | tee -a diagnostics/result.txt
          echo "dossier_code=${dossier_code}" | tee -a diagnostics/result.txt
          [ "${case_code}" = "200" ] || { echo "PUBLIC_CASE_PAGE_FAILURE: HTTP ${case_code}." >&2; exit 28; }
          [ "${dossier_code}" = "200" ] || { echo "PUBLIC_DOSSIER_PAGE_FAILURE: HTTP ${dossier_code}." >&2; exit 29; }
          grep -Fq "${case_ref}" diagnostics/case_page.body || { echo 'PUBLIC_CASE_PAGE_CONTRACT_FAILURE: case ref missing.' >&2; exit 30; }
          grep -Fq "${case_ref}" diagnostics/dossier_page.body || { echo 'PUBLIC_DOSSIER_PAGE_CONTRACT_FAILURE: case ref missing.' >&2; exit 31; }
          grep -Fq 'Koschei ARVIS' diagnostics/case_page.body || { echo 'PUBLIC_CASE_PAGE_CONTRACT_FAILURE: ARVIS marker missing.' >&2; exit 32; }

          echo 'PUBLIC_PRODUCT_HEALTHY: canonical Scan Center, legacy mode redirects, English core, ARVIS assets, public APIs, and immutable case passed.'

      - name: Run full production investigation
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node koschei/api/scripts/verify-production-full-scan.js
