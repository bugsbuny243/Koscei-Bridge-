name: Release Gates Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visible-evidence-patch:
    name: Apply visible exit and program evidence integration
    if: github.head_ref == 'agent/expose-exit-program-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/expose-exit-program-evidence
          fetch-depth: 0
      - name: Set up Go 1.25.12
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Apply and verify integration
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'applyMarketProgramEvidenceReferences(evidenceReferences, core)' koschei/api/internal/handlers/unified_investigation_report.go; then
            echo 'Visible evidence integration already present.'
            exit 0
          fi
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-visible-market-program-evidence.yml > /tmp/visible_evidence_patch.py
          test -s /tmp/visible_evidence_patch.py
          python3 /tmp/visible_evidence_patch.py
          cd koschei/api
          gofmt -w internal/handlers/unified_market_program_surface.go internal/handlers/unified_market_program_surface_test.go internal/handlers/unified_investigation_report.go
          test -z "$(gofmt -l .)"
          node --check public/js/verdict-card-market-context.js
          node --test public/js/__tests__/verdict-card-market-context.test.mjs
          go test ./internal/handlers -run 'TestApplyMarketProgramEvidenceReferences|TestUnifiedReportPublishesExitAndProgramSecurityTopLevel' -count=1
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux go build ./...
      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add koschei/api/internal/handlers/unified_investigation_report.go \
            koschei/api/internal/handlers/unified_market_program_surface.go \
            koschei/api/internal/handlers/unified_market_program_surface_test.go \
            koschei/api/public/js/verdict-card-market-context.js \
            koschei/api/public/js/__tests__/verdict-card-market-context.test.mjs
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'expose exit liquidity and program authority evidence'
          git push origin HEAD:agent/expose-exit-program-evidence

  full-verification:
    name: Go 1.25.12, PostgreSQL 17, race and evidence gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_release_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_release_gate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.25.12
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Record toolchain
        run: go version
      - name: Download modules
        run: go mod download
      - name: Require gofmt clean tree
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi
      - name: Apply all migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "RUN ${migration}"
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_release_gate \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}"
            echo "PASS ${migration}"
          done
      - name: Verify PostgreSQL 17 retention hash primitives
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          result="$(psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=koschei_release_gate --tuples-only --no-align --set=ON_ERROR_STOP=1 --command="SELECT encode(sha256(convert_to('{}','UTF8')),'hex');")"
          test "${result}" = "44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a"
          echo "sha256(convert_to())=${result}"
      - name: Verify archive, resume and checksum fail-closed on PostgreSQL 17
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_release_gate?sslmode=disable
        run: go test -v ./internal/services -run '^TestRetentionArchiveDeletePostgres17$' -count=1
      - name: Test all packages
        run: go test ./...
      - name: Race-test July consolidation packages
        run: go test -race ./internal/handlers ./internal/services ./internal/defense
      - name: Vet all packages
        run: go vet ./...
      - name: Build all packages
        run: CGO_ENABLED=0 GOOS=linux go build ./...
