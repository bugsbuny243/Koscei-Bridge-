name: Format release gate files once

on:
  push:
    branches:
      - fix/release-gate-gofmt-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Format exact release-gate files
        run: |
          gofmt -w koschei/api/internal/archive/google_drive.go koschei/api/internal/handlers/transaction_guard_v3_attack_path_test.go
          test -z "$(gofmt -l koschei/api/internal/archive/google_drive.go koschei/api/internal/handlers/transaction_guard_v3_attack_path_test.go)"
      - name: Commit formatted files and remove one-shot workflow
        run: |
          rm .github/workflows/format-release-gate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): format release gate Go files'
          git push origin HEAD:fix/release-gate-gofmt-v2
