name: Radar Recursive Lineage V1 Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "koschei/api/internal/services/recursive_lineage*.go"
      - "koschei/api/internal/handlers/actor_funding_token_context.go"
      - "koschei/api/internal/handlers/unified_investigation_report.go"
      - "docs/RADAR_RECURSIVE_LINEAGE_V1.md"
      - ".github/workflows/radar-recursive-lineage-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/recursive_lineage*.go"
      - "koschei/api/internal/handlers/actor_funding_token_context.go"
      - "koschei/api/internal/handlers/unified_investigation_report.go"
      - "docs/RADAR_RECURSIVE_LINEAGE_V1.md"
      - ".github/workflows/radar-recursive-lineage-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-lineage-acceptance:
    name: PostgreSQL 17 bounded reverse-funder lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_recursive_lineage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_recursive_lineage_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go 1.25.12
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Apply migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_recursive_lineage_ci \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}" \
              >/dev/null
          done
      - name: Verify reverse funder token lineage
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_recursive_lineage_ci?sslmode=disable
        run: |
          set -euo pipefail
          go test -v ./internal/services \
            -run '^TestRecursiveLineageReverseFunderTokenHistoryPostgres17$' \
            -count=1
