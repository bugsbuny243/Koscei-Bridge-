name: Pi funding branch normalizer

on:
  push:
    branches:
      - feat/arvis-pi-funding-cluster-v4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'bugsbuny243/Koschei-Web3-Hub'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/arvis-pi-funding-cluster-v4
          fetch-depth: 0
      - name: Gofmt Pi funding files
        shell: bash
        run: |
          gofmt -w \
            koschei/api/internal/services/pi_funding_cluster.go \
            koschei/api/internal/services/pi_funding_bridge.go \
            koschei/api/internal/services/pi_funding_cluster_test.go \
            koschei/api/internal/services/arvis_multichain.go
      - name: Commit normalization only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "koschei-ci"
          git config user.email "actions@users.noreply.github.com"
          git add koschei/api/internal/services/pi_funding_cluster.go \
                  koschei/api/internal/services/pi_funding_bridge.go \
                  koschei/api/internal/services/pi_funding_cluster_test.go \
                  koschei/api/internal/services/arvis_multichain.go
          git commit -m "style(arvis): normalize Pi funding slice"
          git push origin HEAD:feat/arvis-pi-funding-cluster-v4
