name: Release Gates Task 1 Finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/release-gates-2026-08-02' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-gates-2026-08-02
          fetch-depth: 0
      - name: Document export configuration and wire PostgreSQL test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          env = Path('.env.example')
          s = env.read_text()
          old = '''# The archive is a staging ledger: an export step must stamp exported_at before
          # rows can be pruned. Until that export is wired, an unexported backlog above
          # the ceiling halts deletion instead of trading one table's growth for another's.
          KOSCHEI_RADAR_ARCHIVE_BACKLOG_MAX=2000000
          KOSCHEI_RADAR_ARCHIVE_PRUNE_DAYS=7
          '''
          new = '''# The archive is a staging ledger: the exporter writes newline-delimited JSON,
          # reads the object back, verifies the batch SHA-256, and only then stamps
          # exported_at/export_ref. Disabled is the safe default; the backlog ceiling
          # remains active and retention fails closed when it is exceeded.
          KOSCHEI_RADAR_ARCHIVE_BACKLOG_MAX=2000000
          KOSCHEI_RADAR_ARCHIVE_PRUNE_DAYS=7
          KOSCHEI_RADAR_ARCHIVE_EXPORT_SINK=disabled
          KOSCHEI_RADAR_ARCHIVE_EXPORT_BATCH_SIZE=500
          KOSCHEI_RADAR_ARCHIVE_EXPORT_MAX_BATCHES=10
          KOSCHEI_RADAR_ARCHIVE_EXPORT_PREFIX=radar-retention
          # Filesystem sink (CI/local verification).
          KOSCHEI_RADAR_ARCHIVE_EXPORT_FILESYSTEM_PATH=
          # S3-compatible production sink. The endpoint may be AWS S3, R2, MinIO,
          # or another SigV4-compatible object store. HTTPS is recommended.
          KOSCHEI_RADAR_ARCHIVE_EXPORT_S3_ENDPOINT=
          KOSCHEI_RADAR_ARCHIVE_EXPORT_S3_BUCKET=
          KOSCHEI_RADAR_ARCHIVE_EXPORT_S3_REGION=us-east-1
          KOSCHEI_RADAR_ARCHIVE_EXPORT_S3_ACCESS_KEY_ID=
          KOSCHEI_RADAR_ARCHIVE_EXPORT_S3_SECRET_ACCESS_KEY=
          KOSCHEI_RADAR_ARCHIVE_EXPORT_S3_SESSION_TOKEN=
          KOSCHEI_RADAR_ARCHIVE_EXPORT_S3_PATH_STYLE=true
          '''
          if old not in s:
              raise SystemExit('.env.example retention anchor not found')
          env.write_text(s.replace(old, new, 1))

          workflow = Path('.github/workflows/api-required-ci.yml')
          s = workflow.read_text()
          anchor = '''      - name: Upload retention archive PostgreSQL log
          '''
          addition = '''      - name: Validate retention archive export on PostgreSQL 17
          env:
            KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_ci?sslmode=disable
          run: |
            set -o pipefail
            go test -v ./internal/services -run '^TestRetentionArchiveExportPostgres17$' -count=1 2>&1 | tee "${RUNNER_TEMP}/retention-export-postgres17.txt"
          - name: Upload retention archive export PostgreSQL log
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: retention-export-postgres17
            path: ${{ runner.temp }}/retention-export-postgres17.txt
            if-no-files-found: warn
            retention-days: 7
          '''
          if anchor not in s:
              raise SystemExit('api-required-ci retention anchor not found')
          workflow.write_text(s.replace(anchor, addition + anchor, 1))
          PY
          gofmt -w koschei/api/internal/services/retentionexport koschei/api/internal/services/security_radar_retention_export.go koschei/api/internal/services/security_radar_retention_export_postgres_test.go
      - name: Commit task 1 finalization
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Task 1 finalization already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .github/workflows/api-required-ci.yml koschei/api/internal/services/retentionexport koschei/api/internal/services/security_radar_retention_export.go koschei/api/internal/services/security_radar_retention_export_postgres_test.go
          git commit -m "retention: finalize verified archive export gate"
          git push origin HEAD:agent/release-gates-2026-08-02
