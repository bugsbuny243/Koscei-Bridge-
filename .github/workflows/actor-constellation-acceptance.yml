name: Actor Constellation V1 Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-evidence-acceptance:
    name: PostgreSQL 17 bidirectional signed-evidence graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_actor_constellation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_actor_constellation_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go 1.25.12
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Apply migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_actor_constellation_ci \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}" \
              >/dev/null
          done
      - name: Verify actor constellation reverse-link evidence
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_actor_constellation_ci?sslmode=disable
        run: |
          set -euo pipefail
          go test -v ./internal/services \
            -run '^TestActorConstellationBidirectionalEvidencePostgres17$' \
            -count=1
