name: Wave 34 Public Smoke Sync

on:
  push:
    branches:
      - feat/saas-billing-kosch-decoupling-v1
    paths:
      - ".github/workflows/sync-wave34-public-smoke.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'bugsbuny243/Koschei-Web3-Hub' && github.actor == 'bugsbuny243'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/saas-billing-kosch-decoupling-v1
          fetch-depth: 0
      - name: Replace KOSCH-specific public smoke assumptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/public-product-smoke.yml')
          text = path.read_text()
          old_mint = 'KOSCHEI_FULL_SCAN_MINT: HHPpU9u56Bwxov12nf7DXUCuv6h1q5j1xgGS3yukpump'
          new_mint = 'KOSCHEI_FULL_SCAN_MINT: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
          old_marker = 'wait_expect_200 account_page /account "KOSCH Holder Access"'
          new_marker = 'wait_expect_200 account_page /account "Account & SaaS Access"'
          if text.count(old_mint) != 1:
              raise SystemExit(f'expected exactly one KOSCH full-scan target, found {text.count(old_mint)}')
          if text.count(old_marker) != 1:
              raise SystemExit(f'expected exactly one legacy account marker, found {text.count(old_marker)}')
          text = text.replace(old_mint, new_mint).replace(old_marker, new_marker)
          path.write_text(text)
          PY
      - name: Commit smoke cleanup when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/public-product-smoke.yml; then
            echo "Public smoke already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/public-product-smoke.yml
          git commit -m "ci(smoke): remove KOSCH-specific production target"
          git push origin HEAD:feat/saas-billing-kosch-decoupling-v1
