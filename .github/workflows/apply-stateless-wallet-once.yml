name: Apply stateless wallet patch once

on:
  push:
    branches:
      - fix/stateless-wallet-live

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Apply minimal patch
        run: git apply --check .github/stateless-wallet.patch && git apply .github/stateless-wallet.patch
      - name: Format Go changes
        run: |
          gofmt -w \
            koschei/api/internal/handlers/actor_created_mint_integration.go \
            koschei/api/internal/handlers/actor_defense_investigation.go \
            koschei/api/internal/handlers/owner_unified_radar.go \
            koschei/api/internal/handlers/owner_unified_wallet_stateless_test.go \
            koschei/api/internal/http/server.go
      - name: Verify runtime recovery
        run: node koschei/api/scripts/verify-scan-runtime-recovery.js
      - name: Test focused Go packages
        working-directory: koschei/api
        run: go test ./internal/handlers ./internal/http
      - name: Remove one-shot files and commit code
        run: |
          rm .github/stateless-wallet.patch .github/workflows/apply-stateless-wallet-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(arvis): enable stateless wallet investigations'
          git push origin HEAD:fix/stateless-wallet-live
