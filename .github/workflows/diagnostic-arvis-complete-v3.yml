name: Diagnostic ARVIS complete evidence v3

on:
  pull_request:
    branches: [main]
    paths:
      - "koschei/api/public/js/arvis-complete-evidence-v3.js"
      - "koschei/api/public/owner-production.html"
      - "koschei/api/public/scan.html"
      - "koschei/api/public/safe-check.html"
      - "koschei/api/public/dashboard.html"
      - "koschei/api/english_public_html.go"
      - "koschei/api/*_v3_test.go"
      - ".github/workflows/diagnostic-arvis-complete-v3.yml"

permissions:
  contents: read

jobs:
  visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Chromium renderer
        run: |
          npm --prefix "${RUNNER_TEMP}/arvis-v3" init -y
          npm --prefix "${RUNNER_TEMP}/arvis-v3" install playwright@1.55.0
          "${RUNNER_TEMP}/arvis-v3/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render complete customer evidence file
        env:
          NODE_PATH: ${{ runner.temp }}/arvis-v3/node_modules
        run: |
          mkdir -p "${RUNNER_TEMP}/arvis-v3-proof"
          cat > "${RUNNER_TEMP}/render-complete-v3.cjs" <<'NODE'
          const path = require('path');
          const { chromium } = require('playwright');
          const root = process.cwd();
          const output = path.join(process.env.RUNNER_TEMP, 'arvis-v3-proof', 'complete-evidence-v3.png');
          const payload = {
            target: '9cRCn9rGT8V2imeM2BaKs13yhMEais3ruM3rPvTGpump',
            name: 'The Black Bull', symbol: 'ANSEM', grade: 'C',
            risk_level: 'high', token_program: 'Token-2022', token_2022: true,
            extension_resolution_status: 'resolved',
            extensions: [{name:'Transfer Fee',summary:'Transfer fee configuration parsed.',severity:'medium'}],
            mint_authority: null, freeze_authority: null,
            signature: 'koschei-unified-contract:bc75754c02b371c48',
            ruleset_version: 'koschei-unified-radar-rules-v1.2.0',
            final_verdict: {grade:'C',signed:true,confidence:'medium',signature:'koschei-unified-contract:bc75754c02b371c48',ruleset_version:'koschei-unified-radar-rules-v1.2.0',verdict:'severity_aware_compounding',decision_path:['High owner concentration','Thin exit liquidity','Creator history review']},
            holder_intelligence: {top_owner_percentage:49.3485,top_3_percentage:59.6486,top_10_percentage:62.9764,top_20_percentage:68.4412,top_owner_reference_usd_value:103699221,rows:[
              {owner:'7oU9nR9VEvFPwvp2PpXo2LQc6A92QRhcUTwhLWT7MsDM',role_label:'Custodial address candidate',balance:491000100,holder_percentage:49.3485,behavior_label:'Bounded outflow observed'},
              {owner:'GV6UUmNxz2RpKxmNAPadYKb7uQpszwqQAu3qLJxVdC52',role_label:'Unresolved wallet',balance:91784931.88,holder_percentage:9.2249,behavior_label:'Three bounded outflows'},
              {owner:'CLM6E4zpTviEC77nWKogpVLQoXx9tgoQCYJ8NibxKg1Q',role_label:'Wallet',balance:10697667.57,holder_percentage:1.0752,behavior_label:'Five bounded outflows'}
            ]},
            holder_cluster: {deep_owners_scanned:15,shallow_owners_scanned:2,rpc_calls_used:143,rpc_budget:3000,confidence:'medium',same_amount_groups:[{key:'4 SOL',member_count:6,holder_percentage:12.42,wallets:['A','B','C','D','E','F']}],graph_edges:[{from:'Creator111',to:'WalletA111',type:'direct funding',confidence:'verified'},{from:'WalletA111',to:'Pool111',type:'token outflow',confidence:'bounded'}]},
            market: {market_cap_usd:211262461,liquidity_usd:2109204.95,volume_24h_usd:10213173,price_usd:.2112,pair_count:2},
            launch_forensics: {status:'partial',creation_slot:436900001,limitations:['Initial recipient history was only partially resolved.']},
            actor_investigation: {dossier:{creator_wallet:'yHCxHBEaJW5tbndqC8JciSThr7U1cqLpdcsvHcx6PRe',funding_origin:{status:'verified',source_wallet:'HTXHotWallet111',amount:'1.4 SOL'},initial_distribution:{recipient_count:4},track:{created_token_count:49,active_token_count:32,inactive_or_dead_count:17},limitations:['External service attribution is not a real-world identity claim.']}},
            modules:[
              {module_id:'authority',title:'Authority Intelligence',status:'complete',summary:'Mint and freeze authorities resolved.'},
              {module_id:'holder_intelligence',title:'Holder Intelligence',status:'complete',summary:'Owner-resolved Top 20 produced.'},
              {module_id:'holder_cluster',title:'Holder Cluster Intelligence',status:'partial',summary:'Funding and flow graph produced in a bounded window.'},
              {module_id:'launch_forensics',title:'Launch Forensics',status:'partial',summary:'Creation slot resolved; initial distribution incomplete.'},
              {module_id:'token_2022',title:'Token-2022 Controls',status:'complete',summary:'One extension parsed.'},
              {module_id:'brand_collision',title:'Brand Collision',status:'unavailable',summary:'Cross-mint name search was not attached.'}
            ],
            verified_evidence:[
              {claim:'mint_authority_disabled',status:'verified',summary:'Mint authority is disabled.'},
              {claim:'freeze_authority_disabled',status:'verified',summary:'Freeze authority is disabled.'},
              {claim:'largest_owner_share',status:'verified',summary:'Largest owner controls 49.3485% of role-adjusted supply.'}
            ],
            visibility_limitations:['The scan is bounded by provider history and the configured evidence window.','Custodial attribution does not resolve beneficial ownership.']
          };
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1600,height:1100},deviceScaleFactor:1});
            await page.setContent('<!doctype html><html lang="en"><head></head><body style="margin:0;padding:28px;background:#02060b;color:#f4fbff;font-family:Arial"><main id="result" style="max-width:1480px;margin:auto"></main></body></html>');
            await page.addStyleTag({path:path.join(root,'koschei/api/public/css/arvis-premium-suite.css')});
            await page.addScriptTag({path:path.join(root,'koschei/api/public/js/arvis-premium-contract.js')});
            await page.addScriptTag({path:path.join(root,'koschei/api/public/js/arvis-complete-evidence-v3.js')});
            await page.evaluate(payload=>window.KoscheiARVISPremium.mountPremiumCard(document.getElementById('result'),payload),payload);
            await page.waitForSelector('[data-arvis-complete-v3]');
            const audit = await page.evaluate(()=>({
              version: window.KoscheiARVISPremium.completeEvidenceVersion,
              modules: document.querySelectorAll('.arvis-module-v3').length,
              holders: document.querySelectorAll('.arvis-holder-v3').length,
              graph: document.querySelectorAll('.arvis-graph-v3').length,
              text: document.querySelector('[data-arvis-complete-v3]').textContent,
              overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2
            }));
            if(audit.version!=='3.0.0')throw new Error(`version=${audit.version}`);
            if(audit.modules!==6||audit.holders!==3||audit.graph!==2)throw new Error(JSON.stringify(audit));
            const renderedText=String(audit.text||'').toUpperCase();
            for(const phrase of ['TOP 3','TOP 20','ALL ARVIS MODULES','CREATOR, FUNDING & LAUNCH','RELATIONSHIP GRAPH','SIGNED CANONICAL PACKAGE'])if(!renderedText.includes(phrase))throw new Error(`missing ${phrase}`);
            if(audit.overflow)throw new Error('horizontal overflow detected');
            await page.screenshot({path:output,fullPage:true});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node "${RUNNER_TEMP}/render-complete-v3.cjs"
          test -s "${RUNNER_TEMP}/arvis-v3-proof/complete-evidence-v3.png"
          sha256sum "${RUNNER_TEMP}/arvis-v3-proof/complete-evidence-v3.png"
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: arvis-complete-evidence-v3-proof
          path: ${{ runner.temp }}/arvis-v3-proof/complete-evidence-v3.png
          if-no-files-found: error
          retention-days: 7
