name: Temp Sync Preflight Current Main
on:
  push:
    branches: [feat/customer-transaction-preflight-ui-v1-final]
    paths: [.github/workflows/tmp-sync-preflight-current-main.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-transaction-preflight-ui-v1-final
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Merge current main and regenerate contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          cd koschei/api
          go run ./cmd/openapi-gen
          node scripts/verify-customer-transaction-preflight-ui-v1.js
          node scripts/verify-customer-investigation-ui.js
          go test ./internal/openapi ./internal/http ./internal/handlers -count=1
          cd ../..
          git diff --check
          git add koschei/api/openapi.yaml
          if ! git diff --cached --quiet; then git commit -m 'chore(openapi): sync merged registered routes'; fi
          git push origin HEAD:feat/customer-transaction-preflight-ui-v1-final