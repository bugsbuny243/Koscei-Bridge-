name: Apply Address Intelligence Completeness

on:
  push:
    branches:
      - agent/address-intelligence-completeness

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/address-intelligence-completeness
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: koschei/api/go.sum
      - name: Apply evidence-safe address intelligence changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('koschei/api')

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          wallet_file = root / 'internal/handlers/customer_wallet_investigation.go'
          wallet_file.write_text(r'''package handlers

import (
	"context"
	"fmt"
	"net/http"
	"strings"
	"time"

	"koschei/api/internal/services"
)

type customerWalletInvestigationResult struct {
	Target               string
	Wallet               string
	Network              string
	Classification       radarTargetClassification
	Dossier              services.ActorDefenseDossier
	FundingOrigin        services.ActorFundingOrigin
	FundingPersistence   string
	LiveCoverage         actorDefenseLiveCoverage
	RuleVerdict          services.ActorDefenseRuleVerdict
	RulePersistence      string
	HasLiveEvidence      bool
	HasPersistentEvidence bool
	PublishedResult      bool
}

func radarTargetWalletInvestigationAllowed(classification radarTargetClassification) bool {
	if classification.Type == radarTargetWallet {
		return true
	}
	return classification.Type == radarTargetTokenAccount && strings.TrimSpace(classification.TokenOwnerWallet) != ""
}

func resolveCustomerWalletTarget(target string, classification radarTargetClassification) (string, error) {
	switch classification.Type {
	case radarTargetWallet:
		wallet := strings.TrimSpace(target)
		if wallet == "" {
			return "", fmt.Errorf("wallet target is empty")
		}
		return wallet, nil
	case radarTargetTokenAccount:
		wallet := strings.TrimSpace(classification.TokenOwnerWallet)
		if wallet == "" {
			return "", fmt.Errorf("token account owner wallet is unresolved")
		}
		return wallet, nil
	default:
		return "", fmt.Errorf("target type %s is not wallet-investigable", classification.Type)
	}
}

func (h *Handler) runCustomerWalletInvestigation(ctx context.Context, target, network string, classification radarTargetClassification) (customerWalletInvestigationResult, error) {
	out := customerWalletInvestigationResult{
		Target: target, Network: network, Classification: classification,
		FundingPersistence: "not_requested", RulePersistence: "not_requested",
	}
	wallet, err := resolveCustomerWalletTarget(target, classification)
	if err != nil {
		return out, err
	}
	out.Wallet = wallet

	db := h.DBRead
	if db == nil {
		db = h.DB
	}
	if db == nil {
		return out, fmt.Errorf("actor defense database is unavailable")
	}
	store := services.NewActorDefenseStore(db)
	initial, err := store.LoadPersistentWalletDossier(ctx, wallet, network, 75)
	if err != nil {
		return out, fmt.Errorf("assemble actor defense dossier: %w", err)
	}

	out.FundingOrigin, out.FundingPersistence = h.collectActorFundingOrigin(ctx, store, wallet, network)
	out.LiveCoverage = h.collectActorDefenseLiveEvidence(ctx, store, initial)
	if out.FundingPersistence == "failed" {
		out.LiveCoverage.PersistenceFailures++
		if out.LiveCoverage.Status == "complete" {
			out.LiveCoverage.Status = "partial_persistence"
		}
		out.LiveCoverage.Limitations = append(out.LiveCoverage.Limitations, "Funding-origin sonucu kalıcı actor index'e yazılamadı.")
	}

	out.Dossier, err = store.LoadPersistentWalletDossier(ctx, wallet, network, 100)
	if err != nil {
		return out, fmt.Errorf("refresh actor defense dossier: %w", err)
	}
	out.RuleVerdict = services.EvaluateActorDefenseRules(out.Dossier.Track, out.Dossier.Evidence)
	out.RulePersistence = "persisted"
	if err := store.PersistRuleVerdict(ctx, out.Dossier.Track, out.RuleVerdict); err != nil {
		out.RulePersistence = "failed"
		out.LiveCoverage.PersistenceFailures++
		if out.LiveCoverage.Status == "complete" {
			out.LiveCoverage.Status = "partial_persistence"
		}
		out.LiveCoverage.Limitations = append(out.LiveCoverage.Limitations, "Deterministik actor verdict kalıcı threat track'e yazılamadı.")
	}
	if out.Dossier.Coverage == nil {
		out.Dossier.Coverage = map[string]any{}
	}
	out.Dossier.Coverage["live_evidence"] = out.LiveCoverage
	out.Dossier.Coverage["funding_origin"] = out.FundingOrigin
	out.Dossier.Coverage["funding_origin_persistence"] = out.FundingPersistence
	out.Dossier.Coverage["requested_target"] = target
	out.Dossier.Coverage["resolved_wallet"] = wallet
	out.Dossier.Coverage["rule_verdict_persistence"] = out.RulePersistence
	out.Dossier.Coverage["numeric_score_disabled"] = true

	out.HasLiveEvidence = out.LiveCoverage.EvidencePersisted > 0 || out.FundingOrigin.ResultState == services.ActorFundingResultVerified
	out.HasPersistentEvidence = len(out.Dossier.Evidence) > 0
	out.PublishedResult = out.HasLiveEvidence || out.HasPersistentEvidence || out.FundingOrigin.ResultState == services.ActorFundingResultBounded
	return out, nil
}

func customerWalletInvestigationStatus(result customerWalletInvestigationResult) string {
	if result.PublishedResult {
		return "ready"
	}
	return "evidence_pending"
}

func customerWalletInvestigationMessage(result customerWalletInvestigationResult) string {
	if result.FundingOrigin.ResultState == services.ActorFundingResultBounded && !result.HasLiveEvidence && !result.HasPersistentEvidence {
		return "Wallet investigation reached its published chain boundary; no funding claim was emitted."
	}
	if result.PublishedResult {
		return "Wallet investigation completed with evidence-backed or explicitly bounded results."
	}
	return "Wallet investigation completed with evidence gaps; missing evidence is not treated as a safe finding."
}

func customerWalletInvestigationEnvelope(result customerWalletInvestigationResult, charged bool) map[string]any {
	return map[string]any{
		"ok":                      true,
		"status":                  customerWalletInvestigationStatus(result),
		"message":                 customerWalletInvestigationMessage(result),
		"investigation_kind":      "wallet_intelligence",
		"schema_version":          "koschei-wallet-intelligence-v1",
		"target":                  result.Target,
		"wallet":                  result.Wallet,
		"network":                 result.Network,
		"target_classification":   result.Classification,
		"has_live_evidence":       result.HasLiveEvidence,
		"has_persistent_evidence": result.HasPersistentEvidence,
		"published_result":        result.PublishedResult,
		"charged":                 charged,
		"dossier":                 result.Dossier,
		"funding_origin":          result.FundingOrigin,
		"actor_live_evidence":     result.LiveCoverage,
		"rule_verdict":            result.RuleVerdict,
		"evidence_policy": map[string]any{
			"numeric_final_score_disabled": true,
			"missing_evidence_is_not_safe": true,
			"bounded_is_not_verified":      true,
			"identity_scope":               "onchain_wallet_only",
		},
	}
}

func (h *Handler) securityRadarWalletCheck(w http.ResponseWriter, r *http.Request, authSubject, claimEmail, target, network string, classification radarTargetClassification) {
	services.WriteSecurityAuditEvent(r.Context(), h.DB, securityAuditFromRequest(r, "radar_wallet_check_requested", "customer", "info", map[string]any{
		"network": network, "target": target, "target_type": classification.Type,
	}))
	ctx, cancel := context.WithTimeout(r.Context(), 170*time.Second)
	defer cancel()
	result, err := h.runCustomerWalletInvestigation(ctx, target, network, classification)
	if err != nil {
		services.WriteSecurityAuditEvent(ctx, h.DB, securityAuditFromRequest(r, "radar_wallet_check_failed", "customer", "warning", map[string]any{
			"network": network, "target": target, "target_type": classification.Type,
		}))
		writeAPIError(w, http.StatusServiceUnavailable, APICodeServiceUnavailable, "Wallet intelligence could not be assembled")
		return
	}

	charged := false
	if result.PublishedResult {
		if err := h.consumePremiumOutput(authSubject, claimEmail, "security_radar_wallet_check"); err != nil {
			writeJSON(w, http.StatusPaymentRequired, insufficientOutputsResponse())
			return
		}
		charged = true
	}
	status := customerWalletInvestigationStatus(result)
	if status == "evidence_pending" {
		services.WriteSecurityAuditEvent(ctx, h.DB, securityAuditFromRequest(r, "radar_wallet_check_evidence_pending", "customer", "warning", map[string]any{
			"network": network, "target": target, "wallet": result.Wallet,
		}))
	}
	h.logTool(claimEmail, "security_radar_wallet_check", status)
	h.trackEvent(claimEmail, "security_radar_wallet_check", r.URL.Path)
	writeJSON(w, http.StatusOK, customerWalletInvestigationEnvelope(result, charged))
}
''')

          wallet_test = root / 'internal/handlers/customer_wallet_investigation_test.go'
          wallet_test.write_text(r'''package handlers

import (
	"testing"

	"koschei/api/internal/services"
)

func TestRadarTargetWalletInvestigationAllowed(t *testing.T) {
	cases := []struct {
		name string
		in   radarTargetClassification
		want bool
	}{
		{name: "wallet", in: radarTargetClassification{Type: radarTargetWallet}, want: true},
		{name: "resolved token account", in: radarTargetClassification{Type: radarTargetTokenAccount, TokenOwnerWallet: "owner"}, want: true},
		{name: "unresolved token account", in: radarTargetClassification{Type: radarTargetTokenAccount}, want: false},
		{name: "mint", in: radarTargetClassification{Type: radarTargetTokenMint}, want: false},
		{name: "program", in: radarTargetClassification{Type: radarTargetProgram}, want: false},
	}
	for _, tc := range cases {
		t.Run(tc.name, func(t *testing.T) {
			if got := radarTargetWalletInvestigationAllowed(tc.in); got != tc.want {
				t.Fatalf("got %v want %v", got, tc.want)
			}
		})
	}
}

func TestCustomerWalletInvestigationBoundedIsPublishedNotVerified(t *testing.T) {
	result := customerWalletInvestigationResult{
		FundingOrigin: services.ActorFundingOrigin{ResultState: services.ActorFundingResultBounded},
		PublishedResult: true,
	}
	if status := customerWalletInvestigationStatus(result); status != "ready" {
		t.Fatalf("bounded result status=%q", status)
	}
	envelope := customerWalletInvestigationEnvelope(result, true)
	if envelope["published_result"] != true {
		t.Fatal("bounded result was not published")
	}
	policy, _ := envelope["evidence_policy"].(map[string]any)
	if policy["bounded_is_not_verified"] != true {
		t.Fatal("bounded policy was not explicit")
	}
	if _, exists := envelope["final_verdict"]; exists {
		t.Fatal("wallet envelope must not masquerade as a token final verdict")
	}
}

func TestCustomerWalletInvestigationMissingRemainsPending(t *testing.T) {
	result := customerWalletInvestigationResult{
		FundingOrigin: services.ActorFundingOrigin{ResultState: services.ActorFundingResultMissing},
	}
	if status := customerWalletInvestigationStatus(result); status != "evidence_pending" {
		t.Fatalf("missing result status=%q", status)
	}
}
''')

          market_file = root / 'internal/handlers/actor_created_mint_market.go'
          market_file.write_text(r'''package handlers

import (
	"context"
	"fmt"
	"sort"
	"strings"
	"time"

	"koschei/api/internal/services"
)

const actorTokenFateMarketDataUnavailable = "market_data_unavailable"

type actorTokenMarketFate struct {
	Status            string
	Reason            string
	EvidenceAvailable bool
	LifecycleEligible bool
}

func applyActorTokenMarketSnapshot(candidate *services.ActorCreatedMintCandidate, market services.TokenMarketSnapshot) actorTokenMarketFate {
	out := actorTokenMarketFate{Status: actorTokenFateMarketDataUnavailable, Reason: "market snapshot was not produced"}
	if candidate == nil {
		return out
	}
	candidate.MarketEvidenceStatus = strings.TrimSpace(market.Status)
	candidate.CurrentLiquidityUSD = market.LiquidityUSD
	candidate.CurrentPriceUSD = market.PriceUSD

	switch market.Status {
	case "verified_market_snapshot":
		candidate.LiquidityEvidenceAvailable = true
		out.EvidenceAvailable = true
		out.LifecycleEligible = true
		if market.LiquidityUSD > 0 {
			out.Status = services.ActorTokenFateActive
			out.Reason = "positive aggregate Solana pair liquidity was returned by the market provider"
		} else {
			out.Status = services.ActorTokenFateInactiveOrDead
			out.Reason = "the verified market snapshot returned Solana pairs with zero aggregate liquidity"
		}
	case "no_solana_pairs":
		candidate.LiquidityEvidenceAvailable = true
		out.EvidenceAvailable = true
		out.LifecycleEligible = true
		out.Status = services.ActorTokenFateInactiveOrDead
		out.Reason = "the market provider returned no Solana pair for this mint; this is not proof that no unindexed venue exists"
	default:
		out.Status = actorTokenFateMarketDataUnavailable
		status := strings.TrimSpace(market.Status)
		if status == "" {
			status = "market_unavailable"
		}
		out.Reason = "market evidence unavailable: " + status
	}
	candidate.FateStatus = out.Status
	candidate.FateReason = out.Reason
	return out
}

type actorTokenMarketSnapshotFetcher func(context.Context, string) services.TokenMarketSnapshot

func (h *Handler) appendObservedCreatorLaunchCandidates(ctx context.Context, out *actorCreatedMintIntegrationRun, wallet, network string) {
	observed, _ := h.creatorIntelObservedLaunches(ctx, "", network, wallet)
	appendObservedCreatorLaunchRows(ctx, out, observed, services.FetchSolanaTokenMarketSnapshot)
}

func appendObservedCreatorLaunchRows(ctx context.Context, out *actorCreatedMintIntegrationRun, observed []map[string]any, fetch actorTokenMarketSnapshotFetcher) {
	if out == nil || len(observed) == 0 {
		return
	}
	if fetch == nil {
		fetch = func(context.Context, string) services.TokenMarketSnapshot {
			return services.TokenMarketSnapshot{Status: "market_fetcher_unavailable"}
		}
	}
	seen := map[string]bool{}
	for _, candidate := range out.Discovery.Candidates {
		if mint := strings.TrimSpace(candidate.Mint); mint != "" {
			seen[mint] = true
		}
	}
	for _, candidate := range out.VerifiedCandidates {
		if mint := strings.TrimSpace(candidate.Mint); mint != "" {
			seen[mint] = true
		}
	}

	for _, item := range observed {
		mint := strings.TrimSpace(fmt.Sprint(item["target"]))
		if mint == "" || mint == "<nil>" || seen[mint] {
			continue
		}
		seen[mint] = true
		candidate := services.ActorCreatedMintCandidate{
			Mint:               mint,
			Signature:          strings.TrimSpace(fmt.Sprint(item["signature"])),
			InstructionType:    "observed_launch",
			VerificationStatus: "koschei_observed",
			Source:             "koschei_observation_store",
		}
		if candidate.Signature == "<nil>" {
			candidate.Signature = ""
		}
		switch value := item["observed_at"].(type) {
		case time.Time:
			candidate.ObservedAt = value.UTC()
		case string:
			if parsed, err := time.Parse(time.RFC3339, strings.TrimSpace(value)); err == nil {
				candidate.ObservedAt = parsed.UTC()
			}
		}
		market := fetch(ctx, mint)
		fate := applyActorTokenMarketSnapshot(&candidate, market)
		switch fate.Status {
		case services.ActorTokenFateActive:
			out.LiquidCandidates++
		case services.ActorTokenFateInactiveOrDead:
			out.InactiveOrDeadCandidates++
		default:
			out.MarketDataUnavailableCandidates++
			out.Limitations = append(out.Limitations, "Observed creator launch "+mint+" için piyasa sağlayıcısı sonuç üretmedi; token ölü olarak sınıflandırılmadı ("+candidate.MarketEvidenceStatus+").")
		}
		out.Discovery.Candidates = append(out.Discovery.Candidates, candidate)
		out.ObservedStoreCandidatesMerged++
	}
	if out.ObservedStoreCandidatesMerged == 0 {
		return
	}
	sort.SliceStable(out.Discovery.Candidates, func(i, j int) bool {
		left, right := out.Discovery.Candidates[i], out.Discovery.Candidates[j]
		if !left.ObservedAt.Equal(right.ObservedAt) {
			return left.ObservedAt.After(right.ObservedAt)
		}
		return left.Mint < right.Mint
	})
	out.Discovery.Available = true
	if strings.TrimSpace(out.Discovery.Provider) == "" {
		out.Discovery.Provider = "koschei_observation_store"
	} else if !strings.Contains(out.Discovery.Provider, "koschei_observation_store") {
		out.Discovery.Provider += "+koschei_observation_store"
	}
	if out.CandidatesVerified > 0 {
		out.Status = "verified_plus_observed"
	} else if out.CandidatesRequested > 0 {
		out.Status = "observed_plus_verification_failed"
	} else {
		out.Status = "observed_only"
	}
}
''')

          market_test = root / 'internal/handlers/actor_created_mint_market_test.go'
          market_test.write_text(r'''package handlers

import (
	"context"
	"testing"

	"koschei/api/internal/services"
)

func TestApplyActorTokenMarketSnapshotDistinguishesUnavailableFromDead(t *testing.T) {
	candidate := services.ActorCreatedMintCandidate{Mint: "mint"}
	fate := applyActorTokenMarketSnapshot(&candidate, services.TokenMarketSnapshot{Status: "market_request_failed"})
	if fate.Status != actorTokenFateMarketDataUnavailable || candidate.FateStatus != actorTokenFateMarketDataUnavailable {
		t.Fatalf("unavailable market was classified as %q", candidate.FateStatus)
	}
	if candidate.LiquidityEvidenceAvailable || fate.LifecycleEligible {
		t.Fatal("unavailable market must not create lifecycle evidence")
	}
}

func TestApplyActorTokenMarketSnapshotClassifiesExplicitObservations(t *testing.T) {
	cases := []struct {
		name   string
		market services.TokenMarketSnapshot
		want   string
	}{
		{name: "positive liquidity", market: services.TokenMarketSnapshot{Status: "verified_market_snapshot", PairCount: 2, LiquidityUSD: 1250}, want: services.ActorTokenFateActive},
		{name: "verified zero liquidity", market: services.TokenMarketSnapshot{Status: "verified_market_snapshot", PairCount: 1}, want: services.ActorTokenFateInactiveOrDead},
		{name: "no pair returned", market: services.TokenMarketSnapshot{Status: "no_solana_pairs"}, want: services.ActorTokenFateInactiveOrDead},
	}
	for _, tc := range cases {
		t.Run(tc.name, func(t *testing.T) {
			candidate := services.ActorCreatedMintCandidate{Mint: "mint"}
			fate := applyActorTokenMarketSnapshot(&candidate, tc.market)
			if fate.Status != tc.want || candidate.FateStatus != tc.want {
				t.Fatalf("got %q want %q", candidate.FateStatus, tc.want)
			}
			if !candidate.LiquidityEvidenceAvailable || !fate.LifecycleEligible {
				t.Fatal("explicit market observation must be lifecycle eligible")
			}
		})
	}
}

func TestObservedLaunchesRemainObservedAndDeduplicateVerifiedMints(t *testing.T) {
	out := newActorCreatedMintIntegrationRun("wallet")
	out.VerifiedCandidates = []services.ActorCreatedMintCandidate{{Mint: "verified", VerificationStatus: "verified"}}
	observed := []map[string]any{
		{"target": "verified", "signature": "duplicate"},
		{"target": "observed", "signature": "sig-observed"},
	}
	appendObservedCreatorLaunchRows(context.Background(), &out, observed, func(context.Context, string) services.TokenMarketSnapshot {
		return services.TokenMarketSnapshot{Status: "market_request_failed"}
	})
	if len(out.VerifiedCandidates) != 1 {
		t.Fatalf("observation store changed verified candidates: %d", len(out.VerifiedCandidates))
	}
	if out.ObservedStoreCandidatesMerged != 1 || len(out.Discovery.Candidates) != 1 {
		t.Fatalf("merged=%d discovery=%d", out.ObservedStoreCandidatesMerged, len(out.Discovery.Candidates))
	}
	candidate := out.Discovery.Candidates[0]
	if candidate.VerificationStatus != "koschei_observed" || candidate.Source != "koschei_observation_store" {
		t.Fatalf("observation was mislabeled: %+v", candidate)
	}
	if candidate.FateStatus != actorTokenFateMarketDataUnavailable || out.MarketDataUnavailableCandidates != 1 {
		t.Fatalf("unavailable fate was not published honestly: %+v", candidate)
	}
}
''')

