          old = '''\t\tcreatedOnChainAt := verified.ObservedAt\n\t\tif createdOnChainAt.IsZero() && verified.BlockTime > 0 {\n\t\t\tcreatedOnChainAt = time.Unix(verified.BlockTime, 0).UTC()\n\t\t}\n\t\tobservedAt := market.ObservedAt\n\t\tif observedAt.IsZero() {\n\t\t\tobservedAt = time.Now().UTC()\n\t\t}\n\t\tlifecycleInput := services.ActorTokenLifecycleInput{\n\t\t\tNetwork:             network,\n\t\t\tActorWallet:         wallet,\n\t\t\tMint:                verified.Mint,\n\t\t\tCreationSignature:   verified.Signature,\n\t\t\tCreationSlot:        verified.Slot,\n\t\t\tCreatedOnChainAt:    createdOnChainAt,\n\t\t\tObservedAt:          observedAt,\n\t\t\tCurrentLiquidityUSD: verified.CurrentLiquidityUSD,\n\t\t\tCurrentPriceUSD:     verified.CurrentPriceUSD,\n\t\t}\n\t\tlifecycle := services.BuildActorTokenLifecycleSnapshot(lifecycleInput)\n\t\tif store != nil {\n\t\t\tpersisted, persistErr := store.UpsertTokenLifecycleObservation(ctx, lifecycleInput)\n\t\t\tif persistErr != nil {\n\t\t\t\tout.LifecyclePersistenceFailures++\n\t\t\t} else {\n\t\t\t\tlifecycle = persisted\n\t\t\t\tout.LifecycleObservationsPersisted++\n\t\t\t}\n\t\t}\n\t\tout.LifecycleObservations = append(out.LifecycleObservations, lifecycle)\n'''
          new = '''\t\tif fate.LifecycleEligible {\n\t\t\tcreatedOnChainAt := verified.ObservedAt\n\t\t\tif createdOnChainAt.IsZero() && verified.BlockTime > 0 {\n\t\t\t\tcreatedOnChainAt = time.Unix(verified.BlockTime, 0).UTC()\n\t\t\t}\n\t\t\tobservedAt := market.ObservedAt\n\t\t\tif observedAt.IsZero() {\n\t\t\t\tobservedAt = time.Now().UTC()\n\t\t\t}\n\t\t\tlifecycleInput := services.ActorTokenLifecycleInput{\n\t\t\t\tNetwork:             network,\n\t\t\t\tActorWallet:         wallet,\n\t\t\t\tMint:                verified.Mint,\n\t\t\t\tCreationSignature:   verified.Signature,\n\t\t\t\tCreationSlot:        verified.Slot,\n\t\t\t\tCreatedOnChainAt:    createdOnChainAt,\n\t\t\t\tObservedAt:          observedAt,\n\t\t\t\tCurrentLiquidityUSD: verified.CurrentLiquidityUSD,\n\t\t\t\tCurrentPriceUSD:     verified.CurrentPriceUSD,\n\t\t\t}\n\t\t\tlifecycle := services.BuildActorTokenLifecycleSnapshot(lifecycleInput)\n\t\t\tif store != nil {\n\t\t\t\tpersisted, persistErr := store.UpsertTokenLifecycleObservation(ctx, lifecycleInput)\n\t\t\t\tif persistErr != nil {\n\t\t\t\t\tout.LifecyclePersistenceFailures++\n\t\t\t\t} else {\n\t\t\t\t\tlifecycle = persisted\n\t\t\t\t\tout.LifecycleObservationsPersisted++\n\t\t\t\t}\n\t\t\t}\n\t\t\tout.LifecycleObservations = append(out.LifecycleObservations, lifecycle)\n\t\t}\n'''
          replace_once(actor, old, new)

          start = actor.read_text().find('\n\t// Koschei observation store\'daki (PumpPortal) launch\'ları birleştir.')
          if start < 0:
              raise SystemExit('observation-store block start not found')
          end_marker = '\n\treturn out\n}'
          text = actor.read_text()
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('observation-store block end not found')
          replacement = '\n\th.appendObservedCreatorLaunchCandidates(ctx, &out, wallet, network)'
          actor.write_text(text[:start] + replacement + text[end:])

          ui = root / 'public/js/owner-creator-intelligence.js'
          old = '''  function candidateRows(portfolio){\n    const rows=uniqueCandidates(portfolio);\n    if(!rows.length)return'<div class="empty">Creator tarafından oluşturulduğu keşfedilen mint bulunmadı veya Helius/RPC kanıtı alınamadı.</div>';\n    return `<div class="table-wrap"><table class="table"><thead><tr><th>Mint</th><th>Program / instruction</th><th>İmza</th><th>Slot</th><th>Doğrulama</th></tr></thead><tbody>${rows.slice(0,50).map(row=>`<tr><td class="mono"><b>${esc(short(row.mint,36))}</b></td><td><b>${esc(short(row.program,28))}</b><div class="muted small">${esc(row.instruction_type||'create')}</div></td><td class="mono">${esc(short(row.signature,30))}</td><td>${num(row.slot)}</td><td>${badge(row.verification_status||'observed')}</td></tr>`).join('')}</tbody></table></div>`;\n  }\n'''
          new = '''  function candidateRows(portfolio){\n    const rows=uniqueCandidates(portfolio);\n    if(!rows.length)return'<div class="empty">Creator tarafından oluşturulduğu keşfedilen mint bulunmadı veya Helius/RPC kanıtı alınamadı.</div>';\n    return `<div class="table-wrap"><table class="table"><thead><tr><th>Mint</th><th>Program / instruction</th><th>İmza</th><th>Slot</th><th>Doğrulama</th><th>Akıbet / piyasa kanıtı</th></tr></thead><tbody>${rows.slice(0,50).map(row=>`<tr><td class="mono"><b>${esc(short(row.mint,36))}</b></td><td><b>${esc(short(row.program,28))}</b><div class="muted small">${esc(row.instruction_type||'create')}</div></td><td class="mono">${esc(short(row.signature,30))}</td><td>${num(row.slot)}</td><td>${badge(row.verification_status||'observed')}</td><td>${badge(row.fate_status||'market data pending')}<div class="muted small">${esc(text(row.market_evidence_status,row.fate_reason,'piyasa kanıtı yok'))}</div></td></tr>`).join('')}</tbody></table></div>`;\n  }\n'''
          replace_once(ui, old, new)
          old = '''          ${metric('Doğrulanan',num(portfolio.candidates_verified))}\n          ${metric('Doğrulama hatası',num(portfolio.verification_failures))}\n'''
          new = '''          ${metric('Doğrulanan',num(portfolio.candidates_verified))}\n          ${metric('Observation store',num(portfolio.observed_store_candidates_merged))}\n          ${metric('Aktif',num(portfolio.liquid_candidates))}\n          ${metric('Ölü / likiditesiz',num(portfolio.inactive_or_dead_candidates))}\n          ${metric('Piyasa verisi yok',num(portfolio.market_data_unavailable_candidates))}\n          ${metric('Doğrulama hatası',num(portfolio.verification_failures))}\n'''
          replace_once(ui, old, new)
          PY

      - name: Format
        run: |
          cd koschei/api
          gofmt -w internal/handlers/customer_wallet_investigation.go \
            internal/handlers/customer_wallet_investigation_test.go \
            internal/handlers/actor_created_mint_market.go \
            internal/handlers/actor_created_mint_market_test.go \
            internal/handlers/security_radar.go \
            internal/handlers/actor_created_mint_integration.go \
            internal/services/solscan_created_mint_discovery.go
          test -z "$(gofmt -l .)"

      - name: Verify JavaScript
        run: |
          cd koschei/api
          node --check public/js/owner-creator-intelligence.js
          node scripts/verify-customer-investigation-ui.js

      - name: Test
        run: |
          cd koschei/api
          go test ./...

      - name: Vet
        run: |
          cd koschei/api
          go vet ./...

      - name: Build
        run: |
          cd koschei/api
          CGO_ENABLED=0 GOOS=linux go build ./...

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            koschei/api/internal/handlers/customer_wallet_investigation.go \
            koschei/api/internal/handlers/customer_wallet_investigation_test.go \
            koschei/api/internal/handlers/actor_created_mint_market.go \
            koschei/api/internal/handlers/actor_created_mint_market_test.go \
            koschei/api/internal/handlers/security_radar.go \
            koschei/api/internal/handlers/actor_created_mint_integration.go \
            koschei/api/internal/services/solscan_created_mint_discovery.go \
            koschei/api/public/js/owner-creator-intelligence.js
          if git diff --cached --quiet; then
            echo 'No code changes to commit.'
            exit 0
          fi
          git commit -m 'route wallet scans and preserve market evidence states'
          git push origin HEAD:agent/address-intelligence-completeness
