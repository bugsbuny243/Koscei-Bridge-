name: Diagnostic ARVIS social renderer v2

on:
  pull_request:
    branches: [main]
    paths:
      - "koschei/api/public/js/arvis-social-render-v2-*.js"
      - "koschei/api/english_public_html.go"
      - "koschei/api/english_public_html_test.go"
      - "koschei/api/arvis_social_renderer_v2_test.go"
      - ".github/workflows/diagnostic-arvis-social-v2.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install headless renderer
        run: |
          npm --prefix "${RUNNER_TEMP}/arvis-render" init -y
          npm --prefix "${RUNNER_TEMP}/arvis-render" install playwright@1.55.0
          "${RUNNER_TEMP}/arvis-render/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render platform-native assets
        env:
          NODE_PATH: ${{ runner.temp }}/arvis-render/node_modules
        run: |
          mkdir -p "${RUNNER_TEMP}/arvis-v2"
          cat > "${RUNNER_TEMP}/render-arvis-v2.cjs" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const root = process.cwd();
          const output = path.join(process.env.RUNNER_TEMP, 'arvis-v2');
          const scripts = [
            'koschei/api/public/js/arvis-premium-contract.js',
            'koschei/api/public/js/arvis-social-render-v2-core.js',
            'koschei/api/public/js/arvis-social-render-v2-cards.js',
            'koschei/api/public/js/arvis-social-render-v2-publish.js',
          ];
          const payload = {
            target: '6QPvGr1L7aXG9vDmtRjV8pZsA2M5NfYwKxE4HcBpump',
            name: 'Cult of Z',
            symbol: 'CULTZ',
            grade: 'B',
            signature: 'koschei-unified:5212c2b8a4f4b790af8fd91f',
            ruleset_version: 'koschei-unified-radar-rules-v1.1.0',
            final_policy: 'review',
            final_verdict: {
              grade: 'B',
              signed: true,
              verdict: 'compounding_rule',
              signature: 'koschei-unified:5212c2b8a4f4b790af8fd91f',
              ruleset_version: 'koschei-unified-radar-rules-v1.1.0',
              confidence: 'high'
            },
            holder_intelligence: {
              top_owner_percentage: 54.38,
              top_10_percentage: 82.74,
              top_owner_reference_usd_value: 386400
            },
            holder_cluster: {
              deep_owners_scanned: 15,
              shallow_owners_scanned: 25,
              rpc_calls_used: 143,
              rpc_budget: 180,
              confidence: 'high',
              same_amount_groups: [{
                key: '0.015 SOL',
                member_count: 6,
                holder_percentage: 31.62,
                wallets: ['A111','B222','C333','D444','E555','F666']
              }],
              wallets: []
            },
            market: {
              market_cap_usd: 920000,
              liquidity_usd: 48600,
              volume_24h_usd: 174000,
              price_usd: 0.00092
            },
            token_2022: false,
            token_program: 'spl-token',
            creator_intelligence: {}
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1800, height: 2200 }, deviceScaleFactor: 1 });
            await page.setContent('<!doctype html><html><body style="margin:0;background:#02060b"></body></html>');
            for (const script of scripts) await page.addScriptTag({ path: path.join(root, script) });
            const version = await page.evaluate(() => window.KoscheiARVISPremium.socialRendererVersion);
            if (version !== '2.0.0') throw new Error(`unexpected renderer version ${version}`);

            const specs = [
              ['x', 'x', 0],
              ['instagram', 'instagram', 0],
              ['story', 'story', 0],
              ['tiktok-cover', 'tiktok', 0],
              ['tiktok-holder', 'tiktok', 1],
              ['tiktok-liquidity', 'tiktok', 2],
              ['tiktok-linkage', 'tiktok', 3],
              ['tiktok-verdict', 'tiktok', 4],
            ];
            const rendered = await page.evaluate(({ payload, specs }) => specs.map(([name, format, scene]) => {
              const canvas = window.KoscheiARVISPremium.drawCardCanvas(payload, format, scene, 1);
              return { name, width: canvas.width, height: canvas.height, data: canvas.toDataURL('image/png') };
            }), { payload, specs });

            for (const item of rendered) {
              const expected = item.name === 'x' ? [1600, 900] : item.name === 'instagram' ? [1080, 1080] : [1080, 1920];
              if (item.width !== expected[0] || item.height !== expected[1]) throw new Error(`${item.name}: ${item.width}x${item.height}`);
              fs.writeFileSync(path.join(output, `${item.name}.png`), Buffer.from(item.data.split(',')[1], 'base64'));
            }

            await page.setContent('<!doctype html><html><head><style>body{margin:0;padding:28px;background:#010409;color:#fff;font:700 18px Arial}.grid{display:grid;grid-template-columns:repeat(4,360px);gap:24px}.item{background:#07131d;border:1px solid #1c534d;border-radius:18px;padding:14px}.item img{display:block;width:100%;height:auto;border-radius:10px}.item b{display:block;margin-bottom:10px;color:#20f4ae;text-transform:uppercase}</style></head><body><div class="grid"></div></body></html>');
            await page.evaluate(rendered => {
              const grid = document.querySelector('.grid');
              for (const item of rendered) {
                const node = document.createElement('div');
                node.className = 'item';
                node.innerHTML = `<b>${item.name}</b><img src="${item.data}">`;
                grid.appendChild(node);
              }
            }, rendered);
            await page.screenshot({ path: path.join(output, 'contact-sheet.png'), fullPage: true });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node "${RUNNER_TEMP}/render-arvis-v2.cjs"
          test -s "${RUNNER_TEMP}/arvis-v2/contact-sheet.png"
          ! cmp -s "${RUNNER_TEMP}/arvis-v2/story.png" "${RUNNER_TEMP}/arvis-v2/tiktok-cover.png"
          sha256sum "${RUNNER_TEMP}/arvis-v2"/*.png
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: arvis-social-render-v2-proof
          path: ${{ runner.temp }}/arvis-v2/*.png
          if-no-files-found: error
          retention-days: 7
