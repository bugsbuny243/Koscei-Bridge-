name: Production full scan diagnostic v2 once

on:
  push:
    branches:
      - diagnostic/production-full-scan-20260904

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run real production full scan after RPC budget tuning
        working-directory: koschei/api
        env:
          BASE_URL: https://tradepigloball.co
          FULL_SCAN_TIMEOUT_MS: '300000'
        run: node scripts/verify-production-full-scan.js
