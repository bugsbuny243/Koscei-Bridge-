name: Release Gates Autofmt PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ github.head_ref == 'agent/release-gates-2026-08-02' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-gates-2026-08-02
          fetch-depth: 0
      - name: Set up Go 1.25.12
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Normalize Go formatting
        run: gofmt -w koschei/api
      - name: Commit formatting-only changes
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.go'; then
            echo "Go tree already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "chore: gofmt repository for release gate"
          git push origin HEAD:agent/release-gates-2026-08-02
