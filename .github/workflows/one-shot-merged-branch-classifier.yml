name: One-shot fully merged branch cleanup

on:
  push:
    branches:
      - fix/retire-kosch-commercial-legacy-v1

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete only branches fully contained in main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$base"
          echo "MAIN_SNAPSHOT=$base"

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/bugsbuny243/Koschei-Web3-Hub/pulls?state=open&per_page=100' \
            | jq -r '.[] | select(.head.repo.full_name == "bugsbuny243/Koschei-Web3-Hub") | .head.ref' \
            | sort -u > /tmp/open-pr-heads.txt

          : > /tmp/delete-candidates.txt
          total=0
          excluded=0
          open_pr_excluded=0

          while IFS=' ' read -r ref sha; do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in
              HEAD|main|master|develop|development|staging|production|prod|release|gh-pages|fix/retire-kosch-commercial-legacy-v1)
                excluded=$((excluded+1))
                continue
                ;;
            esac
            total=$((total+1))
            if grep -Fxq "$branch" /tmp/open-pr-heads.txt; then
              open_pr_excluded=$((open_pr_excluded+1))
              continue
            fi
            if git merge-base --is-ancestor "$sha" "$base"; then
              printf '%s\t%s\n' "$branch" "$sha" >> /tmp/delete-candidates.txt
            fi
          done < <(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin/)

          sort -o /tmp/delete-candidates.txt /tmp/delete-candidates.txt
          candidates="$(wc -l < /tmp/delete-candidates.txt | tr -d ' ')"
          echo "TOTAL_CLASSIFIED=$total"
          echo "EXCLUDED_LONG_LIVED_OR_HELPER=$excluded"
          echo "EXCLUDED_OPEN_PR_HEADS=$open_pr_excluded"
          echo "DELETE_CANDIDATES=$candidates"

          end="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$end" != "$base" ]; then
            git fetch --depth=1 origin "$end"
            git merge-base --is-ancestor "$base" "$end" || { echo "main moved non-fast-forward; refusing cleanup"; exit 42; }
            echo "MAIN_MOVEMENT=fast_forward_safe_for_containment"
          else
            echo "MAIN_MOVEMENT=stable"
          fi

          deleted=0
          moved=0
          failed=0
          while IFS=$'\t' read -r branch sha; do
            [ -n "$branch" ] || continue
            current="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$current" ]; then
              continue
            fi
            if [ "$current" != "$sha" ]; then
              echo "SKIP_MOVED $branch expected=$sha actual=$current"
              moved=$((moved+1))
              continue
            fi
            if git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"; then
              echo "DELETED $branch $sha"
              deleted=$((deleted+1))
            else
              echo "FAILED_DELETE $branch $sha"
              failed=$((failed+1))
            fi
          done < /tmp/delete-candidates.txt

          after="$(git ls-remote --heads origin | wc -l | tr -d ' ')"
          echo "DELETED_COUNT=$deleted"
          echo "SKIPPED_MOVED_COUNT=$moved"
          echo "FAILED_DELETE_COUNT=$failed"
          echo "REMOTE_BRANCH_COUNT_AFTER=$after"
          test "$failed" -eq 0
