name: Diagnostic ARVIS premium production smoke

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/diagnostic-arvis-premium-production-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health and premium assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://koschei-web3-hub-production.up.railway.app'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          fetch() {
            local path="$1" file="$2" code
            code="$(curl --silent --show-error --connect-timeout 15 --max-time 45 -w '%{http_code}' "$base$path" -o "$work/$file")"
            echo "HTTP $code $path -> $file"
            test "$code" = '200'
            test -s "$work/$file"
          }
          check() {
            local file="$1" pattern="$2" label="$3"
            if grep -Eiq "$pattern" "$work/$file"; then
              echo "PASS $label"
            else
              echo "FAIL $label pattern=$pattern file=$file"
              head -c 500 "$work/$file" || true
              echo
              exit 1
            fi
          }

          fetch /health health.json
          fetch /security-radar security-radar.html
          fetch /owner-production.html owner-production.html
          fetch /js/arvis-premium-contract.js arvis-premium-contract.js
          fetch /js/owner-social-studio.js owner-social-studio.js
          fetch /js/customer-arvis-premium-suite.js customer-arvis-premium-suite.js
          fetch /js/koschei-english-runtime.js koschei-english-runtime.js

          check health.json '"status"|"ok"|healthy' 'health payload'
          check security-radar.html '<html lang="en">' 'English customer HTML'
          check security-radar.html '/js/arvis-premium-contract.js' 'canonical premium contract link'
          check security-radar.html '/js/customer-arvis-premium-suite.js' 'customer premium suite link'
          check security-radar.html '/css/arvis-premium-suite.css' 'premium stylesheet link'
          check owner-production.html '/js/owner-social-studio.js' 'owner social studio link'
          check owner-production.html '/js/owner-arvis-premium-suite.js' 'owner premium card link'
          check arvis-premium-contract.js 'recordVerticalVideo' 'TikTok vertical video renderer'
          check owner-social-studio.js 'Instagram|instagram' 'Instagram publishing center'
          check customer-arvis-premium-suite.js 'CUSTOMER RESULT EXPORT|customer result' 'customer result export center'
          check koschei-english-runtime.js 'MutationObserver' 'global English runtime'

          echo 'PRODUCTION_SMOKE_OK'
          wc -c "$work"/*
          sha256sum "$work"/*
