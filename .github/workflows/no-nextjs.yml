name: no-nextjs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  forbid-nextjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce no-Next.js policy
        run: sh scripts/forbid-nextjs.sh
