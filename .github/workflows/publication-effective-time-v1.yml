name: Publication Effective Time V1 Acceptance

on:
  pull_request:
    paths:
      - 'koschei/api/migrations/100_dossier_publication_effective_time.sql'
      - 'koschei/api/internal/handlers/publication_effective_time.go'
      - 'koschei/api/internal/handlers/publication_effective_time_test.go'
      - 'koschei/api/internal/handlers/publication_effective_time_postgres_test.go'
      - 'koschei/api/internal/handlers/public_dossier_cases_v2.go'
      - 'koschei/api/internal/handlers/public_exposure_authorization.go'
      - 'koschei/api/internal/handlers/public_exposure_authorization_test.go'
      - 'koschei/api/public/cases.html'
      - 'koschei/api/public/js/public-soc.js'
      - 'koschei/api/scripts/verify-publication-effective-time-v1.js'
      - 'koschei/api/scripts/verify-publication-ledger-readback-v1.js'
      - 'koschei/api/scripts/verify-public-case-registry-integrity-v1.js'
      - 'koschei/api/scripts/verify-public-exposure-authorization-v1.js'
      - '.github/workflows/publication-effective-time-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-effective-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_time_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_time_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    env:
      PGPASSWORD: postgres
      KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_time_ci?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify touched Go formatting
        run: |
          set -euo pipefail
          files=(
            internal/handlers/publication_effective_time.go
            internal/handlers/publication_effective_time_test.go
            internal/handlers/publication_effective_time_postgres_test.go
            internal/handlers/public_dossier_cases_v2.go
            internal/handlers/public_exposure_authorization.go
            internal/handlers/public_exposure_authorization_test.go
          )
          diff -u <(cat "${files[@]}") <(gofmt "${files[@]}")

      - name: Compile handlers
        run: go test ./internal/handlers -run '^$'

      - name: Test deterministic time resolver
        run: go test ./internal/handlers -run '^TestResolvePublicationEffectiveTime' -count=1

      - name: Check public case JavaScript
        run: node --check public/js/public-soc.js

      - name: Verify static effective-time contract
        run: node scripts/verify-publication-effective-time-v1.js

      - name: Apply migrations on PostgreSQL 17
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "RUN ${migration}"
            psql "${KOSCHEI_TEST_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file="${migration}"
          done

      - name: Verify effective publication-time lifecycle
        run: go test ./internal/handlers -run '^TestPublicationEffectiveTimeLifecyclePostgres17$' -count=1

      - name: Verify direct exposure revocation regression
        run: go test ./internal/handlers -run '^TestLoadPublicExposureRecordRevokesAfterHidePostgres17$' -count=1

      - name: Verify discovery revocation regression
        run: go test ./internal/handlers -run '^TestPublicDossierCasesV2RevokesDiscoveryAfterHidePostgres17$' -count=1

      - name: Verify publication ledger linkage regression
        run: bash scripts/verify-publication-ledger-linkage-postgres.sh

      - name: Verify ledger readback regression
        run: node scripts/verify-publication-ledger-readback-v1.js

      - name: Verify registry integrity regression
        run: node scripts/verify-public-case-registry-integrity-v1.js

      - name: Verify direct exposure regression
        run: node scripts/verify-public-exposure-authorization-v1.js
