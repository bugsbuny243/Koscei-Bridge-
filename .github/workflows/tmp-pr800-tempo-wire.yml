name: Temporary PR800 tempo wiring

on:
  push:
    branches:
      - feat/campaign-tempo-fingerprint-v1
    paths:
      - ".github/workflows/tmp-pr800-tempo-wire.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-tempo-fingerprint-v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache: false
      - name: Fix fixture and wire canonical token investigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('koschei/api/internal/services/campaign_tempo_fingerprint_test.go')
          text = test.read_text()
          old = 'tempoEdge("Funder1", "wallet", "ActorB", "wallet", "funding", "funded_actor", "verified", base.Add(2*time.Hour), "fund-b", nil)'
          new = 'tempoEdge("Funder1", "wallet", "ActorB", "wallet", "funding", "funded_actor", "verified", base.Add(12*time.Hour), "fund-b", nil)'
          if text.count(old) != 1:
              raise SystemExit('expected ActorB funding fixture once')
          test.write_text(text.replace(old, new))

          service = Path('koschei/api/internal/services/campaign_tempo_fingerprint.go')
          text = service.read_text()
          old = '''\tdefault:\n\t\treturn parseCampaignTempoTime(strings.TrimSpace(toString(typed)))\n\t}'''
          new = '''\tdefault:\n\t\treturn time.Time{}, false\n\t}'''
          if text.count(old) != 1:
              raise SystemExit('expected metadata default conversion once')
          service.write_text(text.replace(old, new))

          handler = Path('koschei/api/internal/handlers/unified_investigation_report.go')
          text = handler.read_text()
          old = '''\tbehavioralSignatures := services.BuildBehavioralSignatureReportWithTrajectory(\n\t\ttarget, actorIncidentHistory, fundingOutcomeMemory, campaignGenome, operationalMemory, campaignGenomeMatches,\n\t\tservices.LoadPersistentFundingTrajectoryGraphForBehavior(ctx, db, creator, network),\n\t)'''
          new = '''\tfundingTrajectory := services.LoadPersistentFundingTrajectoryGraphForBehavior(ctx, db, creator, network)\n\tcampaignTempo := services.BuildCampaignTempoFingerprint(fundingTrajectory)\n\tbehavioralSignatures := services.BuildBehavioralSignatureReportWithTempo(\n\t\ttarget, actorIncidentHistory, fundingOutcomeMemory, campaignGenome, operationalMemory, campaignGenomeMatches,\n\t\tfundingTrajectory, campaignTempo,\n\t)'''
          if text.count(old) != 1:
              raise SystemExit('expected trajectory behavior builder call once')
          text = text.replace(old, new)

          old = '''\t\t"campaign_genome_matches":      campaignGenomeMatches,\n\t\t"behavioral_signatures":        behavioralSignatures,'''
          new = '''\t\t"campaign_genome_matches":      campaignGenomeMatches,\n\t\t"campaign_tempo_fingerprint":   campaignTempo,\n\t\t"behavioral_signatures":        behavioralSignatures,'''
          if text.count(old) != 1:
              raise SystemExit('expected top-level behavior report anchor once')
          text = text.replace(old, new)

          old = '''\t\t\t"campaign_genome_matches":     campaignGenomeMatches,\n\t\t\t"operational_memory":          operationalMemory,'''
          new = '''\t\t\t"campaign_genome_matches":     campaignGenomeMatches,\n\t\t\t"campaign_tempo_fingerprint":  campaignTempo,\n\t\t\t"operational_memory":          operationalMemory,'''
          if text.count(old) != 1:
              raise SystemExit('expected actor investigation campaign anchor once')
          text = text.replace(old, new)

          old = '''\t\t\t"behavioral_signatures_can_change_grade":     false,'''
          new = '''\t\t\t"campaign_tempo_can_change_grade":            false,\n\t\t\t"behavioral_signatures_can_change_grade":     false,'''
          if text.count(old) != 1:
              raise SystemExit('expected evidence policy anchor once')
          handler.write_text(text.replace(old, new))
          PY
          gofmt -w \
            koschei/api/internal/services/campaign_tempo_fingerprint.go \
            koschei/api/internal/services/campaign_tempo_fingerprint_test.go \
            koschei/api/internal/handlers/unified_investigation_report.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            koschei/api/internal/services/campaign_tempo_fingerprint.go \
            koschei/api/internal/services/campaign_tempo_fingerprint_test.go \
            koschei/api/internal/handlers/unified_investigation_report.go
          git commit -m "feat(intelligence): wire campaign tempo fingerprint"
          git push origin HEAD:feat/campaign-tempo-fingerprint-v1
