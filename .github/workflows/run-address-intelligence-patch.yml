name: Run Address Intelligence Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/address-intelligence-completeness'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: koschei/api/go.sum
      - name: Extract and run patch
        shell: bash
        run: |
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-address-intelligence-completeness.yml > /tmp/address_patch.py
          test -s /tmp/address_patch.py
          python3 /tmp/address_patch.py
      - name: Format and verify JavaScript
        run: |
          cd koschei/api
          gofmt -w internal/handlers/customer_wallet_investigation.go \
            internal/handlers/customer_wallet_investigation_test.go \
            internal/handlers/actor_created_mint_market.go \
            internal/handlers/actor_created_mint_market_test.go \
            internal/handlers/security_radar.go \
            internal/handlers/actor_created_mint_integration.go \
            internal/services/solscan_created_mint_discovery.go
          test -z "$(gofmt -l .)"
          node --check public/js/owner-creator-intelligence.js
          node scripts/verify-customer-investigation-ui.js
      - name: Test
        run: cd koschei/api && go test ./...
      - name: Vet
        run: cd koschei/api && go vet ./...
      - name: Build
        run: cd koschei/api && CGO_ENABLED=0 GOOS=linux go build ./...
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            koschei/api/internal/handlers/customer_wallet_investigation.go \
            koschei/api/internal/handlers/customer_wallet_investigation_test.go \
            koschei/api/internal/handlers/actor_created_mint_market.go \
            koschei/api/internal/handlers/actor_created_mint_market_test.go \
            koschei/api/internal/handlers/security_radar.go \
            koschei/api/internal/handlers/actor_created_mint_integration.go \
            koschei/api/internal/services/solscan_created_mint_discovery.go \
            koschei/api/public/js/owner-creator-intelligence.js
          if git diff --cached --quiet; then
            echo 'No code changes to commit.'
            exit 0
          fi
          git commit -m 'route wallet scans and preserve market evidence states'
          git push origin HEAD:${{ github.head_ref }}
