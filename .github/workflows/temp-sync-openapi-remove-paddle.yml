name: Temporary OpenAPI Sync - Remove Paddle

on:
  push:
    branches:
      - chore/remove-paddle
    paths:
      - '.github/workflows/temp-sync-openapi-remove-paddle.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-paddle
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Regenerate canonical OpenAPI and self-remove
        run: |
          set -euo pipefail
          cd koschei/api
          go run ./cmd/openapi-gen
          cd ../..
          git diff --check
          git add koschei/api/openapi.yaml
          git rm .github/workflows/temp-sync-openapi-remove-paddle.yml
          if git diff --cached --quiet; then
            echo 'No OpenAPI drift to commit.'
            exit 0
          fi
          git config user.name 'koschei-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: sync OpenAPI after Paddle retirement'
          git push origin HEAD:chore/remove-paddle
