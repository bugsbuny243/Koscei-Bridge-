name: Temp Customer State Recheck V1
on:
  push:
    branches: [feat/customer-state-recheck-v1]
    paths:
      - .github/workflows/tmp-customer-state-recheck-v1.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-state-recheck-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Apply customer state recheck contract and UI
        run: python3 .github/tmp-customer-state-recheck-v1.py
      - name: Verify and commit product patch
        run: |
          set -euo pipefail
          cd koschei/api
          gofmt -w internal/http/server.go internal/http/route_inventory.go internal/http/server_access_test.go internal/openapi/generator.go
          go run ./cmd/openapi-gen
          node scripts/verify-customer-state-recheck-v1.js
          node scripts/verify-customer-transaction-preflight-v1.js
          node scripts/verify-customer-transaction-preflight-ui-v1.js
          node scripts/verify-customer-investigation-ui.js
          go test ./internal/http ./internal/handlers ./internal/openapi -count=1
          cd ../..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/internal/http/server.go koschei/api/internal/http/route_inventory.go koschei/api/internal/http/server_access_test.go koschei/api/internal/openapi/generator.go koschei/api/openapi.yaml koschei/api/public/js/customer-transaction-preflight-v1.js koschei/api/scripts/verify-customer-state-recheck-v1.js koschei/api/scripts/verify-customer-transaction-preflight-v1.js
          git commit -m 'feat(customer): add state witness recheck flow'
          git push origin HEAD:feat/customer-state-recheck-v1
