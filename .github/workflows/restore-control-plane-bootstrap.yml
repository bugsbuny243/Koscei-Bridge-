name: Restore Control Plane Bootstrap

on:
  push:
    branches:
      - agent/restore-legacy-control-plane
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-legacy-control-plane
          fetch-depth: 0
      - name: Apply control-plane patch and clean bootstrap files
        run: |
          set -euo pipefail
          cat .codex/restore-control-plane.part-* | base64 -d | gzip -d > /tmp/restore-control-plane.patch
          git apply --check /tmp/restore-control-plane.patch
          git apply /tmp/restore-control-plane.patch
          rm -rf .codex
          git rm .github/workflows/restore-control-plane-bootstrap.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore legacy runtime control plane"
          git push origin HEAD:agent/restore-legacy-control-plane
