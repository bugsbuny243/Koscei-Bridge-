name: Temp OpenAPI Sync V2
on:
  push:
    branches: [fix/openapi-main-drift-20260827-v2]
    paths: [.github/workflows/tmp-openapi-sync-v2.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openapi-main-drift-20260827-v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Generate exact OpenAPI repair
        run: |
          set -euo pipefail
          cd koschei/api
          go run ./cmd/openapi-gen
          go test ./internal/openapi -count=1
          cd ../..
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'koschei/api/openapi.yaml'
          git diff --check
      - name: Commit generated contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/openapi.yaml
          git commit -m 'fix(openapi): sync latest registered routes'
          git push origin HEAD:fix/openapi-main-drift-20260827-v2
