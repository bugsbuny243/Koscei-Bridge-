name: Temp Agent OpenAPI Sync
on:
  push:
    branches: [fix/tradepi-agent-gofmt-v3]
    paths: [.github/workflows/temp-agent-openapi-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tradepi-agent-gofmt-v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Generate exact OpenAPI contract
        working-directory: koschei/api
        run: |
          go run ./cmd/openapi-gen
          go run ./cmd/openapi-gen -check
          go test ./internal/openapi -count=1
      - name: Verify generator-only scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'koschei/api/openapi.yaml'
          git diff --check
      - name: Commit generated contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/openapi.yaml
          git commit -m 'fix(api): sync OpenAPI after TradePI agent routes'
          git push origin HEAD:fix/tradepi-agent-gofmt-v3
