name: Release Gates Migration Baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  baseline:
    if: ${{ github.head_ref == 'agent/release-gates-2026-08-02' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-gates-2026-08-02
          fetch-depth: 0
      - name: Snapshot existing accepted anomalies
        run: |
          python3 scripts/check_migration_numbering.py --write-baseline
          python3 scripts/check_migration_numbering.py
          python3 -m unittest scripts/test_migration_numbering.py
      - name: Commit immutable numbering baseline
        working-directory: .
        run: |
          set -euo pipefail
          baseline="koschei/api/migrations/migration-numbering-baseline.json"
          if [ -z "$(git status --porcelain -- "${baseline}")" ]; then
            echo "Migration numbering baseline already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${baseline}"
          git commit -m "ci: snapshot accepted migration numbering anomalies"
          git push origin HEAD:agent/release-gates-2026-08-02
