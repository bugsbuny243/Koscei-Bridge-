name: Temporary State Recheck Review Fix 2

on:
  push:
    branches: ["feat/customer-state-recheck-v1"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Apply bounded fixes
        run: python3 .github/scripts/state_recheck_review_fix2.py
      - name: Format and regenerate contract
        run: |
          set -euo pipefail
          gofmt -w koschei/api/internal/handlers/middleware_auth.go koschei/api/internal/http/server.go koschei/api/internal/http/sensitive_rate_limit.go koschei/api/internal/http/sensitive_rate_limit_test.go koschei/api/internal/openapi/generator.go koschei/api/internal/openapi/generator_test.go
          cd koschei/api
          go run ./cmd/openapi-gen
      - name: Verify focused contracts
        run: |
          set -euo pipefail
          cd koschei/api
          node scripts/verify-customer-state-recheck-v1.js
          node scripts/verify-customer-transaction-preflight-v1.js
          node scripts/verify-customer-transaction-preflight-ui-v1.js
          go test ./internal/http ./internal/handlers ./internal/openapi -count=1
          go run ./cmd/openapi-gen -check
          git diff --check
      - name: Commit bounded fixes
        run: |
          set -euo pipefail
          git add docs/transaction-state-recheck.md koschei/api/internal/handlers/middleware_auth.go koschei/api/internal/http/server.go koschei/api/internal/http/sensitive_rate_limit.go koschei/api/internal/http/sensitive_rate_limit_test.go koschei/api/internal/openapi/generator.go koschei/api/internal/openapi/generator_test.go koschei/api/openapi.yaml koschei/api/public/js/customer-transaction-preflight-v1.js koschei/api/scripts/verify-customer-state-recheck-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(customer): bound state recheck replay and contract"
          git push origin HEAD:feat/customer-state-recheck-v1
