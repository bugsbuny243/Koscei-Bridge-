name: Campaign Tempo Fingerprint Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "koschei/api/internal/services/campaign_tempo_fingerprint.go"
      - "koschei/api/internal/services/campaign_tempo_fingerprint_test.go"
      - "koschei/api/internal/services/campaign_tempo_multifunder_test.go"
      - "koschei/api/internal/services/persistent_funding_trajectory_graph.go"
      - "koschei/api/internal/handlers/unified_investigation_report.go"
      - ".github/workflows/campaign-tempo-fingerprint-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/campaign_tempo_fingerprint.go"
      - "koschei/api/internal/services/campaign_tempo_fingerprint_test.go"
      - "koschei/api/internal/services/campaign_tempo_multifunder_test.go"
      - "koschei/api/internal/services/persistent_funding_trajectory_graph.go"
      - "koschei/api/internal/handlers/unified_investigation_report.go"
      - ".github/workflows/campaign-tempo-fingerprint-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Verified campaign tempo recurrence stays watch-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Check touched Go formatting
        run: |
          set -euo pipefail
          test -z "$(gofmt -l \
            internal/services/campaign_tempo_fingerprint.go \
            internal/services/campaign_tempo_fingerprint_test.go \
            internal/services/campaign_tempo_multifunder_test.go \
            internal/handlers/unified_investigation_report.go)"
      - name: Download modules
        run: go mod download
      - name: Run campaign tempo acceptance tests
        run: |
          set -o pipefail
          go test -v ./internal/services -run '^(TestCampaignTempo|TestBehavioralSignatureTrajectory)' -count=1 2>&1 | tee "${RUNNER_TEMP}/campaign-tempo.txt"
      - name: Compile canonical token investigation package
        run: go test ./internal/handlers -run '^$' -count=1
      - name: Upload acceptance log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-tempo-fingerprint
          path: ${{ runner.temp }}/campaign-tempo.txt
          if-no-files-found: error
          retention-days: 7
