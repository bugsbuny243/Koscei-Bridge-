name: Temp Cherry-pick Customer Preflight Clean
on:
  push:
    branches: [feat/customer-transaction-preflight-ui-v1-clean]
    paths: [.github/workflows/tmp-cherrypick-customer-preflight-clean.yml]
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-transaction-preflight-ui-v1-clean
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Cherry-pick verified product commits and test
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 81a9743031a00f250e22dcd5e1b0e6537ba94fed eb065ae67d2117d7352508a9a4599ad119f84a35 6dd37cf7abbbc08d3a8cbc3a7ee12c6ebb7fef40
          git cherry-pick 81a9743031a00f250e22dcd5e1b0e6537ba94fed
          git cherry-pick eb065ae67d2117d7352508a9a4599ad119f84a35
          git cherry-pick 6dd37cf7abbbc08d3a8cbc3a7ee12c6ebb7fef40
          cd koschei/api
          node scripts/verify-customer-transaction-preflight-ui-v1.js
          node scripts/verify-customer-investigation-ui.js
          go test ./internal/http ./internal/handlers -count=1
          cd ../..
          git diff --check
          changed=$(git diff --name-only 374349e00753b5c69838652013e4d9ee22f48ecf..HEAD | grep -v '^.github/workflows/tmp-cherrypick-customer-preflight-clean.yml$' | sort)
          expected=$(printf '%s\n' 'koschei/api/public/js/customer-command-center-v1.js' 'koschei/api/public/js/customer-transaction-preflight-v1.js' 'koschei/api/public/scan.html' 'koschei/api/scripts/verify-customer-transaction-preflight-ui-v1.js' | sort)
          test "$changed" = "$expected"
          git push origin HEAD:feat/customer-transaction-preflight-ui-v1-clean