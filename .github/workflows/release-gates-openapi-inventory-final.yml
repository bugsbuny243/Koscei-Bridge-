name: Release Gates OpenAPI Inventory Final

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.head_ref == 'agent/release-gates-2026-08-02' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-gates-2026-08-02
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Reconcile inventory without making stale entries live
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/openapi/generator.go')
          s = p.read_text()
          old = '''type Route struct {
          \tPattern  string
          \tPath     string
          \tMethods  []string
          \tAuthTier string
          \tSource   string
          }'''
          new = '''type Route struct {
          \tPattern         string
          \tPath            string
          \tMethods         []string
          \tAuthTier        string
          \tInventoryAuth   string
          \tInventoryGroup  string
          \tInventorySource string
          \tSource          string
          }'''
          if old not in s:
              if new not in s:
                  raise SystemExit('route struct anchor not found')
          else:
              s = s.replace(old, new, 1)

          old = '''func Generate(sourceDir string) ([]byte, []Route, error) {
          \troutes, err := RegisteredAPIRoutes(sourceDir)
          \tif err != nil {
          \t\treturn nil, nil, err
          \t}
          \tdocument := buildDocument(routes)'''
          new = '''func Generate(sourceDir string) ([]byte, []Route, error) {
          \troutes, err := RegisteredAPIRoutes(sourceDir)
          \tif err != nil {
          \t\treturn nil, nil, err
          \t}
          \tinventory, err := RouteInventory(sourceDir)
          \tif err != nil {
          \t\treturn nil, nil, err
          \t}
          \tdocument := buildDocument(routes, inventory)'''
          if old not in s:
              if new not in s:
                  raise SystemExit('generate anchor not found')
          else:
              s = s.replace(old, new, 1)

          old = '''\tsort.Slice(routes, func(i, j int) bool { return routes[i].Path < routes[j].Path })
          \treturn routes, nil
          }'''
          new = '''\tsort.Slice(routes, func(i, j int) bool { return routes[i].Path < routes[j].Path })
          \tinventory, err := RouteInventory(sourceDir)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \treturn enrichRoutesWithInventory(routes, inventory), nil
          }'''
          if old not in s:
              if new not in s:
                  raise SystemExit('registered route return anchor not found')
          else:
              s = s.replace(old, new, 1)

          old = '''func buildDocument(routes []Route) Document {
          \tpaths := map[string]any{}'''
          new = '''func buildDocument(routes []Route, inventory []InventoryRoute) Document {
          \tpaths := map[string]any{}'''
          if old not in s:
              if new not in s:
                  raise SystemExit('buildDocument signature anchor not found')
          else:
              s = s.replace(old, new, 1)

          old = '''\treturn Document{
          \t\t"openapi": "3.1.0",
          \t\t"info": map[string]any{
          \t\t\t"title":   "Koschei Web3 Security API",
          \t\t\t"version": "2026-08-02",
          \t\t\t"description": "Evidence-first API contract generated from the registered server boot chain. " +
          \t\t\t\t"Static files, HTML pages, robots.txt and ads.txt are intentionally excluded; every registered /api/ route is included. " +
          \t\t\t\t"WITHHOLD is a valid verdict when required evidence is unavailable and carries unmet_evidence_reasons. Evidence counts are never quality scores.",
          \t\t},
          \t\t"servers": []any{map[string]any{"url": "/"}},
          \t\t"paths":   paths,'''
          new = '''\texcludedInventory := excludedInventoryOperations(routes, inventory)
          \treturn Document{
          \t\t"openapi": "3.1.0",
          \t\t"info": map[string]any{
          \t\t\t"title":   "Koschei Web3 Security API",
          \t\t\t"version": "2026-08-02",
          \t\t\t"description": "Evidence-first API contract generated from the registered server boot chain. " +
          \t\t\t\t"Static files, HTML pages, robots.txt and ads.txt are intentionally excluded; every registered /api/ route is included. " +
          \t\t\t\t"route_inventory.go supplies grouping and auth semantics only for matching live registrations. Inventory operations not registered in the boot chain are excluded from paths and listed in x-koschei-excluded-unregistered-inventory-operations. " +
          \t\t\t\t"WITHHOLD is a valid verdict when required evidence is unavailable and carries unmet_evidence_reasons. Evidence counts are never quality scores.",
          \t\t},
          \t\t"x-koschei-excluded-unregistered-inventory-operations": excludedInventory,
          \t\t"servers": []any{map[string]any{"url": "/"}},
          \t\t"paths":   paths,'''
          if old not in s:
              if new not in s:
                  raise SystemExit('document metadata anchor not found')
          else:
              s = s.replace(old, new, 1)

          old = '''\toperation := map[string]any{
          \t\t"operationId":         operationID(method, route.Path),
          \t\t"summary":             strings.ToUpper(method) + " " + route.Path,
          \t\t"description":         "Registered boot-chain operation. Required evidence that cannot be produced yields a successful withheld result rather than an inferred verdict.",
          \t\t"tags":                []string{routeTag(route.Path)},
          \t\t"x-koschei-auth-tier": route.AuthTier,
          \t\t"parameters":          pathParameters(route.Path),'''
          new = '''\tgroup := strings.TrimSpace(route.InventoryGroup)
          \tif group == "" {
          \t\tgroup = routeTag(route.Path)
          \t}
          \toperation := map[string]any{
          \t\t"operationId":              operationID(method, route.Path),
          \t\t"summary":                  strings.ToUpper(method) + " " + route.Path,
          \t\t"description":              "Registered boot-chain operation. Required evidence that cannot be produced yields a successful withheld result rather than an inferred verdict.",
          \t\t"tags":                     []string{group},
          \t\t"x-koschei-auth-tier":      route.AuthTier,
          \t\t"x-koschei-inventory-auth": route.InventoryAuth,
          \t\t"x-koschei-route-source":   route.InventorySource,
          \t\t"parameters":               pathParameters(route.Path),'''
          if old not in s:
              if new not in s:
                  raise SystemExit('operation metadata anchor not found')
          else:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('internal/openapi/generator_test.go')
          s = p.read_text()
          marker = 'func TestRouteInventoryStaleOperationsAreExcludedAndPublished'
          if marker not in s:
              s += r'''

          func TestRouteInventoryStaleOperationsAreExcludedAndPublished(t *testing.T) {
          	_, sourceDir, documentPath := testPaths(t)
          	routes, err := RegisteredAPIRoutes(sourceDir)
          	if err != nil {
          		t.Fatal(err)
          	}
          	inventory, err := RouteInventory(sourceDir)
          	if err != nil {
          		t.Fatal(err)
          	}
          	excluded := excludedInventoryOperations(routes, inventory)
          	if len(excluded) == 0 {
          		t.Fatal("expected at least one stale route_inventory.go operation to be explicitly excluded")
          	}
          	committed, err := os.ReadFile(documentPath)
          	if err != nil {
          		t.Fatal(err)
          	}
          	var document map[string]any
          	if err := json.Unmarshal(committed, &document); err != nil {
          		t.Fatal(err)
          	}
          	rawExcluded, ok := document["x-koschei-excluded-unregistered-inventory-operations"].([]any)
          	if !ok {
          		t.Fatal("OpenAPI document does not publish excluded stale inventory operations")
          	}
          	published := map[string]bool{}
          	for _, value := range rawExcluded {
          		published[value.(string)] = true
          	}
          	paths := object(document["paths"])
          	for _, operation := range excluded {
          		if !published[operation] {
          			t.Fatalf("excluded inventory operation not published: %s", operation)
          		}
          		parts := strings.SplitN(operation, " ", 2)
          		if len(parts) != 2 {
          			continue
          		}
          		if pathItem, ok := paths[parts[1]]; ok {
          			if _, live := object(pathItem)[strings.ToLower(parts[0])]; live {
          				t.Fatalf("stale inventory operation was incorrectly documented as live: %s", operation)
          			}
          		}
          	}
          }

          func TestRegisteredRoutesUseInventoryMetadataWhenAvailable(t *testing.T) {
          	_, sourceDir, _ := testPaths(t)
          	routes, err := RegisteredAPIRoutes(sourceDir)
          	if err != nil {
          		t.Fatal(err)
          	}
          	matched := 0
          	for _, route := range routes {
          		if route.InventorySource != "route_inventory.go" {
          			continue
          		}
          		matched++
          		if route.InventoryGroup == "" || route.InventoryAuth == "" {
          			t.Fatalf("route %s lacks inventory group/auth metadata: %+v", route.Path, route)
          		}
          	}
          	if matched == 0 {
          		t.Fatal("no registered route reconciled with route_inventory.go")
          	}
          }
          '''
              p.write_text(s)
          PY
          gofmt -w internal/openapi cmd/openapi-gen
          go run ./cmd/openapi-gen
          go test ./internal/openapi -count=1
          go run ./cmd/openapi-gen -check
      - name: Commit reconciled OpenAPI contract
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "OpenAPI inventory reconciliation already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml koschei/api/internal/openapi koschei/api/cmd/openapi-gen
          git commit -m "openapi: keep boot chain authoritative over stale inventory"
          git push origin HEAD:agent/release-gates-2026-08-02
