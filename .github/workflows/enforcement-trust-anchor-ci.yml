name: Enforcement Trust Anchor CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "koschei/api/public/js/koschei-enforcement-trust-anchor.js"
      - "koschei/api/public/js/koschei-enforcement-permit-verifier.js"
      - "koschei/api/public/js/koschei-wallet-enforcement-verified.js"
      - "koschei/api/scripts/verify-enforcement-trust-anchor.js"
      - ".github/workflows/enforcement-trust-anchor-ci.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/public/js/koschei-enforcement-trust-anchor.js"
      - "koschei/api/public/js/koschei-enforcement-permit-verifier.js"
      - "koschei/api/public/js/koschei-wallet-enforcement-verified.js"
      - "koschei/api/scripts/verify-enforcement-trust-anchor.js"
      - ".github/workflows/enforcement-trust-anchor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify pinned production Ed25519 key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check verifier JavaScript
        run: |
          node --check public/js/koschei-enforcement-trust-anchor.js
          node --check public/js/koschei-enforcement-permit-verifier.js
          node --check public/js/koschei-wallet-enforcement-verified.js
          node --check scripts/verify-enforcement-trust-anchor.js
      - name: Verify production trust anchor
        run: node scripts/verify-enforcement-trust-anchor.js
