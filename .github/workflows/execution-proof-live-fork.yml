name: execution-proof-live-fork

on:
  pull_request:
    paths:
      - 'koschei/api/internal/executionproof/**'
      - '.github/workflows/execution-proof-live-fork.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-ethereum-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify Anvil runner
        run: |
          anvil --version
          command -v anvil

      - name: Run pinned Ethereum fork proof
        working-directory: koschei/api
        env:
          KOSCHEI_LIVE_FORK_URL: https://ethereum-rpc.publicnode.com
        run: |
          export KOSCHEI_ANVIL_PATH="$(command -v anvil)"
          go test -tags=integration -count=1 -run '^TestLivePinnedEthereumForkProducesVerifiedReceipt$' ./internal/executionproof
