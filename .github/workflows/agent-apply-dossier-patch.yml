name: Agent Apply Dossier Patch

on:
  push:
    branches:
      - fix/dossier-registry-autopublish
    paths:
      - .github/workflows/agent-apply-dossier-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dossier-registry-autopublish
          fetch-depth: 0

      - name: Apply bounded source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          actor_path = Path('koschei/api/internal/handlers/dossier_actor.go')
          actor = actor_path.read_text()
          start = actor.index('func normalizeActorDossierState(value string) string {')
          end_marker = '\n}\n\nfunc actorDossierRefs'
          end = actor.index(end_marker, start) + 2
          actor = actor[:start] + '''func normalizeActorDossierState(value string) string {
          return normalizeSignalState(value)
          }''' + actor[end:]
          actor = actor.replace(
              '(row.State == "verified" || row.State == "observed") && !dossierRefsPresent(row.Refs)',
              'signalStateIsEvidence(row.State) && !dossierRefsPresent(row.Refs)',
          )
          actor_path.write_text(actor)

          smoke_path = Path('.github/workflows/public-product-smoke.yml')
          smoke = smoke_path.read_text()
          old = 'expect_200 live_page /live "Canlı SOC"'
          new = 'expect_200 live_page /live "Canlı Solana Güvenlik Radarı"'
          if old not in smoke:
              raise SystemExit('stale live-page smoke marker not found')
          smoke_path.write_text(smoke.replace(old, new, 1))
          PY
          gofmt -w koschei/api/internal/handlers/dossier_actor.go
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/internal/handlers/dossier_actor.go .github/workflows/public-product-smoke.yml
          git commit -m 'fix(arvis): align actor dossier and public smoke contracts'
          git push origin HEAD:fix/dossier-registry-autopublish
