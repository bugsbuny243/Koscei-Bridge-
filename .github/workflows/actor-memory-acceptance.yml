name: Persistent Actor Memory Acceptance

on:
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/persistent_repeat_actor_memory.go"
      - "koschei/api/internal/services/persistent_repeat_actor_memory_test.go"
      - "koschei/api/internal/services/persistent_repeat_actor_memory_postgres_test.go"
      - "koschei/api/internal/handlers/holder_intelligence_core.go"
      - "koschei/api/migrations/**"
      - ".github/workflows/actor-memory-acceptance.yml"
  pull_request:
    paths:
      - "koschei/api/internal/services/persistent_repeat_actor_memory.go"
      - "koschei/api/internal/services/persistent_repeat_actor_memory_test.go"
      - "koschei/api/internal/services/persistent_repeat_actor_memory_postgres_test.go"
      - "koschei/api/internal/handlers/holder_intelligence_core.go"
      - "koschei/api/migrations/**"
      - ".github/workflows/actor-memory-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-memory:
    name: Prove actor memory survives raw retention
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_actor_memory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_actor_memory_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_actor_memory_ci \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}" >/dev/null
          done
      - name: Run persistent actor memory tests
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_actor_memory_ci?sslmode=disable
        run: |
          set -euo pipefail
          go test -v ./internal/services \
            -run '^(TestPersistentRepeatActorMemoryPostgres17|TestPersistentRepeatDominantEvidenceIsRetentionIndependentAndNoIdentityClaim|TestPersistentRepeatActorNoMatchCompletesAllTimeQueryWithoutSafetyClaim)$' \
            -count=1
