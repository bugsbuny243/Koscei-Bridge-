name: Temp OpenAPI Plus Gofmt
on:
  push:
    branches: [fix/openapi-main-drift-20260827]
    paths: [.github/workflows/tmp-openapi-plus-gofmt.yml]
permissions:
  contents: write
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openapi-main-drift-20260827
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - name: Apply exact formatting blocker and verify OpenAPI
        run: |
          gofmt -w koschei/api/internal/http/agent_routes.go
          cd koschei/api
          go test ./internal/openapi -count=1
          cd ../..
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'koschei/api/internal/http/agent_routes.go'
          git diff --check
      - name: Commit formatting blocker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/internal/http/agent_routes.go
          git commit -m 'fix(ci): gofmt current agent routes'
          git push origin HEAD:fix/openapi-main-drift-20260827
