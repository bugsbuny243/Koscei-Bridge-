name: Temp Customer Transaction Preflight V1 Current
on:
  push:
    branches: [feat/customer-transaction-preflight-v1-current]
    paths: [.github/workflows/temp-customer-preflight-v1-current.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-transaction-preflight-v1-current
      - uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add customer preflight facade and contract
        run: |
          python - <<'PY'
          from pathlib import Path
          server=Path('koschei/api/internal/http/server.go')
          s=server.read_text()
          needle='\tmux.HandleFunc("/api/v1/radar/detail", solana(requiresDB(h, planTier("starter", method("GET", h.SecurityRadarDetailV3)))))\n'
          insert=needle+'\tmux.HandleFunc("/api/customer/web3/transaction-preflight", solana(requiresDB(h, planTier("professional", method("POST", h.TransactionGuardV2Configured)))))\n'
          if '/api/customer/web3/transaction-preflight' not in s:
              if needle not in s: raise SystemExit('server anchor missing')
              s=s.replace(needle,insert,1)
              server.write_text(s)
          inv=Path('koschei/api/internal/http/route_inventory.go')
          s=inv.read_text()
          needle='\t\t\t"POST /api/v1/token/extensions", "POST /api/v1/address-poisoning/check",\n'
          repl='\t\t\t"POST /api/v1/token/extensions", "POST /api/v1/address-poisoning/check", "POST /api/customer/web3/transaction-preflight",\n'
          if 'POST /api/customer/web3/transaction-preflight' not in s:
              if needle not in s: raise SystemExit('inventory anchor missing')
              s=s.replace(needle,repl,1)
              inv.write_text(s)
          gen=Path('koschei/api/internal/openapi/generator.go')
          s=gen.read_text()
          needle='\tcase strings.HasPrefix(path, "/api/watchlist"):\n\t\treturn "customer_session_plus_professional_entitlement"\n'
          repl=needle+'\tcase path == "/api/customer/web3/transaction-preflight":\n\t\treturn "customer_session_plus_professional_entitlement"\n'
          if 'case path == "/api/customer/web3/transaction-preflight":' not in s:
              if needle not in s: raise SystemExit('openapi auth anchor missing')
              s=s.replace(needle,repl,1)
              gen.write_text(s)
          test=Path('koschei/api/internal/http/server_access_test.go')
          s=test.read_text()
          old='''\t// SaaS plan names are the route authorization contract: Starter includes the\n\t// paid investigation routes and canonical durable-job create routes, while\n\t// Professional covers the advanced radar surfaces. Job reads remain\n\t// authenticated but are not counted here because they do not consume a new\n\t// premium output.\n\twant := []string{"starter", "starter", "starter", "starter", "starter", "starter", "professional", "professional", "professional", "professional", "professional", "professional"}\n'''
          new='''\t// SaaS plan names are the route authorization contract: Starter includes the\n\t// paid investigation routes and canonical durable-job create routes, while\n\t// Professional covers transaction preflight and advanced radar surfaces. Job\n\t// reads remain authenticated but are not counted here because they do not\n\t// consume a new premium output.\n\twant := []string{"starter", "starter", "starter", "starter", "starter", "starter", "professional", "professional", "professional", "professional", "professional", "professional", "professional"}\n'''
          if old not in s: raise SystemExit('tier test anchor missing')
          test.write_text(s.replace(old,new,1))
          verify=Path('koschei/api/scripts/verify-customer-transaction-preflight-v1.js')
          verify.write_text('''const fs=require("fs");\nconst path=require("path");\nconst root=path.resolve(__dirname,"..");\nconst server=fs.readFileSync(path.join(root,"internal/http/server.go"),"utf8");\nconst inventory=fs.readFileSync(path.join(root,"internal/http/route_inventory.go"),"utf8");\nconst generator=fs.readFileSync(path.join(root,"internal/openapi/generator.go"),"utf8");\nconst accessTest=fs.readFileSync(path.join(root,"internal/http/server_access_test.go"),"utf8");\nconst route='mux.HandleFunc("/api/customer/web3/transaction-preflight", solana(requiresDB(h, planTier("professional", method("POST", h.TransactionGuardV2Configured)))))';\nif(!server.includes(route))throw new Error("customer transaction preflight must reuse configured Guard V2 behind Professional planTier");\nif(!inventory.includes('POST /api/customer/web3/transaction-preflight'))throw new Error("customer transaction preflight missing from production route inventory");\nif(!generator.includes('case path == "/api/customer/web3/transaction-preflight":'))throw new Error("OpenAPI auth classifier missing customer preflight");\nif(!accessTest.includes('Professional covers transaction preflight and advanced radar surfaces'))throw new Error("product tier contract not updated for customer preflight");\nif(/apiKeyEnterprise[^\\n]*transaction-preflight/.test(server))throw new Error("customer transaction preflight must not require developer API key");\nif(server.includes('planTier("starter", method("POST", h.TransactionGuardV2Configured))'))throw new Error("customer transaction preflight must not be Starter-gated");\nconsole.log("customer transaction preflight v1 contract ok");\n''')
          PY
          gofmt -w koschei/api/internal/http/server.go koschei/api/internal/http/route_inventory.go koschei/api/internal/http/server_access_test.go koschei/api/internal/openapi/generator.go
      - name: Verify facade and API contract
        working-directory: koschei/api
        run: |
          node ./scripts/verify-customer-transaction-preflight-v1.js
          go test ./internal/http ./internal/handlers -count=1
          go run ./cmd/openapi-gen
          go run ./cmd/openapi-gen -check
          go test ./internal/openapi -count=1
          git diff --check
      - name: Verify exact scope
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^koschei/api/internal/http/(server|route_inventory|server_access_test)\.go$|^koschei/api/internal/openapi/generator\.go$|^koschei/api/scripts/verify-customer-transaction-preflight-v1\.js$|^koschei/api/openapi\.yaml$' || true)"
          test -z "$unexpected"
      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/internal/http/server.go koschei/api/internal/http/route_inventory.go koschei/api/internal/http/server_access_test.go koschei/api/internal/openapi/generator.go koschei/api/scripts/verify-customer-transaction-preflight-v1.js koschei/api/openapi.yaml
          git commit -m 'feat(customer): expose Professional transaction preflight'
          git push origin HEAD:feat/customer-transaction-preflight-v1-current
