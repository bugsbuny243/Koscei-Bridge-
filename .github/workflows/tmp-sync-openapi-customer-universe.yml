name: Temporary OpenAPI Sync Professional Auth

on:
  push:
    branches:
      - fix/professional-auth-contract-v1
    paths:
      - "koschei/api/internal/http/**"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/openapi.yaml"
      - ".github/workflows/tmp-sync-openapi-customer-universe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-openapi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/professional-auth-contract-v1
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Regenerate exact OpenAPI contract
        working-directory: koschei/api
        run: |
          gofmt -w internal/openapi/generator.go internal/openapi/inventory.go
          go run ./cmd/openapi-gen
      - name: Commit generated contract when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- koschei/api/internal/openapi/generator.go koschei/api/internal/openapi/inventory.go koschei/api/openapi.yaml; then
            echo "OpenAPI already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/internal/openapi/generator.go koschei/api/internal/openapi/inventory.go koschei/api/openapi.yaml
          git commit -m "chore(openapi): sync Professional authorization contract"
          git push origin HEAD:fix/professional-auth-contract-v1
