name: Temporary Owner Web3 State Recipient Sync

on:
  workflow_dispatch:
  push:
    branches:
      - feat/owner-web3-lab-state-recipient-v1
    paths:
      - .github/workflows/tmp-owner-web3-state-recipient-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/owner-web3-lab-state-recipient-v1
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Patch owner Web3 state and recipient tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          server='koschei/api/internal/http/server.go'
          replace(server,
              '\tmux.HandleFunc("/api/owner/web3/transaction-guard", requiresDB(h, ownerOnly(h, requireRuntimeFeature(featureSolana, method("POST", h.TransactionGuardV2Configured)))))\n\tmux.HandleFunc("/api/owner/web3/defense-validation",',
              '\tmux.HandleFunc("/api/owner/web3/transaction-guard", requiresDB(h, ownerOnly(h, requireRuntimeFeature(featureSolana, method("POST", h.TransactionGuardV2Configured)))))\n\tmux.HandleFunc("/api/owner/web3/transaction-guard/state-recheck", requiresDB(h, ownerOnly(h, requireRuntimeFeature(featureSolana, method("POST", h.TransactionGuardStateRecheck)))))\n\tmux.HandleFunc("/api/owner/web3/address-poisoning/check", requiresDB(h, ownerOnly(h, requireRuntimeFeature(featureSolana, method("POST", h.AddressPoisoningCheck)))))\n\tmux.HandleFunc("/api/owner/web3/defense-validation",')

          inventory='koschei/api/internal/http/route_inventory.go'
          replace(inventory,
              '"POST /api/owner/web3/shield/preflight", "POST /api/owner/web3/transaction-guard", "POST /api/owner/web3/defense-validation", "POST /api/owner/web3/execution-assurance/safe/verify",',
              '"POST /api/owner/web3/shield/preflight", "POST /api/owner/web3/transaction-guard", "POST /api/owner/web3/transaction-guard/state-recheck", "POST /api/owner/web3/address-poisoning/check", "POST /api/owner/web3/defense-validation", "POST /api/owner/web3/execution-assurance/safe/verify",')

          lab='koschei/api/public/js/owner-web3-lab.js'
          replace(lab,
              "  guard:{label:'Transaction Guard V2',endpoint:'/api/owner/web3/transaction-guard',template:{transaction:'',encoding:'base64',network:'solana-mainnet',wallet:'',expected_programs:[],required_programs:[],blocked_programs:[],accounts:[]}},\n  defense:",
              "  guard:{label:'Transaction Guard V2',endpoint:'/api/owner/web3/transaction-guard',template:{transaction:'',encoding:'base64',network:'solana-mainnet',wallet:'',expected_programs:[],required_programs:[],blocked_programs:[],accounts:[]}},\n  state:{label:'State Witness Recheck',endpoint:'/api/owner/web3/transaction-guard/state-recheck',template:{permit_token:'',transaction:'',network:'solana-mainnet',state_witness:{}}},\n  poison:{label:'Address Poisoning Shield',endpoint:'/api/owner/web3/address-poisoning/check',template:{wallet:'',candidate:'',network:'solana-mainnet',known_contacts:[],limit:12}},\n  defense:")
          replace(lab,
              "if($('pageEyebrow'))$('pageEyebrow').textContent='ARVIS · PREFLIGHT · DEFENSE VALIDATION · EXECUTION ASSURANCE';",
              "if($('pageEyebrow'))$('pageEyebrow').textContent='ARVIS · PREFLIGHT · STATE RECHECK · RECIPIENT SHIELD · DEFENSE VALIDATION · EXECUTION ASSURANCE';")
          replace(lab,
              "  const report=obj(result?.report),final=obj(result?.final_verdict),program=obj(result?.program_policy),intent=obj(result?.intent_policy);\n  const rows=[];",
              "  const report=obj(result?.report),final=obj(result?.final_verdict),program=obj(result?.program_policy),intent=obj(result?.intent_policy),decision=obj(result?.decision);\n  const rows=[];")
          replace(lab,
              "  push('Decision',result?.decision||result?.action||result?.policy_outcome||report.decision||report.status);",
              "  push('Decision',decision.status||decision.decision||result?.action||result?.policy_outcome||result?.policy||report.decision||report.status);")
          replace(lab,
              "  push('Verified observations',result?.verified_observations);\n  push('Programs complete',program.complete);",
              "  push('Verified observations',result?.verified_observations);\n  push('Safe to proceed',result?.safe_to_proceed);\n  push('Policy',result?.policy);\n  push('Risk level',result?.risk_level);\n  push('Observed contacts',result?.observed_contact_count);\n  push('Programs complete',program.complete);")
          replace(lab,
              "  const report=obj(result?.report),attack=obj(result?.attack_path||report.attack_path),program=obj(result?.program_policy),intent=obj(result?.intent_policy);\n  const out=[];",
              "  const report=obj(result?.report),attack=obj(result?.attack_path||report.attack_path),program=obj(result?.program_policy),intent=obj(result?.intent_policy),decision=obj(result?.decision),rpc=obj(result?.rpc_evidence);\n  const out=[];\n  if(clean(decision.reason))out.push(`State recheck: ${clean(decision.reason)}`);\n  arr(result?.matches).forEach(match=>out.push([match.signal,match.known_address,match.prefix!==undefined?`prefix ${match.prefix}`:'',match.suffix!==undefined?`suffix ${match.suffix}`:''].filter(Boolean).join(' · ')));\n  if(rpc.collected===true)out.push(`Recipient evidence: ${Number(rpc.signature_count||0)} recent signatures · ${Number(rpc.contact_count||0)} observed contacts`);")
          replace(lab,
              "  const report=obj(result?.report),attack=obj(result?.attack_path||report.attack_path),program=obj(result?.program_policy),intent=obj(result?.intent_policy),final=obj(result?.final_verdict);",
              "  const report=obj(result?.report),attack=obj(result?.attack_path||report.attack_path),program=obj(result?.program_policy),intent=obj(result?.intent_policy),final=obj(result?.final_verdict),decisionObj=obj(result?.decision);")
          replace(lab,
              "    product:clean(result?.product)||TOOL_DEFS[type]?.label||'Koschei Web3',\n    target:clean(result?.target||result?.wallet||result?.computed_safe_tx_hash||result?.scenario_contract_hash||result?.request_id||report.target||report.run_ref),",
              "    product:clean(result?.product||result?.module)||TOOL_DEFS[type]?.label||'Koschei Web3',\n    target:clean(result?.target||result?.candidate||result?.wallet||result?.computed_safe_tx_hash||result?.scenario_contract_hash||result?.request_id||report.target||report.run_ref),")
          replace(lab,
              "    decision:clean(result?.decision||result?.action||result?.policy_outcome||report.decision||report.status),\n    status:clean(result?.status||result?.report_status||report.status),\n    summary:clean(result?.summary||result?.verdict||final.verdict||report.summary),",
              "    decision:clean(decisionObj.status||decisionObj.decision||result?.action||result?.policy_outcome||result?.policy||report.decision||report.status),\n    status:clean(result?.status||result?.report_status||decisionObj.status||report.status),\n    summary:clean(result?.summary||result?.verdict||decisionObj.reason||final.verdict||report.summary),")
          replace(lab,
              "Bu laboratuvar Shield Preflight, Transaction Guard V2, Defense Validation ve Safe Execution Assurance endpoint'lerini owner session üzerinden çalıştırır.",
              "Bu laboratuvar Shield Preflight, Transaction Guard V2, State Witness Recheck, Address Poisoning Shield, Defense Validation ve Safe Execution Assurance endpoint'lerini owner session üzerinden çalıştırır.")

          verify='koschei/api/scripts/verify-customer-investigation-ui.js'
          replace(verify,
              "  '/api/owner/web3/transaction-guard',\n  '/api/owner/web3/defense-validation',",
              "  '/api/owner/web3/transaction-guard',\n  '/api/owner/web3/transaction-guard/state-recheck',\n  '/api/owner/web3/address-poisoning/check',\n  '/api/owner/web3/defense-validation',")
          replace(verify,
              "  'Transaction Guard V2',\n  'Defense Validation',",
              "  'Transaction Guard V2',\n  'State Witness Recheck',\n  'Address Poisoning Shield',\n  'Defense Validation',")
          replace(verify,
              "for (const forbidden of ['canonical_base64', 'execution_proof', 'proof_attestation', 'transaction:']) {",
              "for (const forbidden of ['canonical_base64', 'execution_proof', 'proof_attestation', 'permit_token', 'state_witness', 'transaction:']) {")
          PY
      - name: Format Go route files
        working-directory: koschei/api
        run: gofmt -w internal/http/server.go internal/http/route_inventory.go
      - name: Verify owner UI contract
        working-directory: koschei/api
        run: node scripts/verify-customer-investigation-ui.js
      - name: Test affected Go packages
        working-directory: koschei/api
        run: go test ./internal/http ./internal/handlers
      - name: Generate exact OpenAPI contract
        working-directory: koschei/api
        run: go run ./cmd/openapi-gen
      - name: Commit synchronized product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/internal/http/server.go koschei/api/internal/http/route_inventory.go koschei/api/public/js/owner-web3-lab.js koschei/api/scripts/verify-customer-investigation-ui.js koschei/api/openapi.yaml
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "feat(owner): add state recheck and recipient shield"
          git push origin HEAD:feat/owner-web3-lab-state-recipient-v1
